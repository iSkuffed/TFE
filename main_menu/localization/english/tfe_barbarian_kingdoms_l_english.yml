l_english:
 tfe_reform_into_a_monarchy.title: "Reform into a Monarchy"
 tfe_reform_into_a_monarchy.desc: "Our warriors have land now, and land needs a king who stays. The war-leader's hall becomes a court, his companions become counts who owe him aid and counsel, and the law of the host becomes the law of the realm."
 tfe_reform_into_a_monarchy.a: "Long live the king."
 tfe_accept_majority_culture.title: "Honour the Tongue of the Land"
 tfe_accept_majority_culture.desc: "Our children already speak the language of the fields and the market. Let the court honour it too: the people of the land stand beside our own, and our own tongue keeps its place."
 tfe_accept_majority_culture.a: "They are our people too."
 tfe_convert_to_majority_religion.title: "Kneel at the People's Altars"
 tfe_convert_to_majority_religion.desc: "Our priests and our subjects' priests do not share a table, and our subjects notice. The king and his house will worship as the land worships."
 tfe_convert_to_majority_religion.a: "One faith for king and people."
 tfe_cross_the_rhine.title: "Cross the Rhine"
 tfe_cross_the_rhine.desc: "We will not leave the land of our fathers, but the land across the river is rich and its garrisons are thin. Every warrior of the Salians joins the host for one great raid into Roman Gaul, and the towns we take will send us men."
 tfe_cross_the_rhine.a: "Over the river!"
 tfe_barbarian_kingdoms.1.title: "The Host Settles"
 tfe_barbarian_kingdoms.2.title: "The Crown's Privileges"
 cb_tfe_cross_the_rhine: "Raid over the Rhine"
 cb_tfe_cross_the_rhine_desc: "The whole people has crossed the river, and it will not go home empty-handed."
 STATIC_MODIFIER_NAME_tfe_lords_of_the_land: "Lords of the Land"
 STATIC_MODIFIER_DESC_tfe_lords_of_the_land: "We rule a people far greater than our own, and we have taken its tongue beside ours. Our kings speak to their subjects in words they understand."
 STATIC_MODIFIER_NAME_tfe_settled_by_the_host: "Settled by the Host"
 STATIC_MODIFIER_DESC_tfe_settled_by_the_host: "Our own people took up farms here when the host came to rest. Their headmen know the land, and the land is quick to answer to us."
 tfe_host_kingdom_tt: "#R We can never take the road again.#!\nOur nobles are granted #Y Auxilium et Consilium#!, and we learn #Y Feudalism#! and #Y Knights#!."
 tfe_rhine_crossed_tt: "We have not crossed the Rhine in the last ten years"
 tfe_cross_the_rhine_tt: "#R We declare war on the Western Roman Empire across the river.#!\nTwenty-four regiments of footmen and eight of tribal cavalry join our host. Until the war ends our [army|e] costs nothing to maintain, and every Roman town we take sends it men."
 AUTO_MODIFIER_NAME_tfe_rhine_host: "Raid over the Rhine"
