 name_victricius: "Victricius"
 name_porphyry: "Porphyry"
 name_sigesar: "Sigesar"
 name_ajax: "Ajax"
 STATIC_MODIFIER_NAME_tfe_mission_preaching: "A Missionary Preaches"
 STATIC_MODIFIER_DESC_tfe_mission_preaching: "A man of God has come to live among these people, and they come to hear him."
 STATIC_MODIFIER_NAME_tfe_temples_closed: "The Temples Closed"
 STATIC_MODIFIER_DESC_tfe_temples_closed: "The edicts against the sacrifices are enforced in our lands."
 STATIC_MODIFIER_NAME_tfe_new_faith_resented: "The Old Gods Abandoned"
 STATIC_MODIFIER_DESC_tfe_new_faith_resented: "The nobles who kept the sacrifices with their king resent the font."
 STATIC_MODIFIER_NAME_tfe_old_gods_kept: "The Old Gods Kept"
 STATIC_MODIFIER_DESC_tfe_old_gods_kept: "The priests of the old gods rejoice, but the people drift to the Christ all the same."
 tfe_the_faith: "The Faith"
 tfe_sponsor_mission.title: "Sponsor a Mission"
 tfe_sponsor_mission.desc: "A priest of our faith asks for a mule, a gospel book and a letter of protection, and he will go to the people beyond our towns who still sacrifice to the old gods."
 tfe_sponsor_mission.a: "Go with God."
 tfe_close_the_temples.title: "Close the Temples"
 tfe_close_the_temples.desc: "Theodosius forbade the sacrifices and shut the temples, but in the villages the altars still smoke. Enforce the edicts: send the soldiers with the bishops, and let the old gods starve."
 tfe_close_the_temples.a: "The edicts will be obeyed."
 tfe_mission_price_tt: "We have the gold for a mission ([tfe_mission_price])"
 tfe_mission_on_the_road_tt: "None of our missionaries is still on the road"
 tfe_mission_sponsored_tt: "We have not sponsored a mission in the last 5 years"
 tfe_temples_already_closed_tt: "The temples are not already closed"
 tfe_sponsor_mission_tt: "A missionary of our faith sets out for the most populous pagan place in or beside our lands, and preaches there for 5 to 10 years."
 tfe_close_the_temples_tt: "For 10 years our faith spreads half again as fast and more of our priests go out to the pagans. Every pagan in our lands loses 10% satisfaction, and in a quarter of the pagan places they lose 25% more."
 tfe_conversion.1.title: "The King and the Cross"
 tfe_conversion.1.desc: "Most of our people now pray to the Christ, in our villages as in our towns, and their priests ask why the king still sacrifices to gods his people have left. Clovis's bishops would say a king who kneels at the font wins a kingdom. Our own priests say a king who betrays the gods loses his luck."
 tfe_conversion.1.a: "Kneel at the font."
 tfe_conversion.1.b: "We keep faith with the gods of our fathers."
 tfe_missionary: "A Mission"
 tfe_missionary_desc: "A man of God on the road with a staff and a gospel book, bound for people who still sacrifice to the old gods."
