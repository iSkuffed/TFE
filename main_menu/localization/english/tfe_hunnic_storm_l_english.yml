l_english:
 tfe_hunnic_storm: "The Hunnic Storm"
 tfe_hunnic_storm_desc: "Out of the steppe beyond the Don rode the Huns, and every people in their path paid, fled or fell. Now their kings gather the tribute of half a continent, and both Romes watch the horizon."
 TFE_STORM_PHASE_1: "The Stirring"
 TFE_STORM_PHASE_1_DESC: "The Huns raid their neighbours and bring them under the [GetUniqueInternationalOrganization('tfe_hunnic_yoke').GetName]."
 TFE_STORM_PHASE_1_GOAL: "#Y The Scourge rises#! when either:\n$BULLET$at least #Y 7#! peoples pay the Huns tribute, and a Roman empire is one of them, or\n$BULLET$it is #Y 434#! or later and at least #Y 5#! peoples pay them tribute.\nThe Huns hold #Y $TFE_STORM_TRIBUTARY_COUNT$#! subject peoples now."
 TFE_STORM_PHASE_2: "The Scourge"
 TFE_STORM_PHASE_2_DESC: "The ruler of the Huns may take the title Scourge of God. Any people outside the Yoke may declare a [ShowCasusBelliName('cb_tfe_stand_against_the_scourge')] war."
 TFE_STORM_PHASE_2_GOAL: "#Y The Reckoning begins#! when either:\n$BULLET$the Scourge of God dies, or\n$BULLET$any ruler of the Huns dies after ten years of the Scourge."
 TFE_STORM_PHASE_3: "The Reckoning"
 TFE_STORM_PHASE_3_DESC: "The subject peoples rise to break the Yoke."
 TFE_STORM_PHASE_3_GOAL: "#Y The Yoke breaks#! once the Huns have lost half of the #Y [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('tfe_reckoning_peoples').GetValue|0]#! subject peoples they held when the Reckoning began.\n#Y The Huns endure#! if they hold on for ten years.\nThe Huns hold #Y $TFE_STORM_TRIBUTARY_COUNT$#! subject peoples now."
 TFE_STORM_TRIBUTARY_COUNT: "[Subtract_CFixedPoint(GetCountry('HNS').MakeScope.ScriptValue('tfe_yoke_size'), '(CFixedPoint)1')|0]"
 TFE_STORM_TRIBUTARIES: "Under the [GetUniqueInternationalOrganization('tfe_hunnic_yoke').GetName]"
 TFE_STORM_GUIDE: "#weak #T What the Envoys Report#!\nThe Huns do not ask. Their riders come with a [ShowCasusBelliName('cb_tfe_submit_to_the_yoke')] war, and the beaten send a hundredth of all their trade and tax to the Hunnic camp, year on year. A people with spears enough may throw that off in a [ShowCasusBelliName('cb_tfe_break_the_yoke')] war.\n\nFor 10 prestige the Huns may choose a neighbour and ride out on a [ShowCasusBelliName('cb_tfe_grand_raid')]. Whoever loses one, Rome included, joins the Yoke and pays it tribute.\n\nWhere the Huns ride, the people are driven off with the herds: from every land they occupy, peasants and labourers walk east to the Hunnic capital as slaves.\n\nWhen the Scourge of God dies, every subject people weighs its chances. If half of them break away, the Yoke is broken and the Storm passes. If the Huns hold them for ten years, the Huns endure.#!"
 TFE_STORM_HUNS: "The Huns"
 TFE_STORM_YOKE: "Under the Hunnic Yoke"
 TFE_STORM_SUBSIDY: "Pays the Huns tribute as a member of the Yoke"

 tfe_hunnic_yoke: "Hunnic Yoke"
 tfe_hunnic_yoke_desc: "The peoples of the steppe and the forest who pay tribute to the Huns. None join by choice and none leave but by war."
 tfe_hunnic_yoke_LEADER_MALE: "King of the Huns"
 tfe_hunnic_yoke_LEADER_FEMALE: "Queen of the Huns"
 tfe_hunnic_overlord: "Hunnic Overlord"
 tfe_hunnic_overlord_plural: "Hunnic Overlords"
 tfe_hunnic_overlord_desc: "The $tfe_hunnic_overlord$ rules the [GetUniqueInternationalOrganization('tfe_hunnic_yoke').GetName] and takes its tribute."
 tfe_hunnic_tribute: "Hunnic Tribute"
 tfe_hunnic_tribute_desc: "Gold from every people under the Yoke, delivered to the [ShowSpecialStatusName('tfe_hunnic_overlord')]."
 tfe_hunnic_tribute_price: "Hunnic Tribute"
 TFE_HUNNIC_TRIBUTE_MULTIPLIER: "1% of the members' trade and tax income"
 io_opinion_tfe_hunnic_yoke: "In the same Hunnic Yoke"

 cb_tfe_submit_to_the_yoke: "Submit to the Yoke"
 cb_tfe_submit_to_the_yoke_desc: "They live beside our tributaries and pay us nothing. Let them learn the price of our peace."
 cb_tfe_grand_raid: "Grand Raid"
 cb_tfe_grand_raid_desc: "Our neighbours are rich and their frontier is long. Ride in, burn what will burn, and let them buy us off."
 cb_tfe_break_the_yoke: "Break the Hunnic Yoke"
 cb_tfe_break_the_yoke_desc: "We will pay the Huns no more."
 cb_tfe_stand_against_the_scourge: "Stand Against the Scourge"
 cb_tfe_stand_against_the_scourge_desc: "The Scourge of God rides. Meet the Huns in the field before he reaches our walls."
 war_goal_tfe_submit_to_the_yoke: "Submit to the Yoke"
 war_goal_tfe_submit_to_the_yoke_desc: "[war_goal|e] is to win more battles than our enemy and bring them under the Hunnic Yoke."
 war_goal_tfe_grand_raid: "Grand Raid"
 war_goal_tfe_grand_raid_desc: "[war_goal|e] is to win more battles than our enemy and bring them under the Hunnic Yoke, to pay for peace."

 tfe_force_into_hunnic_yoke: "Submit to the Hunnic Yoke"
 tfe_force_into_hunnic_yoke_entry: "$tfe_force_into_hunnic_yoke$"
 tfe_force_into_hunnic_yoke_entry_short: "$tfe_force_into_hunnic_yoke$"
 tfe_force_into_hunnic_yoke_desc: "They will join the [GetUniqueInternationalOrganization('tfe_hunnic_yoke').GetName] and pay its tribute."
 tfe_pay_the_hunnic_subsidy: "Join the Hunnic Yoke"
 tfe_pay_the_hunnic_subsidy_entry: "$tfe_pay_the_hunnic_subsidy$"
 tfe_pay_the_hunnic_subsidy_entry_short: "$tfe_pay_the_hunnic_subsidy$"
 tfe_pay_the_hunnic_subsidy_desc: "Tribute every month, as Theodosius II paid Attila."
 tfe_pay_the_hunnic_subsidy_tt: "They join the Hunnic Yoke and pay the Huns its tribute every month until the Yoke is broken. While a Roman empire pays, the Imperium Romanum loses Unity."
 tfe_break_from_hunnic_yoke: "Break Free from the Hunnic Yoke"
 tfe_break_from_hunnic_yoke_entry: "$tfe_break_from_hunnic_yoke$"
 tfe_break_from_hunnic_yoke_entry_short: "$tfe_break_from_hunnic_yoke$"
 tfe_break_from_hunnic_yoke_desc: "We and our subjects leave the [GetUniqueInternationalOrganization('tfe_hunnic_yoke').GetName]."

 tfe_break_the_yoke: "Break the Hunnic Yoke"
 tfe_break_the_yoke_desc: "Enough gold has gone east. Rise against the Huns and win our freedom in the field."
 tfe_break_the_yoke_tt: "We will declare a [ShowCasusBelliName('cb_tfe_break_the_yoke')] [war|e] on the Huns. Once the [ShowPeaceTreatyTypeName('tfe_break_from_hunnic_yoke')] is enforced we will leave the [GetUniqueInternationalOrganization('tfe_hunnic_yoke').GetName]."
 tfe_take_the_scourge_title: "Take the Title Scourge of God"
 tfe_take_the_scourge_title_desc: "Let the Romans name us as they fear us. Our ruler will be the Scourge of God."
 tfe_take_the_scourge_title_tt: "When the Scourge of God dies, the Reckoning begins."

 tfe_scourge_of_god: "Scourge of God"
 desc_tfe_scourge_of_god: "Where this ruler's horse has trodden, the grass does not grow again."
 tfe_scourge_of_god_die_desc: "The Scourge of God is dead, and the peoples of the Yoke are counting the Huns' swords."

 STATIC_MODIFIER_NAME_tfe_huns_endure: "The Huns Endure"
 STATIC_MODIFIER_DESC_tfe_huns_endure: "The Scourge is dead, yet the Yoke held. The peoples of the steppe remember who kept it."

 tfe_hunnic_storm.1.title: "The Scourge Rises"
 tfe_hunnic_storm.1.desc.subsidy: "Eight peoples pay the Huns tribute, and now a Roman emperor has joined the Yoke and pays them too. Gold buys the Empire a little peace and buys the Huns a great deal of war. Soon a ruler of the Huns may take the title Scourge of God."
 tfe_hunnic_storm.1.desc.time: "A generation has passed since the Huns crossed the Don, and their Yoke has only grown. Soon a ruler of the Huns may take the title Scourge of God."
 tfe_hunnic_storm.1.a: "The world will learn our name."
 tfe_hunnic_storm.1.b: "Look to the frontier."
 tfe_hunnic_storm.2.title: "The Huns Are Coming"
 tfe_hunnic_storm.2.desc: "Riders from the east have reached our pastures. Those who stayed in their path now pay the Huns tribute. You can gather the whole people and take to the road west, or stay and hold your land."
 tfe_hunnic_storm.2.a: "We take to the road."
 tfe_hunnic_storm.2.b: "This land is ours. We stay."
 tfe_hunnic_storm.3.title: "The Reckoning"
 tfe_hunnic_storm.3.desc: "The Scourge is dead and the heirs quarrel over the herds. Every people under the Yoke is asking the same question: if not now, when?"
 tfe_hunnic_storm.3.a: "Rise! Break the Yoke!"
 tfe_hunnic_storm.3.b: "Better the Huns we know."
 tfe_hunnic_storm.4.title: "The Yoke Is Broken"
 tfe_hunnic_storm.4.desc: "By the river Nedao the subject peoples met the Huns and cut them down. The tribute empire is gone, and the steppe belongs to whoever can hold it."
 tfe_hunnic_storm.4.a: "The Storm has passed."
 tfe_hunnic_storm.4.b: "We have lost the Yoke."
 tfe_hunnic_storm.5.title: "The Huns Endure"
 tfe_hunnic_storm.5.desc: "The Scourge is dead, but the heirs kept their grip. For ten years the subject peoples tested the Huns, and the Yoke held."
 tfe_hunnic_storm.5.a: "The Yoke is ours still."
 tfe_hunnic_storm.5.b: "The Huns are not finished."
 tfe_huns_endure_tt: "The Huns gain $STATIC_MODIFIER_NAME_tfe_huns_endure$ for 30 years."
 tfe_storm_resolved_tt: "The Reckoning is decided: the Yoke is broken, or the Huns have endured"
 tfe_storm_yoke_gone_tt: "The Hunnic Yoke has fallen apart before the Reckoning"

 tfe_feast_the_subject_kings: "Feast the Subject Kings"
 tfe_feast_the_subject_kings_desc: "Roast the horses, open the wine taken from Roman wagons, and let every king of the Yoke drink from the gold cups at our table. A fed guest does not reach for his sword."
 tfe_feast_the_subject_kings_tt: "Every subject people of the [GetUniqueInternationalOrganization('tfe_hunnic_yoke').GetName] thinks better of the Huns, and for 10 years is less likely to rise in the Reckoning."
 tfe_demand_greater_tribute: "Demand Greater Tribute"
 tfe_demand_greater_tribute_desc: "The herds are thin and the warriors want gold. The subject peoples will give twice what they gave."
 tfe_demand_greater_tribute_tt: "For 5 years the Hunnic Tribute is doubled. Every subject people thinks less of the Huns, and for 10 years is more likely to rise in the Reckoning."
 tfe_win_the_huns_favour: "Win the Huns' Favour"
 tfe_win_the_huns_favour_desc: "Furs, amber and silver for the Hunnic king's wives. The favoured pay less, and the rest of the Yoke makes up the difference."
 tfe_win_the_huns_favour_tt: "For 10 years our share of the Hunnic Tribute is halved."
 tfe_send_gifts_to_the_hunnic_court: "Send Gifts to the Hunnic Court"
 tfe_send_gifts_to_the_hunnic_court_desc: "Better a cartload of silver now than the riders at harvest time."
 tfe_submit_to_the_huns: "Submit to the Huns"
 tfe_submit_to_the_huns_desc: "We cannot stand against them. Better to bow, pay and keep our land than to be driven from it."
 tfe_hire_hunnic_horsemen: "Hire Hunnic Horsemen"
 tfe_hire_hunnic_horsemen_desc: "The Huns will fight for anyone who pays, even against Goths and Burgundians. Aetius knew it, and so do we."
 tfe_hire_hunnic_horsemen_tt: "A band of Hunnic horse archers enters our service for 10 years."
 tfe_hunnic_horsemen: "Hunnic Horsemen"
 tfe_pay_the_huns_for_peace: "Pay the Huns for Peace"
 tfe_pay_the_huns_for_peace_desc: "Call it a subsidy, call it a gift to our allies. It is cheaper than a war on the Danube."
 tfe_hunnic_raid_prestige: "The Grand Raid"
 tfe_grand_raid: "Grand Raid"
 tfe_grand_raid_entry: "$tfe_grand_raid$"
 tfe_grand_raid_entry_short: "$tfe_grand_raid$"
 tfe_grand_raid_desc: "Choose a neighbour and ride out against it. Its wealth is ours, if we can take it."
 tfe_grand_raid_tt: "The Huns win a [ShowCasusBelliName('cb_tfe_grand_raid')] casus belli on the chosen neighbour for 5 years. The loser joins the Hunnic Yoke and pays its tribute."
 tfe_grand_raid_prestige_cost: "The price of a Grand Raid"
 tfe_grand_raid_choose_country: "Choose the neighbour to raid"
 tfe_cast_off_the_tribute_tt: "We stop paying the Huns: we are their tributary no more."
 tfe_pay_the_huns_for_peace_tt: "We join the Hunnic Yoke and pay the Huns its tribute every month until the Yoke is broken, and win 10 years of truce. While a Roman empire pays, the Imperium Romanum loses Unity."

 tfe_hunnic_storm_gold: "Gifts for the Huns"
 tfe_six_months_income: "Six months of trade and tax income"
 tfe_one_years_income: "A year of trade and tax income"
 tfe_three_months_income: "Three months of trade and tax income"
 tfe_hunnic_feast: "Feasted by the Huns"
 tfe_hunnic_greater_tribute: "Bled by the Huns"
 tfe_hunnic_gifts: "Sent Gifts"
 diplomatic_status_tfe_hunnic_yoke_name: "Hunnic Yoke"
 diplomatic_status_tfe_hunnic_yoke_tooltip: "#T Hunnic Yoke#!\nThis [country|e] answers to the Huns."
 tfe_hunnic_yoke_list_who_tt: "$WHO$ bears the Hunnic Yoke with $LIST$"
