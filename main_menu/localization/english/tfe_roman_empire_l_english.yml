l_english:
 tfe_roman_empire: "Imperium Romanum"
 tfe_roman_empire_desc: "Though two Augusti rule from Mediolanum and Constantinople, there is still one Roman Empire: one law, one citizenship, one consulship."
 tfe_unity: "Unity"
 tfe_unity_desc: "How far the two halves of the Empire still act as one. At 75 or more their armies march freely through each other's lands, they defend each other automatically and they gain prestige. Below 50 they can no longer be counted on for help, and the Augusti may go to war with each other."
 tfe_unity_DISPLAY: "$VAL|0$"
 TFE_UNITY_DRIFT: "The halves drift apart"
 TFE_UNITY_ONE_DYNASTY: "Both Augusti share a dynasty"
 TFE_UNITY_COMMON_ENEMY: "Fighting a common enemy"
 TFE_UNITY_WEST_RESENTS: "The West resents the East"
 TFE_UNITY_EAST_RESENTS: "The East resents the West"
 TFE_UNITY_DISPUTED_LANDS: "Claims on the other half's lands"
 TFE_UNITY_ACCESS_DENIED: "Military access refused"
 TFE_UNITY_CIVIL_WAR: "The Augusti are at war"
 TFE_UNITY_HOLDS: "The Empire is still one"
 cb_tfe_war_of_the_augusti: "War of the Augusti"
 cb_tfe_war_of_the_augusti_desc: "Unity has collapsed. The other Augustus is a usurper in all but name."
