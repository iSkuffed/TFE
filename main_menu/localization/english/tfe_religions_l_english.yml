l_english:
 arianism: "Arianism"
 arianism_ADJ: "Arian"
 arianism_desc: "The Homoian faith of Ulfilas, apostle of the Goths, who put the Bible into Gothic: the Son is like the Father, but not of one substance with Him. Condemned at Nicaea and Constantinople, it is the creed of the Goths, the Gepids and the peoples who learn their faith from them."
 donatism: "Donatism"
 donatism_ADJ: "Donatist"
 donatism_desc: "The church of Donatus, which would not take back the bishops who handed over the Scriptures in the Great Persecution. For ninety years it has held Numidia against the Catholics of Carthage and Hippo, and its Circumcellions haunt the olive country."
 celtic_paganism: "Celtic Paganism"
 celtic_paganism_ADJ: "Celtic"
 celtic_paganism_desc: "The gods of the druids and of the countryside of Britain and Ireland: Lugus of the many skills, Taranis of the wheel, Nodens of the healing springs and Sulis of the hot waters at Bath."
 slavic_paganism: "Slavic Paganism"
 slavic_paganism_ADJ: "Slavic"
 slavic_paganism_desc: "The faith of the Venedi of the forest: Perun of the thunder and the oak, Veles of the herds and the underworld, and the household spirits of the field and hearth."
 arabian_paganism: "Arabian Paganism"
 arabian_paganism_ADJ: "Arabian"
 arabian_paganism_desc: "The gods of the Arabs: Hubal and the idols of the Kaaba at Mecca, al-Lat, al-Uzza the morning star and Manat of fate, worshipped at sacred stones and in the pilgrim fairs of the holy months."
