l_english:
 arianism: "Arianism"
 arianism_ADJ: "Arian"
 arianism_desc: "The Homoian faith of Ulfilas, apostle of the Goths, who put the Bible into Gothic: the Son is like the Father, but not of one substance with Him. Condemned at Nicaea and Constantinople, it is the creed of the Goths, the Gepids and the peoples who learn their faith from them."
 donatism: "Donatism"
 donatism_ADJ: "Donatist"
 donatism_desc: "The church of Donatus, which would not take back the bishops who handed over the Scriptures in the Great Persecution. For ninety years it has held Numidia against the Catholics of Carthage and Hippo, and its Circumcellions haunt the olive country."
 celtic_paganism: "Celtic Paganism"
 celtic_paganism_ADJ: "Celtic"
 celtic_paganism_desc: "The gods of the druids and of the countryside of Britain and Ireland: Lugus of the many skills, Taranis of the wheel, Nodens of the healing springs and Sulis of the hot waters at Bath."
 slavic_paganism: "Slavic Paganism"
 slavic_paganism_ADJ: "Slavic"
 slavic_paganism_desc: "The faith of the Venedi of the forest: Perun of the thunder and the oak, Veles of the herds and the underworld, and the household spirits of the field and hearth."
 arabian_paganism: "Arabian Paganism"
 arabian_paganism_ADJ: "Arabian"
 arabian_paganism_desc: "The gods of the Arabs: Hubal and the idols of the Kaaba at Mecca, al-Lat, al-Uzza the morning star and Manat of fate, worshipped at sacred stones and in the pilgrim fairs of the holy months."
 kushite_religion: "Kushite Religion"
 kushite_religion_ADJ: "Kushite"
 kushite_religion_desc: "The faith of the Kingdom of Kush, outliving Meroë itself: Amun of Napata and the lion-headed Apedemak, and Isis of Philae, whose island temple the Nobades and Blemmyes still visit under treaty with Rome."
 religio_romana: "Religio Romana"
 religio_romana_ADJ: "Roman Pagan"
 religio_romana_desc: "The ancestral rites of Rome: Jupiter Best and Greatest on the Capitol, Vesta's fire, the Lares of every farm and the Genius of the Emperor. Theodosius has closed the temples, but the senate of Symmachus, the villa lords and the pagani of the countryside keep the old ways."
 priscillianism: "Priscillianism"
 priscillianism_ADJ: "Priscillianist"
 priscillianism_desc: "The followers of Priscillian, bishop of Avila, whose fasting, lay preaching and secret books drew half of Gallaecia. He was the first Christian put to death for heresy, at Trier in 385, and his body was carried home and venerated as a martyr's."
 montanism: "Montanism"
 montanism_ADJ: "Montanist"
 montanism_desc: "The New Prophecy of Montanus and the prophetesses Priscilla and Maximilla, who spoke in the Spirit and awaited the heavenly Jerusalem at Pepuza in Phrygia. Two centuries of condemnation have not emptied its villages."
 messalianism: "Messalianism"
 messalianism_ADJ: "Messalian"
 messalianism_desc: "The Euchites, 'those who pray', wandering monks of Mesopotamia and Syria who teach that a demon dwells in every soul and that only ceaseless prayer, not baptism, drives it out."
 nuragic_religion: "Nuragic Religion"
 nuragic_religion_ADJ: "Nuragic"
 nuragic_religion_desc: "The faith of the Barbaricini of the Sardinian highlands, who worship stones and trees beside the towers of their ancestors and will not hear of Christ for two centuries yet."
 basque_paganism: "Basque Paganism"
 basque_paganism_ADJ: "Basque"
 basque_paganism_desc: "The faith of the Vascones of the Pyrenees: Mari, lady of the mountain caves and the storms, her consort the serpent Sugaar, and the spirits of the high pastures."
 zalmoxism: "Zalmoxism"
 zalmoxism_ADJ: "Zalmoxian"
 zalmoxism_desc: "The faith of the Getae and the Dacians in Zalmoxis, the god-king who went down into the earth and came back, and who promises his people life after death. The Carpi and the free Dacians keep it in the Carpathians."
 illyrian_paganism: "Illyrian Paganism"
 illyrian_paganism_ADJ: "Illyrian"
 illyrian_paganism_desc: "The Illyrians never had one pantheon, only a thousand local gods: the sun of the northern tribes and the sacred serpent of the south, Vidasus and Thana of the Topusko springs, Bindus of the Iapodes, Medaurus the rider of Risinium, Redon of the sailors and Apollo Tadenus of the sulphur springs of the Bosna. Rome gave many of them Latin names, and Silvanus of the woods became the best-loved god of Dalmatia."
 armazi_religion: "Armazi Religion"
 armazi_religion_ADJ: "Armazian"
 armazi_religion_desc: "The gods of the Iberians: Armazi of the acropolis of Mtskheta, Gatsi and Gaim, and Zaden of the harvest. King Mirian threw down their idols at Nino's word, but the mountain valleys have not followed their king."
