l_english:
 tfe_history_fallback: "We were not on the map when Theodosius died at Mediolanum. We came out of the years after it: a usurper's province, a warband that found land and kept it, a frontier town that stopped waiting for orders from a court that no longer sent any. Our claim is young and our neighbours remember what we were before.\n\nWhat we hold, we hold because no one has yet come to take it back. Roman law, a king's hall, a bishop's see: the forms we choose now will decide whether we become a people with a history of our own, or one more name in someone else's."
 tfe_history_ABG: "Our villages cling to the green slopes between the Black Sea and the mountains, north of the Roman fort at Pityus. The Abasgians have never had a king as the Romans understand one: each valley follows its own chiefs, sacrifices in its own sacred groves, and sells timber, honey and hides to the ships that call along the coast.\n\nLazica claims to speak for the whole shore, and behind Lazica stands Constantinople. The Huns raiding across the passes this year show how thin the mountains' protection really is. Our clans can stay apart and trust the forests, bow to Lazica as its loyal clients, or unite behind one prince strong enough to deal with emperors and kings as an equal."
 tfe_history_AES: "On the Amber Coast, where the Vistula meets the sea, we gather amber from the beaches, and Rome prizes it above almost anything else from the north. Tacitus wrote that we alone gather it, that we worship the Mother of the Gods and wear boar amulets, and that we farm more patiently than the Germans. For centuries our amber has gone south and Roman silver has come north in return.\n\nThat trade has faltered as Rome's frontiers have grown troubled. Goths once came to us from the south, and now the Huns rule beyond them. We have no strong enemy close at hand and deep forests at our backs. We can build a power on amber, strike out against the Rugii and the Venedi, or stay quiet at the edge of the world."
 tfe_history_AGA: "The Agaw were in the Ethiopian highlands long before Aksum: in Lasta and Wag, in Dembiya around Lake Tana, and among the Awi of Gojjam. Our clans honour the sky god and his sacred trees and springs, and our Cushitic speech is older than the tongue of Aksum. Today we pay tribute to Aksum's Christian kings, whose envoys come for cattle, gold and soldiers.\n\nAksum's priests are beginning to follow its tax collectors into our valleys. The tribute keeps Aksum's armies away, but every year the demands grow and the new faith gains a few more converts. Do we stay loyal and profit from Aksum's trade, accept the cross, or unite the Agaw clans and throw off the tribute?"
 tfe_history_AGL: "Angeln is a small country of fields and inlets at the neck of the Jutland peninsula, between the Saxons to the south and the Jutes to the north. Tacitus named us among the peoples who worship Nerthus, the Earth Mother, whose cart is drawn out of a sacred grove on an island. We are farmers and boatmen, and our ships follow the Saxon raiders along the coasts of Gaul and Britain.\n\nOur settlements are few and there is little land to divide among our sons. Across the North Sea lies Britain: rich, Christian and poorly defended, its Roman troops leaving a few more with every generation. For now we are one of the smaller northern peoples, but if Britain opens, a whole people could cross to it. We must choose between staying in Angeln and taking our families to sea."
 tfe_history_AGV: "Beyond the Kura, where the plains of Arran run down to the Caspian, the kings of Caucasian Albania rule from Kabalaka. Our kings have been Christian since Urnayr was baptised, and when Rome and Persia divided the Caucasus in 387, the Persian king rewarded our loyalty with Artsakh and Utik, taken from Armenia.\n\nThat gift made enemies of the Armenian lords, who want their lands back. North of us the Maskut hold Derbent, and this year the Huns have come through the mountains. We are Persia's shield in the Caucasus, and Persia expects the shield to take the blows. Do we remain the loyal client, grown fat on Persian favour, or find a way to be more than a shield?"
 tfe_history_AIL: "Our mothers tell of Shayi, who touched a sunken log while fishing and bore ten sons, and of Jiulong, the youngest, whom the dragon licked and made our first king. We are the Ailao of the far southwest, lords of the valleys between the Salween and the Mekong, astride the road that carries silk, cowries, jade and amber between Sichuan, the Pyu and India. The Han named our country Yongchang commandery, but in the hills a Chinese name means little.\n\nJin is weak and far away, and the great families of Nanzhong squabble over its titles. We can bow toward Jiankang and grow rich on the caravans, or close the road and tax it as our own. With so many valleys under our name, the harder task is keeping them together."
 tfe_history_AIN: "Salmon run up every river of our northern island each autumn, and our lives follow them. We are fishers and hunters of the forests and the cold coasts, heirs of the ancient Jomon who never took up the rice paddy. We honour the kamuy, the gods who come among us as bear, owl and salmon, and trade with the Emishi to the south for iron and rice.\n\nLately strangers have begun to camp on our northern shores: sea-hunters from Sakhalin who take seal and whale from skin boats and build their houses of timber by the Okhotsk sea. Do we trade with them, fight them for the coast, or look south to the iron of the Emishi and the lords beyond them?"
 tfe_history_AKA: "The Akatziri are Huns, but not Uldin's Huns. Our camps lie on the grasslands between the lower Dnieper and the Bug, where the Greek towns of the coast once bought grain from the Scythians. Many chiefs lead us, not one king, and we like it that way: a people with many chiefs is hard to conquer and harder to tax.\n\nThe great host to the east grows hungrier every year, and its leaders expect the smaller clans to ride when called. Constantinople's envoys will pay in silk and gold to any Hun who keeps away from the Danube. We can kneel to Uldin and share his plunder, sell our friendship to the Romans, or gather the scattered clans ourselves before someone else does."
 tfe_history_ALK: "Kabul and Ghazni belong to the Alkhon, the Huns who came south over the Hindu Kush. We have no mint of our own tradition, so we take the coins of Shapur and stamp them with our name and our tamga. We hold the valleys of Chitral and Kafiristan, and our horsemen are the terror of the high passes.\n\nThe Kidarites at Balkh call themselves our betters, and Persia thinks of us as brigands squatting on its land. Beyond the Khyber lie Gandhara's monasteries and the endless plains of India. Do we submit to Kidara, fight him for Bactria, or ride down into India, where the richest prize of all is waiting?"
 tfe_history_ALM: "Our name means all men, and it fits: we are many peoples under many kings, holding the Black Forest, the Neckar and the old Roman fields beyond the limes that our grandfathers took. Rome has beaten us often, Julian at Argentoratum and Gratian in our own valleys, and we have always come back across the Rhine. The forts of Raetia watch our southern edge, and the villas of Alsace glitter on the far bank.\n\nThe emperor who could crush us is dead, and his heir is a boy guarded by a general with too many wars. Rome may pay us to stay home or recruit our young men into its legions. Our kings can stay divided and raid as each pleases, or join under one hand and cross the Rhine to stay."
 tfe_history_ASK: "Armenia was the first kingdom to take the cross, and it has paid dearly for lying between two empires. In 387 Rome and Persia divided us: the western lands around Theodosiopolis became Roman provinces, and the rest went to Persia. Our king Vramshapuh, an Arsacid, has ruled from Artaxata since 389 by the leave of Bahram IV.\n\nNow the Huns are pouring over the Caucasus and burning villages as far as the Euphrates, and each of our great lords, the nakharars, looks first to his own castle. At court a learned secretary named Mesrop dreams of letters for our own tongue, so that Armenians might read the Gospel in Armenian. Do we serve Persia to survive, look to Christian Rome, or become a nation strong enough to answer to neither?"
 tfe_history_AUS: "The Austuriani are the camel riders of the eastern desert; the Romans also call us Laguatan. Our camps and palm gardens surround the oasis of Augila, and our raiders know every well between Tripolitania and Cyrenaica. Thirty years ago we plundered the countryside around Lepcis Magna season after season, while the Roman count Romanus refused to march unless the cities first gave him four thousand camels.\n\nRome's walls are thinner now and its garrisons fewer, and Africa is ruled by Gildo, who has troubles of his own. The coastal cities are still full of grain, olive oil and silver. We can raid them, trade with them, or unite the desert tribes into a power that Rome must treat with rather than bribe."
 tfe_history_AXU: "Aksum's kings have worn the cross since Ezana was baptised by Frumentius of Tyre, but the stelae of the older kings still tower over the capital, and the countryside still offers to Almaqah, Astar and Mahrem. From Adulis our ships trade ivory, gold and incense for Roman wine and Indian spices, and our gold coins are accepted from Alexandria to the ports of India.\n\nAcross the Red Sea, the Himyarite king Malkikarib has turned from the old gods to one God, while our kings still claim Saba and Himyar in their titles. The Agaw pay us tribute; the Noba and Blemmyes watch the Nile roads. Does Aksum's future lie across the sea in Arabia, along the Nile, or at home, winning the highlands for Christ?"
 tfe_history_AZD: "Oman turns its face to the sea, but its heart lies inland at Nizwa, among date gardens fed by the aflaj, channels cut through the rock long before our time. The Azd came here from Yemen and made the mountains their own. The coast is not ours alone: Persia calls this land Mazun, and its marzban keeps garrisons in the ports and takes tribute from the tribes.\n\nThe King of Kings has trouble on every frontier, and his grip on the Gulf is loose. The Azd could drive out the Persians, take the harbours and trade straight with India and Africa. Or we could keep paying, keep our heads down, and grow rich on dates and copper while the empires wear each other out. Which will it be?"
 tfe_history_AZN: "The Greek sailing guides call our coast Azania and count its landings along the long Benadir shore: Sarapion, Nikon and the rest. From the harbour at Mogadishu we trade ivory, tortoiseshell and rhinoceros horn for the iron tools, glass and cloth that Arab and Indian ships bring on the monsoon winds. Each town answers to its own elders, and the herders of the interior to theirs.\n\nThe monsoon brings wealth, and with it rivals: Himyarite and Aksumite merchants would gladly draw our trade to their own ports. Should the Benadir towns stay open harbours for anyone who comes, bind themselves to one of the great sea powers, or join together into a league strong enough to set its own prices?"
 tfe_history_BAE: "Hanseong on the Han River has been our capital since the days of Onjo, and a generation ago we were the strongest of the three kingdoms: King Geunchogo's army killed Goguryeo's king at Pyongyang. That glory is fading. In 392 Goguryeo's young king took our northern forts and the sea fortress of Gwanmi, and King Jinsa died that winter, some say not by chance. His nephew Asin now reigns, and he means to take everything back.\n\nWe have friends: Eastern Jin, whose monk Marananta brought us the Buddha's law, the iron lords of Gaya, and the Wa kings across the strait. Asin's son Jeonji could seal the Wa alliance as an honoured hostage. Do we pour our strength into the north against Gwanggaeto, or build the southern league that could outlast him?"
 tfe_history_BAQ: "The Baquates have dealt with Rome for as long as there has been a Roman Tingitana. For generations our chiefs met the governors at Volubilis, renewed the peace and raised altars to record it, and those stones still stand in the city we now rule. Rome kept only Tingis and Septem on the coast. We hold the land from the Atlantic to the Moulouya as Rome's clients.\n\nBut the Western emperor is a boy of ten, and Gildo, count of Africa, acts more like a king than a servant. If the West weakens further, the last Roman ports could be ours, and the Mauri of the Atlas are watching. Loyalty has brought us subsidies and prestige. Do we stay Rome's clients at the western edge of the world, or become masters of Mauretania?"
 tfe_history_BBS: "Frankincense and myrrh from our hills have scented the temples of Egypt and Rome for centuries. The Barbara hold the northern shore of the Horn, where Greek sailors count the market towns of Malao, Mundus and Mosylon, and where ships bound for India stop for water, cassia and incense. The harbour at Berbera is the busiest of them all.\n\nWe have no king. Each town has its own chiefs, and the herdsmen of the interior come and go as they please. But Aksum's ships sail the Red Sea, and Himyar sits just across the Gulf of Aden, both eager to control the incense trade. Do we unite the incense coast under one ruler, sell our harbours to the strongest bidder, or stay free and scattered as before?"
 tfe_history_BGD: "Long ago we came south from the Baltic, and now our villages line the upper Main and the forests of the Upper Palatinate, pressing on the Alamanni, with whom we have quarrelled for generations over salt springs. Valentinian once asked our kings to march with Rome against them, then failed to meet us at the Rhine, and we went home in fury. Gibica rules us now, and his son Gundahar is growing into a warrior.\n\nThe Rhine is not far, and beyond it lie walled cities, vineyards and bishops. Rome may take us as allies against the Alamanni, or the Alamanni may weaken and leave the way open. Gibica must decide whether we remain a forest people or cross the river and win a kingdom of our own on its banks."
 tfe_history_BLR: "Bolor is the land of Gilgit and Hunza, where the Indus cuts through the Karakoram and the paths to Khotan and Kashmir climb over some of the highest passes in the world. Travellers carve Buddhas, stupas and prayers into the rocks along the way, and our monasteries keep books in Sanskrit. We are few, but our mountains are our walls.\n\nThe Kidarites and the Alkhon hold the valleys to the west, Kashmir lies to the south, and the Tarim kings wait beyond the passes to the east. Every pilgrim and every merchant who uses our roads pays our toll. Do we remain the quiet keepers of the passes, or play the great powers against one another?"
 tfe_history_BMY: "The Red Sea hills are ours, and we herd camels and goats between the Nile and the coast. Egypt knows us as raiders. For generations we have come down from the desert to plunder the towns of the Thebaid, and Rome pays us, as it pays the Nobatae, to keep the peace. Each year the statue of Isis is lent to us from Philae to bless our land.\n\nThe gold and emerald mines of the Eastern Desert lie in our hills, and Rome's frontier forts grow emptier every year. The Noba compete with us for the river, and Aksum's ships control the sea. Do we continue to raid Egypt, make peace with the Noba, or claim the desert between the Nile and the Red Sea as our own?"
 tfe_history_BUY: "Buyeo is the oldest kingdom of the north-east, and the proudest. The royal houses of Goguryeo and Baekje both claim our blood. But the Murong came twice, in 285 and again in 346, burned our capital and carried tens of thousands of our people away. What remains of us holds the middle Songhua and lives by Goguryeo's leave.\n\nEach twelfth month we still hold the Yeonggo, the welcoming of the drums, when the whole people feasts and the prisons are opened. Gwanggaeto calls himself our protector, and every year his protection looks more like ownership. Do we fold quietly into Goguryeo, seek friends among the Wuji and the steppe peoples, or rebuild the kingdom whose name every Korean king still borrows?"
 tfe_history_CAL: "Not every Alan went west. When the Huns fell on us, many of our kin rode away with the Goths, fought at Adrianople and now serve Rome in Pannonia. Those who stayed still hold the Kuban and the Terek below the high Caucasus. Our nobles still fight as armoured lancers, and our priests still honour the naked sword planted in the earth.\n\nThe Huns now pass through our valleys on their way to Armenia and Persia, and they expect us to ride with them. Across the mountains, Iberia and the Persian king would pay us to keep the Darial closed, the pass the Persians call the Gate of the Alans. We can join the storm, bar the gate, or follow our cousins west to find land of our own."
 tfe_history_CNZ: "Of all the great families of Nanzhong, the high plateau south of Sichuan, the Cuan are the greatest. Chinese by the lineage we claim and Yi by the people we rule, we hold the Jianning plain around Qujing, and the Jin court at Jiankang calls us its officials because it has no one else to send. Our clan heads wear Jin titles; our power rests on kinship, on the Yi chiefs of the hills and on the salt and horses of the plateau.\n\nNanzhong is ours in all but name, and the name costs us little. Jin cannot protect us, and rival clans watch for any weakness. We can stay the loyal servants of a distant emperor, or quietly let the title lapse and rule the plateau as kings. Either way, the Yi of the mountains must come to trust the Cuan, or they will find other masters."
 tfe_history_CQT: "Descendants of Conn of the Hundred Battles, we are the Connachta, and our king is Niall, whose name is known in every hall in Ireland. They call him Niall of the Nine Hostages, for nine kings and peoples have given him their sons as pledges. His warriors cross the sea to raid Britain and come back with slaves, cattle and Roman silver.\n\nNiall has many sons, and Ireland is not enough for them. The Laigin hold the old plain of Tara in the east, the Ulaid keep the north, and Mumu rules from Cashel in the south. We can make Niall high king in fact as well as in name by breaking our rivals, or turn our strength on Britain while its garrisons melt away."
 tfe_history_DAX: "Scania, Zealand and the islands of the Belts are ours, and we are becoming the strongest people of the western Baltic. Our chieftains gather followers in great halls, hand out Roman gold and glass as gifts, and sink the weapons of beaten enemies in sacred lakes. The Heruli once shared these lands with us; we drove them out.\n\nOur rise has only begun. The Jutes on the peninsula to the west are weaker than we are, the Geats to the north are rivals, and the sea routes carry both trade and war. We can unite the islands and the peninsula under one great hall, or send our ships along the coasts as the Saxons do. There is no Denmark yet. We mean to make one."
 tfe_history_DIC: "Chouchi, the Pool on the Hill, is a flat-topped mountain in the Wudu country with springs at its summit and one road up. For two centuries the Yang clan of the Di have held it, lost it and taken it back; Former Qin swept us off it in 371, and we returned when Qin fell. Last year our lord Yang Ding died fighting the Qifu of Western Qin, and his kinsman Yang Sheng holds the rock now. We call ourselves servants of Jin, and Jiankang is far enough away for that to be pleasant.\n\nOur hills sit between Chang'an, Hanzhong and the Longxi valleys, and every neighbour wants the passes. We can sell our loyalty, raid the lowlands, or wait on our mountain while the kingdoms beneath it wear each other out."
 tfe_history_DMN: "The Clyde is our river, and a great fortified rock rises above it. We are the Damnonii, a Briton people of farms and hill forts. The Romans once drove a wall of turf through our land from sea to sea, the Antonine Wall, and then abandoned it. Since then we have traded with Rome, fought it and allied with it, but we have lived free beyond its frontier.\n\nIrish raiders sail up the Firth of Clyde, and Pictish warbands come down from the north. The Roman garrisons on Hadrian's Wall are too far away to help us, and they are weakening. We can build a kingdom around our river rock that holds the north for the Britons, or join the raiders and take our share of Roman Britain while it lasts."
 tfe_history_DMT: "South of the Blue Nile, where the highlands break into forest and wet valleys, the peoples of Damot and Ennarea grow the false banana and pan gold from the rivers. Aksumite traders come with cattle, salt and iron and barter for our gold in silence, since neither side speaks the other's language. We rule a wide land, but loosely: every valley has its own lord and its own spirits.\n\nThe Agaw to our north have already bowed to Aksum, and our gold may draw its armies next. Do we stay a distant land of gold that the highland kings know only by rumour, push north to trade on our own terms, or bring the southern highlands under a single ruler before Aksum does it for us?"
 tfe_history_DZR: "The Dzurdzuks live in the gorges of the upper Terek and the Argun, the Nakh people of the Georgian chronicles, which remember that Dzurdzuk warriors once helped the first king of Kartli to his throne. Our clans build in stone, keep their mountain shrines and answer to their elders, not to kings.\n\nThe Alans hold the plains below us, and now the Huns ride through the passes to plunder the south. Iberia, Christian and ruled from Persia, wants the mountain roads made safe. The Dzurdzuks have always survived by being hard to reach. Shall we stay hidden, sell our loyalty to Mtskheta, or come down and take the Terek from the weakened Alans?"
 tfe_history_EAR: "Theodosius is dead at Mediolanum, and the East answers to Constantinople alone once more: Thrace, Asia, Syria and the grain of Egypt. Arcadius, Augustus since he was six and now seventeen, holds the senior seat of the Empire. But the hand on his shoulder belongs to the prefect Rufinus, who sells offices and squeezes the provinces, and our best legions are still camped in Italy beside the West's.\n\nMediolanum is our brother court, one empire under one law and one consulship, and neither court trusts the other's ministers. Stilicho swears the dying emperor gave him both sons to guard. Alaric's Goths, bled white at the Frigidus for Theodosius, owe their oath to a dead man, and Hunnic riders gather beyond the Caucasus. We must decide who truly rules in Constantinople, how far to bend to the West, and what a Gothic king is worth."
 tfe_history_EMS: "Ours are the valleys of the Kitakami and the Mogami and the long Pacific shore of the north. The chroniclers of the west call us Emishi, the hairy barbarians of the east. We plant rice where the short summers allow, but we also hunt deer and bear, fish the salmon runs, and keep ways older than any king. Each valley has its own chiefs, and none answers to another.\n\nYamato's reach is growing. The lords of Kenu raise their mounds at the edge of our lands, and their settlers eye our fields. Some of our southern chiefs have begun to build mounds of their own. Do we take up Yamato's iron and its gods on our own terms, fight for every valley, or grow rich trading furs and eagle feathers to the south?"
 tfe_history_FRG: "Ringed by mountains, the valley of Ferghana is a bowl of green fields and orchards, the land the Chinese called Dayuan. Five centuries ago a Han emperor sent armies across the deserts just to take our heavenly horses, the blood-sweating steeds of legend, and we still breed them. Khujand guards the western gate of the valley, and the Silk Road runs through our towns.\n\nThe Kangju roam the Syr Darya to our north, the Sogdian cities are our wealthy neighbours to the west, and the oasis kings of Kashgar lie over the passes to the east. We are small, but our horses are the best in Asia. Do we sell them to the highest bidder, or use them to carve out a larger realm for ourselves?"
 tfe_history_FRK: "Across the Rhine from Colonia, our war-bands hold the land between the Lippe and the northern marshes. Franks have served Rome as soldiers and as generals: Arbogast, one of our own, made the teacher Eugenius an emperor and died by his own hand after the Frigidus. Our duces Marcomer and Sunno are of another mind. They have crossed into Roman Germany before, burned its villas and come home rich.\n\nWith Arbogast gone and Theodosius dead, the Rhine is held by a regent who has too many wars and too few men. Stilicho may come north to buy our peace or to hunt us down. Marcomer must choose between taking Roman gold and titles, as other Franks have done, and raiding the rich lands of Gaul while its frontier is thin."
 tfe_history_FRS: "Salt marsh is our country: between the Rhine mouths and the Ems we raise our farms on mounds of earth and dung above the winter floods. Rome once taxed our fathers in ox-hides, and when the tax grew cruel they hanged the soldiers who collected it. Since then the sea has taken much of our land, and many of our mound villages stand empty as floods and hunger drive families to the higher ground.\n\nWhat remains is a people of cattle and boats, living where the Franks, the Saxons and the Rhine trade meet. Roman merchants still come down the river, and Saxon crews shelter in our harbours. We must choose between trading with Rome, joining the raiders, and rebuilding our coast for the newcomers who will follow the sea road."
 tfe_history_FUN: "From Vyadhapura below its sacred hill we rule the lower Mekong, and the sea comes to us. At Oc Eo, our great port behind its canals, Roman gold, Persian glass and Indian beads change hands for tin, spices and Chinese silk, and Brahmins from the west teach our court its Sanskrit and its gods. Fan Shiman's war fleets made the coasts from the isthmus to the Chao Phraya our tributaries, and Jinlin and Tun Sun still send their gifts. A generation ago our king sent tame elephants to Jin.\n\nYet an empire of ports is a web, and a web can be cut. Linyi grows bold on our northern sea, and the Malay harbours of the peninsula covet the isthmus trade. We must decide whether Funan stays a sea power living on tolls, or digs its canals inland and becomes a kingdom of rice and temples."
 tfe_history_GEA: "Gotaland is our country: the lakes and plains south of the great Swedish forests, around Vattern and Vanern and down to both coasts. Our chieftains keep halls rich with Roman coins and glass that have passed through many hands on the way north. We are a warrior people, and our songs are of heroes and monsters.\n\nTo the north, the Svear of Uppsala grow stronger; to the south, the Danes are uniting their islands. We stand between them. We can join one against the other, strike first at the weaker, or build our own kingdom across the southern half of the peninsula. Whatever we choose, the sea will be our road."
 tfe_history_GEP: "Our Gothic cousins say that three ships brought our peoples from Scandza and that ours came last, which is why they call us the slow ones. Slow or not, we hold the upper Tisza and the hills of Transylvania, with the gold and salt that Rome abandoned more than a century ago. The Tervingi fled to the Roman Danube when the Huns came; we remained, Arian like them and more numerous each year.\n\nTo our west the Hasding Vandals roam the Tisza, below us the Iazyges ride the plain, and to the east the Huns grow stronger each season. We can become the Huns' best allies and share in their plunder, or fortify the Carpathians and wait. Transylvania is a strong castle. The question is who will besiege it."
 tfe_history_GMT: "The Garamantes were an old people when Herodotus wrote of them. Rome sent its generals against Garama and then came to trade. In the Fezzan our underground channels, the foggaras, draw water from beneath the sand to feed palm groves and wheat fields, and our caravans carry salt, slaves and carnelian across the Sahara.\n\nBut the water is sinking, the channels run dry one by one, and the fields shrink with them. Garama no longer commands the desert as it did. The Austuriani in the east and the Mauri in the west compete with us for the same wells and routes. Do we rebuild the kingdom of Garama, turn to the Roman coast, or trust our future to the caravans and the open Sahara?"
 tfe_history_GOG: "Damdeok came to the throne four years ago at seventeen and has not stopped moving since. In his first full year he took ten Baekje fortresses north of the Han and, after a twenty-day siege, the sea fortress of Gwanmi. Silla sent us a royal hostage and now lives under our shield. His people already call him Gwanggaeto, the broad expander of the realm. King Sosurim gave us the Buddha's law and a Confucian academy a generation ago; the kingdom is ready for a conqueror.\n\nTwo wars call. To the west, Later Yan holds Liaodong, the rich plain we took and lost ten years ago. To the south, King Asin of Baekje wants his forts back, and the Wa across the sea arm him. The heir Georyeon is still an infant. Where Gwanggaeto marches first will decide the shape of Korea for a century."
 tfe_history_GUP: "Chandragupta II, called Vikramaditya, rules from Pataliputra over the greatest realm India has seen since the Mauryas. His father Samudragupta conquered the north and had his victories carved on the pillar at Prayaga, and the frontier kings of Nepala, Kartripura and Kamarupa still send their tribute. Queen Dhruvadevi is at his side, and their son Kumaragupta is still a small child. Poets, astronomers and sculptors gather at our court, and the trade of both seas fills our treasury.\n\nThe Kidarites have taken Gandhara, and more horsemen may follow them through the passes. In the south the Kadambas and Pallavas remain unconquered, though Samudragupta once humbled Kanchi. Do we push south, fortify the north-west, or rule in peace and let our wealth and learning speak for us?"
 tfe_history_GYK: "We are the Gaya: not a kingdom but a league of walled towns along the lower Nakdong, led by Geumgwan Gaya at Gimhae. Our founder Suro, the tellers say, came down from heaven in a golden egg. Our wealth is iron. We smelt it from the ore of our hills, beat it into flat ingots that pass as money, and ship it to the Wa, to Baekje and to the ports of the Yellow Sea.\n\nIron makes us rich, and it makes us wanted. Silla presses from the east with Goguryeo at its back, while our friends in Baekje and the Wa lands want our blades for their own wars. Do we stay a league of equals and trade with everyone, or let Gimhae become a crown that can stand beside the three kingdoms?"
 tfe_history_HAS: "A host, not a kingdom: the Hasding Vandals live in camps on the upper Tisza plain, and our strength is our army. Godigisel, our king, is a seasoned warrior; his son Gunderic rides at his side, and a younger bastard son, Gaiseric, is still a boy. Some of our kin serve Rome, and the regent Stilicho himself is the son of a Vandal officer. We worship Christ in the Arian manner and call the Siling Vandals to the north our brothers.\n\nThe Tisza is not enough for us, and Hunnic horsemen press our eastern flank. We can march west toward the Danube and the Rhine, south into Pannonia, or wherever Roman weakness shows itself, and take a home by the sword. The choice is when to set out and where to strike."
 tfe_history_HIM: "Malkikarib Yuha'min rules all of Yemen from the palace of Raydan at Zafar: Saba, Hadramawt and the highlands, bound together by his forefathers. He has put away the old gods for Rahmanan, the Merciful, the One God, and our court keeps the faith of the Jews. His son Abikarib As'ad shares the throne, a restless soldier with his eyes on the deserts to the north. Kinda rides as our vassal in the Najd, and the keepers of Mecca pay us tribute.\n\nAcross the Red Sea, Christian Aksum has held our coast before and wants it again. The incense road north is ours to tax, and the tribes of Arabia are ours to command if we are strong enough. Do we march north and make Himyar master of Arabia, or guard the sea against Aksum?"
 tfe_history_HLT: "Rice is our wealth. The Chinese annals know us as Holotan, a kingdom in the heart of Java among terraced fields and smoking volcanoes, and our soil, fed by the ash of the mountains and the water that runs off them, is among the richest in the islands. Our villages send rice down the rivers to the northern coast, where merchants from India and Sumatra trade cloth and beads for it.\n\nOur neighbours are young and ambitious. In the west Tarumanagara has a new king who dreams of conquest, and across the Java Sea the ports of Sumatra and Borneo grow rich on the sea trade. We have rice enough to feed armies. Shall we spend it on temples and a court fit for the Indian gods, or arm our farmers before Purnawarman's ambitions reach our valleys?"
 tfe_history_HNS: "Some twenty years ago our horsemen crossed the Don and broke the Greuthungi. Their sons now ride in our host, and the Goths who fled from us are Rome's problem. From the Emba to the Carpathians the grass belongs to the Huns. Uldin leads the western clans from the Donets, while Basich and Kursich have taken the young warriors south through the Caucasus, burning their way into Armenia, Syria and the lands of the Persian king.\n\nNo single throne rules us yet. A chief who brings home gold gains followers, and one who fails loses them. Rome is divided between two young emperors and pays well for peace; Persia is rich and close. Shall we raid, demand tribute, or hire our swords to one empire and let the other bleed?"
 tfe_history_IAZ: "Sarmatian horsemen, we hold the plain between the Danube and the Tisza, and our forefathers fought Marcus Aurelius on the ice of the frozen Danube. When peace came, thousands of our riders were sent to serve Rome as far away as Britain. We still ride armoured horses, honour the naked sword planted in the earth, and trade with the Roman towns across the river.\n\nThe Huns have broken the Alans, our steppe cousins, and their horsemen now probe the Carpathian passes. The Gepids hold the hills above us and the Vandals camp on our northern border. We can make ourselves Rome's border guards, or ride with the Huns, who fight as we do. Either way, it is our horsemen that every power will bid for."
 tfe_history_IBR: "Kartli has been Christian since King Mirian listened to the captive woman Nino, and the cross stands over Mtskheta where the Aragvi meets the Kura. Our king Trdat, a Chosroid, has not long worn the crown. He rules as Persia's client: in 387 Rome and Persia divided the Caucasus, Iberia fell to the Persian share, and Gugark was added to our lands as the price.\n\nA Christian king under a Zoroastrian overlord must walk carefully. The Huns crossing the mountains this year remind us that Persia is far away and the passes are not enough. Rome would welcome us as fellow Christians, but Rome has already let Armenia go. Should Trdat serve Bahram faithfully, look to Constantinople, or gather the Caucasus under Mtskheta?"
 tfe_history_IZM: "Izumo faces the northern sea, and its gods are older than Yamato's claims. Here Okuninushi, great lord of the land, shaped the country, and here, the tellers say, he yielded it to the grandson of heaven on the promise of a shrine so tall it touched the clouds. Our hills give iron sand, and the craftsmen of Tamatsukuri cut jasper and agate into the curved magatama that every lord in the islands wears.\n\nWe bow to the great king in Yamato, but our priests keep their own rites, and our chiefs remember a land that was once theirs alone. Stay a loyal vassal and earn Yamato's favour, or look across the sea to Korea for friends who would help us stand apart?"
 tfe_history_JIN: "Jiankang is the last seat of the Sima emperors, and the Yangzi is its wall. Our court fled south when the Xiongnu sacked Luoyang more than eighty years ago. Twelve years ago, at the Fei River, the Beifu soldiers of Jingkou broke Fu Jian's host and gave us back the lands south of the Yellow River. Emperor Xiaowu, Sima Yao, reigns, and drinks. His brother Sima Daozi, Prince of Kuaiji, governs as chancellor and drinks with him.\n\nThe north has shattered into rival kingdoms, Yan against Wei, Qin against Liang, and it has never been weaker. Yet our great clans guard their estates, the Huan of Jingzhou keep their own army upriver, and the heir, Sima Dezong, cannot speak. We must decide whether to march north while our enemies bleed each other, or first master a court that has forgotten how to be ruled."
 tfe_history_JNL: "Jinlin, the Golden Neighbour, the Chinese call us: Mon rice farmers and gold workers on the plain west of the Chao Phraya, where the traders of Funan come looking for gold and elephants. Fan Shiman, the conqueror king of Funan, fell sick and died on his way to subdue us, but Funan's power reached us all the same, and we still send tribute to Vyadhapura.\n\nTribute buys peace, but it drains our treasury and binds our fate to Funan's. Our Mon kinsmen at Thaton, beyond the hills, answer to no one, and the Kuy and Lawa of the uplands trade with us directly. We can stay a loyal tributary, sheltered by Funan's fleets, or wait for Vyadhapura to stumble and take the plain for ourselves."
 tfe_history_JUT: "Heath, bog and fjord make up the northern half of the long peninsula that is our home. Our ancestors sank the weapons of beaten raiders in the bogs as gifts to the gods, and Roman swords and silver reach our chieftains' halls through trade and war. The Angles are our neighbours to the south, the Danes across the water to the east.\n\nWe are few and our land is poor, so our young men look to the sea. The Saxons and Angles raid Britain and Gaul, and the Danes are growing stronger on their islands. We can join the voyages west, first for plunder and later for land, or stay and defend Jutland against the Danes. We must choose soon, before the choice is made for us."
 tfe_history_KDB: "The Kadambas are a young house. Two generations ago Mayurasharma, a Brahmin student humiliated by a Pallava horseman at Kanchi, put away his books and took up the sword, carving out a kingdom from the forests around Banavasi. His grandson Bhagiratha now rules that inheritance, and our realm stretches across the Deccan plateau from the western hills to the Godavari.\n\nThe Pallavas of Kanchi have never forgiven us, and the Guptas to the north have conquered everything that once stood between them and us. Do we seek a marriage with the Gupta court, as other kings have, or trust in our own strength and turn on the Pallavas?"
 tfe_history_KDL: "Kantoli is a river kingdom. From our town on the Musi, among the swamps and channels of southeastern Sumatra, we gather the gold, benzoin, resins and forest goods of the interior and sell them to ships bound for India and China. The straits pass close to our coast, and every passing merchant is a chance to trade or to demand a toll.\n\nWe are still small, one river port among many, and the great sea trade flows through Funan's hands and over the isthmus of Tun Sun. But ships have no need of the isthmus if they can sail through the strait. If we bring the Sumatran ports under our rule and keep the strait's pirates in check, the sea road through our waters could become the one that matters."
 tfe_history_KDR: "In the Bujang valley, under the great peak of Jerai that sailors sight from far out in the Bay of Bengal, we have worked iron for centuries: the furnaces along the Sungai Batu turn the ore of our hills into metal that ships carry across the sea. Kadaram is the first landfall for Indian traders crossing from the Coromandel coast, and our jetties and shrines serve them while they wait for the monsoon to turn.\n\nThe winds that bring wealth also bring rivals. Langkasuka holds the far end of the portage road, Tun Sun takes the cargoes bound north, and the harbours of Sumatra across the strait grow busier every year. We can remain the peninsula's western harbour and forge, or reach across the land and take the whole crossing into our hands."
 tfe_history_KDT: "Balkh, the mother of cities, is ours. Kidara, whose name we now bear, led our horsemen down from the northern steppe, took Bactria from the Persians around 390, then crossed the Hindu Kush into Gandhara and the valley of Swat. We are nomads who have learned to rule cities: Buddhist monasteries line the roads, Kushan coins still pass in the bazaars, and Kidara now strikes his own.\n\nPersia will want its eastern provinces back once it has dealt with the Huns in the Caucasus. The Alkhon, our rivals, sit at Kabul, and beyond the Indus lies the Gupta Empire. Do we hold what we have taken, push on toward India's riches, or strike at Persia while the King of Kings is distracted?"
 tfe_history_KGL: "The Meitei hold the valley of Manipur, a ring of blue hills around the waters of Loktak, the old land of Kangleipak. We worship Sanamahi and the Lainingthou, the gods of the household and the sacred groves, and our kings trace their line to Pakhangba, the serpent ancestor. Seven clans share the valley, and the Ningthouja kings claim to lead them all.\n\nThe valley is fertile but small. To the west, Kamarupa grows strong under the Varmans; to the east, the rivers lead down to Burma. Do we remain secure in our valley, bring the clans firmly under one crown, or push out into the hills and the plains beyond?"
 tfe_history_KHI: "Along the Xar Moron, the yellow river of the eastern steppe, the Khitan pitch their tents. Our fathers were of the Yuwen Xianbei, whom the Murong of Yan broke half a century ago; the survivors fled into the valleys of the Xiliao and the Tao'er and learned to live small. Seven years ago Tuoba Gui's riders fell on us and our kin the Kumo Xi, and afterwards our two peoples went their separate ways.\n\nWe herd horses and cattle, hunt in the Khingan foothills, and trade furs and livestock at Longcheng for Yan's grain and iron. Our clans answer to no king. Yan to the south, Goguryeo to the east and Wei to the west all have uses for our horsemen, and we must decide whose war to join and whose market to keep."
 tfe_history_KHO: "Jade is Khotan's fortune. Rivers from the Kunlun carry it down to our orchards and mulberry groves at the edge of the Taklamakan, and caravans carry it on to China. The Buddha's teaching came here early, and our monasteries are among the greatest east of the Pamirs, drawing monks from China who come to study the scriptures. Yarkand and the Karakoram passes are ours as well.\n\nThe Chinese garrisons left long ago, and the oasis kingdoms of the Tarim now fend for themselves. Shule at Kashgar is our rival, Shanshan our neighbour to the east. Do we guard the jade road, build up the faith, or make ourselves masters of the southern oases?"
 tfe_history_KHW: "Where the Oxus breaks into a hundred channels before the Aral Sea lies Khwarazm, a green land of canals and fortresses surrounded by desert. Ninety years ago Afrig built his castle at Kath and founded the line of Khwarazmshahs who rule us still. We worship at the fire temples, speak our own Iranian tongue, and write it in our own script.\n\nThe Kidarites hold the lands upriver, Persia claims us, and the nomads of the Aral steppe watch our canals with envy. Our walls are strong and our water is good, but we are few. Do we stand alone behind our dykes, bow to a larger power for protection, or push up the Oxus to make Khwarazm great?"
 tfe_history_KIB: "Between the mountains and the Inland Sea lies Kibi, the richest land west of Yamato. Salt pans line our coast, our smiths work iron from the hills, and our fields feed a people who raise tombs nearly as great as the great king's own. The tellers say Yamato once sent Prince Kibitsuhiko to conquer us, and that he slew the ogre Ura in his castle on the hill; we have made that prince our own.\n\nWe serve the great king, and our daughters marry into his house. But Kibi could rule the Inland Sea if it chose, and every ship from Tsukushi to Naniwa passes our shore. Loyalty makes us the first lords of Yamato. Rebellion could make us its rival."
 tfe_history_KIN: "Qaryat al-Faw is a caravan town of painted walls and temples on the rim of the Empty Quarter, and it belongs to Kinda. We came up from the south as Himyar's arm in the heart of Arabia, and we still ride under the kings of Zafar, keeping the Najd tribes and the incense road in line for them. Our herds are many, our towns few, and our reach runs as far as our horses can find water.\n\nHimyar wants loyal swords, and we have given them. But the tribes of Ma'add who now fear us might one day follow a Kindite king of their own. Tamim in the Yamama and Tayy in their mountains are rivals, and Persia's Lakhmids watch from the north. Do we remain Himyar's wardens in the desert, or gather central Arabia under a banner of our own?"
 tfe_history_KMR: "Kamarupa is the valley of the Brahmaputra, a land of rice fields, forests and elephants, ringed by hills whose peoples owe us no allegiance. Pushyavarman founded our house, and in Samudravarman's day we have folded the old kingdom of Davaka into ours. Like Nepala and Kartripura, we pay tribute to Pataliputra, as Samudragupta's pillar records.\n\nThe Guptas are far away, while the hills and rivers of the east are close: the Meitei, the Mon and the peoples of the Burmese valleys. Do we remain a loyal outpost of the Gupta world, or build a kingdom of our own on the eastern edge of India?"
 tfe_history_KMS: "No great king has ever made the Kumaso kneel. Our land is the south of Kyushu: the mountains of Higo, the volcanic plains of Satsuma and Osumi, the long coast of Hyuga. Yamato's tellers call us rebels and boast of a prince who put on a girl's clothes and stabbed our chief at his own feast. The Hayato of our shores are still fierce, and our hill forts still stand.\n\nTsukushi to the north already serves the great king, and Yamato's envoys come with gifts in one hand and threats in the other. We can keep our hills and our freedom, sell our fighting men to Yamato's wars across the sea, or make the whole south of the island ours before the north swallows it."
 tfe_history_KMX: "We Kumo Xi graze our herds along the Laoha and in the hills north of Yan's passes. Like the Khitan, we are what remained of the Yuwen Xianbei after the Murong destroyed them; like the Khitan, we were struck by Tuoba Gui's riders seven years ago, and since then we have gone our own way. We live by horse and ox, and our wagon-makers are the best on the steppe's edge.\n\nLongcheng and the Yan frontier lie close enough to raid and close enough to trade with. Murong Chui's commanders would pay well for our riders, and so would Goguryeo. Our clan chiefs rarely agree on anything. Do we unite them and take a share of the plunder when Yan and Wei come to blows, or keep to our valleys and let the great armies pass?"
 tfe_history_KNJ: "The Kangju have ridden the banks of the Syr Darya since before Han envoys came west, herding their flocks from Chach to Otrar and Talas. We are a confederacy of clans, not a kingdom, and our chiefs meet in council to choose who leads. Chach is our greatest town, an oasis of gardens and markets where the herders trade wool and horses for grain.\n\nNew hordes stir in the east, and old enemies test our borders. The Sogdian cities pay well for peace, and Ferghana's horses would make our cavalry the best on the river. Do we stay a loose league of herders, or forge the clans into a true power on the Syr Darya?"
 tfe_history_KNU: "East of the mountains the Kanto plain opens out, the widest in the islands, and its northern half belongs to the lords of Kenu. From Kouzuke and Shimotsuke down to the shores of Musashi and Hitachi, our people drain the marshes for rice and raise great mounds by the Tone river in the Yamato fashion, so that everyone passing knows who rules here.\n\nWe send gifts to the great king and call ourselves his men, but Yamato is weeks away over the passes. To the north the Emishi hold the valleys our settlers covet. Do we stay Yamato's shield in the east and grow by its favour, or build a realm of our own on the plain while the great king looks west to Korea?"
 tfe_history_KSM: "Kashmir is a valley of lakes and orchards ringed with snow, reached only through narrow passes. Our kings rule from Srinagar and hold Urasa on the road to the plains, and our Brahmins and Buddhist teachers are famous across India; Kashmiri monks carry the scriptures as far as Kucha and China. Shiva's shrines and the Buddha's monasteries stand side by side in our towns.\n\nThe Kidarites have taken Gandhara and Swat to our west, and the Gupta Empire rules the plains to our south. We are safe in our valley, but the passes can be forced. Do we seek the Guptas' protection, come to terms with the Kidarites, or trust in our mountains and remain our own masters?"
 tfe_history_KTI: "Kudungga, the founder of our house, bore a name of these islands. His son Aswawarman, who rules us now on the Mahakam river of eastern Borneo, took a Sanskrit one, and our Brahmins hail him as the maker of the dynasty, as the sun is the maker of light. Ours is the first royal house in the islands to take the manners of Indian kings, and Aswawarman's son Mulawarman, our heir, is already praised for his generosity to the priests.\n\nKutai is rich in gold, forest goods and river trade, but the sea routes run past our shores to Java and the peninsula, not through them. We can raise stone pillars for the gods and give cattle by the thousand to the Brahmins, making our court the brightest in the islands, or send our ships out to claim a place on the great trade road."
 tfe_history_KTP: "Kartripura holds the high valleys of Kumaon and Garhwal, where the Ganges and its sister rivers are born in the glaciers, and the Khas hillmen farm terraces cut into the slopes west of Nepala. Samudragupta's pillar names our king among those who paid him tribute, and the Guptas still expect their due. Pilgrims climb our paths to the sources of the sacred rivers, and they leave offerings in our temples.\n\nThe Guptas are strong, but the mountains are ours. Do we remain loyal vassals and grow rich from the pilgrims, or look beyond the passes to Zhangzhung and the Tibetan plateau for our fortune?"
 tfe_history_KUC: "Kucha is the largest of the northern Tarim oases, the city of the Bai kings, of painted cave temples and of music that the Chinese court now imitates. Eleven years ago the general Lu Guang stormed our walls, drove out our king and carried off Kumarajiva, our most famous monk, as a prize, along with our musicians. Lu Guang now rules Later Liang in the Gansu corridor, and Kumarajiva is still his captive.\n\nThe city has rebuilt, but the memory is fresh. Yanqi is our small eastern neighbour, Shule and Khotan our rivals to the west, and the warlords of Gansu could return at any time. Do we pay tribute to Later Liang, or make the Tarim strong enough to resist the next army out of China?"
 tfe_history_KYP: "Across the dry Khorat plateau, along the Mun and the Chi, the Kuy are known for two crafts: we smelt iron from the red earth, and we catch and tame the wild elephants of the forest. Our spirit priests lead the elephant hunt, our smiths trade blades and hoes to the Mon and to Funan, and our villages bury their dead in great jars with iron tools beside them, as our ancestors did.\n\nFunan grows rich on the sea, and its kings covet what the plateau can give: iron for their soldiers, elephants for their armies and for the gifts they send to China. We can grow rich as their suppliers, or become their prey. A people who forge weapons and tame war elephants has what it needs to fight, if it can learn to fight as one."
 tfe_history_KZA: "In a dry valley among the Hejaz hills stands the Kaaba, the old house of the gods, and the Khuza'a keep its keys. Pilgrims come from across Arabia to circle it, to lay offerings before Hubal and the idols, and to trade at the fairs that follow. Thaqif of Ta'if, with its vineyards and the shrine of al-Lat, lives in our orbit. Far to the south the kings of Himyar call themselves lords of Ma'add, and we pay them tribute for peace.\n\nThe sanctuary brings honour but not safety. The clans of Kinana and their Quraysh kinsmen covet the keys, and Himyar's collectors never forget the road north. Do we make Mecca a trading power in its own right, or content ourselves with guarding the house of the gods?"
 tfe_history_LAI: "People of the spear, the old poets call us: the Laigin, holding the eastern plains of Ireland from the Liffey to the south-eastern hills. The royal seat of Tara lies within our lands, and every ambitious king in Ireland covets it. Our ships look across the sea to Britain, where our kinsmen have settled on the western shores of the Roman province.\n\nNiall of the Connachta is rising in the west, and he wants Tara for himself and his sons. We must hold our ancient seat and the eastern coast, or lose them for good. We can join Mumu and the Ulaid against Niall, strike at him before he grows stronger, or send our warriors across the sea to Britain, where the Roman garrisons grow fewer."
 tfe_history_LCV: "The Licchavis rule the valley of Nepala, a basin of rich fields and brick towns ringed by the Himalayas. Our kings claim descent from the ancient Licchavi clan of Vaishali, and Shiva's shrines and the Buddha's stupas share our streets. Samudragupta's pillar at Prayaga lists Nepala among the frontier kingdoms that paid him tribute, and we pay it still to his son.\n\nThe passes to Tibet bring wool, salt and musk, and the Ganges plain lies only a few days' march to the south. Do we remain faithful vassals of the Guptas, or wait for their troubles and become a Himalayan power in our own right?"
 tfe_history_LGB: "Tacitus wrote that we are few, but that, ringed by many strong peoples, we survive by fighting rather than by submitting. It is still true. Our villages lie along the Havel and the Spree and among the lakes to the north, with Saxons to the west and Rugii and Vandals to the east. Our songs say that we came south from Scandinavia and took our name from the long beards of our warriors.\n\nWe are too few to conquer and too proud to serve. All around us, peoples are beginning to move: the Vandals look south, and Hunnic power grows in the east. When our neighbours leave, their land will lie empty. We must decide whether to stay on the Elbe or follow the others toward the Danube and the richer south."
 tfe_history_LIH: "The Han built two commanderies on our island and lost both. They gave Hainan up more than four centuries ago, and no Chinese governor has ruled here since. We are the Li, the Hlai of the hills and river valleys, weavers of fine cotton cloth, hunters in the forests below the Five Finger Mountains. Our villages answer to their own elders and to the spirits of the land, not to any king.\n\nBut the strait to the mainland is narrow, and Jin or whoever follows it will not forget the island forever. Fishermen and merchants from Linyi and Guangzhou already put in at our harbours. We must choose whether to stay many villages, hard to conquer because there is nothing to seize, or to raise one chief strong enough to bargain with the empires across the water."
 tfe_history_LKA: "Anuradhapura is a city of white stupas, some rising higher than anything men have built save the pyramids of Egypt. King Upatissa of the Lambakanna line has ruled it for nearly thirty years and is known for his mercy. The Tooth Relic of the Buddha, brought from Kalinga in his grandfather's time, is kept in our capital, and the monks of the Mahavihara and the Abhayagiri argue over the true teaching.\n\nTamil raiders have crossed the strait before and will again. Roman, Persian and Indian ships call at Mantai, and the pearls and gems of our island are known far away. Do we guard our coasts, settle the monks' quarrel, or reach across the water ourselves?"
 tfe_history_LKM: "Al-Hira is a city of tents grown into palaces on the edge of the Euphrates marshes, and al-Nu'man rules it for the King of Kings. The house of Lakhm has watched Persia's desert border for three generations, paid in silver to keep the tribes quiet. We hold the wells of Ayn al-Tamr and the pearl coast of Bahrayn, Christian monks of the Church of the East pray beside our pagan shrines, and Nu'man's builders are raising Khawarnaq, a palace the poets will not stop praising.\n\nCtesiphon has Huns in the north to deal with. Rome's Arabs, the Salihids, graze just beyond the frontier, and the Najd tribes answer to whoever paid them last. Our king is a pious man, and the tale says he may yet leave his throne for a hermit's cell. Do we stay Persia's loyal shield, or make al-Hira a kingdom that answers to no one?"
 tfe_history_LKS: "Langkasuka stands at Pattani, with its back to the jungle and its face to the South China Sea. Our kings wear gold and ride elephants, our city is walled, and our harbour receives Indian merchants who have crossed the peninsula from Kadaram, and ships bound north for Funan and China. The Buddha's teaching has taken root here, beside the gods the Indians brought.\n\nWe are small, but our place is good: one of the roads across the peninsula ends at our gates. Tun Sun and Funan to the north take most of the trade, and Kadaram holds the other end of our road. We can bind ourselves to Kadaram and control the crossing together, or court Funan's favour and grow rich as its southern gate."
 tfe_history_LLI: "Lü Guang went west for Fu Jian with seventy thousand men, took Kucha, and turned for home with a train of camels heavy with Kuchean treasure and the monk Kumarajiva as his prize. News of the Fei River met him on the road. He seized Guzang instead, and since 386 the Hexi corridor has been ours, from the Wushaoling pass to Dunhuang and the vineyards of Gaochang. Every caravan between Chang'an and the Tarim pays at our gates.\n\nWe are a Di army ruling Chinese towns, Xianbei herdsmen and Lushuihu chiefs. The Tufa clan and the Juqu of Linsong serve us, for now, and our officers resent Lü Guang's hard punishments. Do we hold the corridor by fear, share it with its peoples, or strike east at Western Qin and Later Qin before they come for our captive monk?"
 tfe_history_LNY: "We are the Cham of Linyi, free of China for two hundred years, since Qu Lian threw out the Han governors of Rinan. Our capital Simhapura stands on the Thu Bon river, and every ship bound between Funan and Guangzhou must pass our coast. King Bhadravarman, whom the Chinese call Fan Huda, has raised a shrine to Shiva Bhadreshvara in the valley of My Son, binding our clans to one god and one king.\n\nBhadravarman is a fighting king, and the rich Jin province of Jiaozhou lies just to the north, weakly held by a court with troubles of its own. We can raid it for slaves and bronze, or claim it outright and risk the day China turns south in earnest. The sea calls too: whoever commands these waters taxes the trade of two oceans."
 tfe_history_LPN: "The Lezgins of Lpink live in the high valleys around Kurakh, between the Samur and the Caspian plain. We are better known as fighters than as a kingdom. Our lords answer to no king in the lowlands: we pay tribute to Albania when we must and raid it when we can, and each village guards its own fields, flocks and feuds.\n\nThe Huns crossing the mountains, the Maskut at the Gates and Persia's officers in Albania all want our men. Our valleys cannot feed many, but they are hard to take. We can sell our spears to whoever pays best, stand with our Avar and Albanian neighbours against the outsiders, or come down from the heights and win land on the plain."
 tfe_history_LQN: "Chang'an is ours. We are the Qiang of the Yao clan: Yao Chang, a general of Fu Jian, turned on his master after the Fei River, strangled him in a Buddhist temple at Xinping, and took the land within the passes for himself. He died last year. His son Yao Xing succeeded him and within months cut down Fu Deng, the last Qin emperor who mattered.\n\nYao Xing reads sutras as readily as dispatches, and he covets the Kuchean monk Kumarajiva, whom Lü Guang keeps at Guzang. Around us wait Western Qin, Later Liang, the Jin garrison at Luoyang and the rising Wei across the river. Do we reach west for the Hexi and its famous captive, east for the old capital, or make the Guanzhong a court the whole north must respect?"
 tfe_history_LUA: "Before any other people came down the rivers, the Lawa held the valley of the Ping and the mountain above it, where our ancestor spirits Pu Sae and Ya Sae still watch over the land and must be fed with buffalo. We mine iron in the hills, grow rice in terraces and upland clearings, and send forest goods downriver to the Mon.\n\nFrom the Mon cities of the south come monks, writing and the teaching of the Buddha, and some of our chiefs have begun to listen. We must decide how much of their world to take. A Lawa kingdom with Mon scribes and Buddhist monasteries could hold the valley against all comers; the old way keeps our spirits and our freedom, but leaves every village to face stronger neighbours alone."
 tfe_history_LYN: "Murong Chui is nearly seventy and has never lost a war that mattered. He served the Former Yan until jealous kin drove him out, served Fu Jian of Qin until the Fei River broke Qin, and in 384 raised the Murong banners again. From Zhongshan we rule the plain of Hebei, Liaodong and the old Murong seat of Longcheng, and last year we destroyed Western Yan and took Changzi and the Fen valley.\n\nThe old emperor will not live forever, and his crown prince Murong Bao is no soldier. Beyond the passes Tuoba Gui, once our client, has grown bold on the Yellow River bend; in the east Goguryeo's young king eyes Liaodong. Do we send Bao to prove himself against Wei, or does Chui ride out one last time and leave his son a realm already won?"
 tfe_history_LZC: "Colchis of the Golden Fleece is Lazica now, and its kings rule from Kutatisi and the port of Phasis. Since the partition of 387 the emperor in Constantinople invests our kings, a Roman garrison holds Apsaros on our border, and our church looks to the Greek bishops. We are Christians, rich in timber and wine, and our merchants carry the goods of the hill peoples to Roman ships.\n\nThe Svans and the Abasgians are poor and proud, and we would have them answer to us. To the east, Persia's clients in Iberia and Armenia watch the roads over the Likhi range. The emperor's favour keeps us safe but leaves our fate in Greek hands. Do we build a small mountain empire under Roman protection, or find the strength to stand without it?"
 tfe_history_MDV: "Our kingdom is a scattering of coral atolls in the western Indian Ocean, more sea than land, ruled from Male. Buddhist monks tend stupas on our islands, and our wealth floats in from the lagoons: cowrie shells, gathered by the million and traded as money across the ocean. Coconut rope and dried fish bring sailors to our harbours.\n\nWe are too small to fight any serious enemy and too remote to be worth conquering. Merchants from Lanka and India handle most of our trade and take most of its profit. Do we remain a quiet market in the middle of the ocean, or build our own ships and carry our shells to the world ourselves?"
 tfe_history_MKM: "Two centuries ago our ancestors fought Marcus Aurelius for most of his reign, and Rome still speaks of the Marcomannic Wars. Now we are a quieter people in the Bohemian basin and Moravia, ruled by Queen Fritigil. She has heard from a Christian traveller of Ambrose, bishop of Mediolanum, and has written to him asking to be taught his faith.\n\nIf Ambrose answers, Christianity would bind us to the court at Mediolanum. Fritigil hopes to persuade her people to make a treaty with Rome and perhaps even settle within its borders. Many of our warriors distrust both the bishop and the treaty. The queen must choose between leading us into Rome's service and faith and keeping the old gods and our independence."
 tfe_history_MOC: "Without water the northern desert gives us nothing, so we take it from the rivers that run down from the Andes, digging canals that turn each valley into a garden of maize, beans and cotton. We are the Moche. Our warrior-priests fight ritual combats, sacrifice their captives in ceremonies painted on our pottery, and go to their tombs in gold and turquoise. In the southern valleys the Huaca del Sol, the largest adobe mound in all the lands we know, rises over the fields.\n\nBut the Moche valleys have never been one kingdom: the lords of the north and the south share gods, not masters. The rains that come with the warm sea can wash away a generation of canals in a single season. We can build walls and storehouses against the floods, or conquer the neighbouring valleys and make them pay for our canals."
 tfe_history_MRX: "Gaetuli of the high plateaus, the Five Peoples of the Djurdjura, Mauri of the Atlas: we live beyond the Roman limes, sometimes allies, sometimes raiders. Twenty years ago our peoples rose with Firmus, son of the Moorish prince Nubel, until the elder Theodosius, grandfather of today's emperors, crushed the revolt, with Firmus's own brother Gildo fighting on Rome's side.\n\nThat same Gildo now rules Africa as its count and treats its grain as his own. If he ever breaks with Mediolanum, the Mauri will have to choose again. We can fight for Gildo, sell our loyalty to Stilicho, or wait for Rome to weaken and take back the plains it fenced off with its ditches and walls."
 tfe_history_MSQ: "At Derbent the Caucasus comes down to the Caspian and leaves only a narrow strip of shore. It is the one easy road between the steppe and the rich lands of Albania, Armenia and Persia, and it is ours. The Maskut are Massagetae, horsemen of old Iranian stock, and in our grandfathers' day King Sanesan led the northern peoples along this road to plunder Armenia.\n\nThis year the Huns have crossed the mountains without asking our leave. Persia would like to fortify the Gates and pay us to guard them; the Huns would rather we held them open. Whoever holds Derbent decides who reaches the south. We must decide whom we hold it for, and at what price."
 tfe_history_MUM: "Conall Corc has made the rock of Cashel the seat of our kings, and from it he rules Mumu, the broad south of Ireland. The story goes that swineherds saw a vision on that rock and that Corc founded the kingship there. Our lands are the richest in Ireland: good pasture, gold and copper in the hills, and harbours where Gaulish and British traders come.\n\nThe Connachta are expanding under Niall, and the south must decide how to answer. Our kinsmen, the Deisi, have already settled across the sea in south-western Britain. We can contest the high kingship, guard our rich land against the north, or send our ships to Britain and Gaul and build a sea kingdom around the Irish Sea."
 tfe_history_MYL: "Monyul is the country of the Mon, the southern hill peoples of the forested valleys of Bhutan, Sikkim and the eastern Himalayas. We keep our own gods, our priests read the omens in bone and blood, and our villages grow barley and buckwheat on terraced slopes. No king has ever ruled all of us, and we prefer it that way.\n\nThe Tibetan kingdoms to the north and Kamarupa to the south each want our passes and our forests. Salt and wool come down from the plateau, rice and cloth come up from the plains, and we take a share of both. Do we stay a free people of the hills, or bind our valleys together before others do it for us?"
 tfe_history_NAZ: "Hummingbirds, monkeys, spiders and long straight roads run across the desert pampa, drawn by our people and walked in procession to call the water, though no one on the ground can see them whole. The Nazca live in narrow valleys where the rivers sink into the sand, and our puquios, stone-lined galleries dug deep into the earth, bring that hidden water back up to the fields. At Cahuachi, our pilgrim centre of adobe mounds, the priests keep the heads of enemy dead as offerings.\n\nCahuachi's glory is fading, and the rivers seem thinner every year. We can restore the old pilgrim centre and the power of its priests, or move our strength to the valley towns and their warriors. Above us, the peoples of the Ayacucho valleys trade for our painted pots, and may one day come for more."
 tfe_history_NOB: "Meroë has fallen. For a thousand years the kings of Kush ruled the Nile from the Butana; now their city is empty, broken by Aksum's armies and by time, and we Noba farm the riverbanks from the Fourth Cataract to the Gezira. Our chiefs are buried beneath great mounds with their weapons, and the old gods of Kush still receive our offerings.\n\nTo the north, Rome pays our Nobatae kin to guard the frontier at Philae, where the temple of Isis still welcomes our pilgrims. The Blemmyes of the eastern hills are old enemies, and Aksum's Christian kings look down from their highlands. Do we claim the inheritance of Meroë, and with it the Nile from Egypt to the swamps, or remain someone else's border guards?"
 tfe_history_NRW: "No single king rules the long coast of Norway. Each fjord and valley has its own chieftain and hall, and the mountains between them are harder to cross than the sea. Our people farm narrow strips of good land, hunt the uplands and fish the coasts, and bring home Roman silver, glass and weapons from beyond the Skagerrak.\n\nWe are many small powers. Some chieftains are stronger than others, and whoever gathers the most ships and followers could make the rest bow. The Danes and the Svear are both uniting their lands. We must decide whether to fight among ourselves forever or let one king end the petty kingdoms and lead the north."
 tfe_history_NVN: "Galloway is the farthest corner of Britain, a land of hills, moors and sheltered bays that looks out toward Ireland. From our shore the Irish coast shows on a clear day, and Irish boats reach us more often than Roman officials. The legions marched through our country once and left their roads behind. Now Christian preachers from the Roman south have begun to land at Whithorn.\n\nWe are one of the smallest peoples of the north, with only a handful of settlements. The Irish may raid us or settle among us, and the Damnonii and the Selgovae are our neighbours. We can take up the new faith and the Roman friends it brings, look to the Irish across the water, or join our Briton neighbours in a larger kingdom."
 tfe_history_NWI: "Nine years ago the chiefs gathered at Niuchuan and made Tuoba Gui their king. He was fifteen, grandson of the last king of Dai, and had grown up a fugitive after Former Qin destroyed his grandfather's realm. Now we Tuoba Xianbei rule the great bend of the Yellow River from Shengle, and in 391 we smashed the Tiefu of the Ordos and drove off their horses and cattle by the hundred thousand.\n\nMurong Chui of Yan once treated us as a client, until his court held Tuoba Gui's brother hostage for horses. Now Yan's armies gather beyond the passes, and behind them lies the plain of Hebei with its walled cities and its farmers. Do we meet Yan in the field or draw it deep into the steppe? And if we win, can nomad horsemen and Chinese clerks be made into one state?"
 tfe_history_PKT: "Painted, the Romans call us, Picti, and we hold the north beyond the Forth, from the high glens to the fertile coastal plains. Our ancestors outlasted Agricola and Severus. In 367 our fathers crossed Hadrian's Wall with the Scots and the Saxons and ravaged Britain for a year, until Count Theodosius, father of the emperor who has just died, drove them back.\n\nThe emperor is dead, the regent Stilicho is busy elsewhere, and Britain's garrisons thin as their men are called away to civil wars. Our boats range the coasts, and the Wall grows weaker every year. We can raid again with the Scots from Ireland, or unite our kings into a single power that can hold the whole north. The south lies open."
 tfe_history_PLV: "From Kanchi, a city of learning whose ghatika draws Brahmin students from across the south, the Pallava kings claim lordship over the Tamil land. Samudragupta once marched this far and humbled King Vishnugopa before turning home, and the memory still stings. The old crowns of the Cholas, Pandyas and Cheras have faded, and Uraiyur, Madurai and the pepper ports of Kerala now look to us. Ships from our Coromandel harbours sail to Lanka and across the Bay of Bengal.\n\nThe Kadambas of Banavasi, a dynasty founded in defiance of us, grow strong on our north-western border, while Jain and Buddhist monks compete with the Brahmins for royal favour. Do we march north against the Kadambas, send our ships across the sea, or hold the Tamil lands firmly in hand?"
 tfe_history_PUG: "In the valley of Yarlung, south of the Tsangpo, the Tsenpo rule from the tower of Yumbulakhang, which the tales call the first house in Tibet. Nyatri Tsenpo, our first king, came down from heaven on a cord of light, and his heirs returned to heaven the same way until Drigum Tsenpo cut the cord in battle. Since then our kings have been buried in the earth like other men.\n\nThe valleys of U and Tsang are ours, but Zhangzhung to the west is older and richer, and the Sumpa to the north-east are fierce. Do we remain a valley kingdom, or unite the plateau under the Yarlung kings?"
 tfe_history_PYU: "Behind the brick walls of Sri Ksetra rise the tall stupas of the Buddha, and beyond them spread the rice fields and reservoirs of the Irrawaddy's dry zone. We are the Pyu, a people of walled cities: Sri Ksetra near the delta, Beikthano and Halin upstream, each with its own lords and its own silver coins stamped with the rising sun and the srivatsa. Monks and merchants from India come up the river, and the Chinese of Yongchang know us as the Piao.\n\nOur cities trade together but have never truly answered to one throne. From Pyay we can bind them under a single crown, or leave the old rivalries alone and grow rich on the river. To the south the Mon of Thaton hold the coast, and across the Arakan hills Vesali looks toward Bengal."
 tfe_history_QAD: "Twenty years ago our envoys stood before Valentinian at Brigetio to explain why we had risen: Rome had built a fort on our side of the Danube and murdered our king Gabinius at a banquet. The emperor raged at us until a vessel burst in his head, and he died there. Rome remembers the insult; we remember the murder.\n\nOur land is small now, the valleys of the Nitra and the Vah, squeezed between the Marcomanni, the Vandals and the Sarmatian horsemen of the plain. The Danube forts are still manned, but not well. We can make peace with Rome, trade and send it recruits as our ancestors did, or join the stronger peoples to the north and east when they turn south."
 tfe_history_RMN: "The Buddha's teaching reached us first of all the lands east of India, or so we say: the monks Sona and Uttara carried it to golden Suvannabhumi in the days of the emperor Ashoka. We are the Mon of Thaton, and our city looks out over the Gulf of Martaban, where the rivers of the interior meet the sea road from Bengal and the Coromandel coast, and ships put in for water, rice and the gold of the hills.\n\nThe Pyu hold the Irrawaddy above us and their cities are strong; Funan's fleets rule the southern seas. We can remain a small and holy trading city, content with our monasteries and our harbour, or push up the Sittaung and the Salween to become lords of Lower Burma. Our Mon kinsmen at Jinlin, across the hills, still pay tribute to Funan and might welcome a Mon king."
 tfe_history_RRN: "A slave of the Tuoba founded us. Mugulu was taken in a raid, served in their camps, and fled into the Gobi with a hundred companions; from his son Cheluhui come our clans. Now our tents stand north of the desert, on the Kerulen, in the Tuva valleys and along the Altai, and the Gaoche wagon-people pay us in horses and furs.\n\nWe have no single lord yet, only chiefs, and they quarrel over pastures and precedence. South of the Gobi, Tuoba Gui is turning his Tuoba into an empire, and he has already struck at us once. Either we raise one of our own above the rest, with a title no chief of ours has worn, or Wei will pick us apart clan by clan."
 tfe_history_RUG: "Along the Pomeranian shore, between the Oder and the Vistula, our farms and strongholds sit among amber beaches, fishing boats and pine forest. Our kin the Goths left this coast long ago for the Black Sea; we stayed, and now we pray to Christ as Arius taught, as they do. We are a small people, but our farmland is rich.\n\nThe Goths' great realm by the Black Sea fell to the Huns twenty years ago, and the news came north with refugees. Our neighbours are growing restless. We can hold our coast, trade our amber and let others go. Or we can follow the Goths south, toward the Danube and Noricum, where a people of warriors might win a king's inheritance."
 tfe_history_SAS: "From Ctesiphon on the Tigris, Bahram IV rules as King of Kings of Eran and Aneran, heir to Shapur the Great. Eight years ago we split Armenia with Theodosius and took the larger half: King Vramshapuh wears his crown by our leave, and Iberia and Albania bow with him. Yet the east has slipped from us. The Kidarites hold Balkh and Gandhara, the Alkhon strike our coins at Kabul, and Marw has become a frontier.\n\nThis year the Huns are coming through the Caucasus passes toward Mesopotamia, and Rome, split between two young emperors, will be no help. The great houses have already unmade one king in living memory, and Bahram's brother Yazdegerd waits. Do we turn west on a divided Rome, east to win back Bactria, or inward to break the magnates before they break us?"
 tfe_history_SAX: "From the Weser to the Elbe and up to the coast, our villages and ship-sheds make us the largest people of the northern plain. Rome knows our keels better than our faces: for a century our crews have raided Gaul and Britain, and Rome built a chain of forts on both shores of the Channel, the Saxon Shore, to keep us out. In 367 we struck Britain with the Picts and the Scots, and the frontier broke for a year.\n\nBritain's garrison thins each time its troops are called south to fight in emperors' wars. We can keep raiding and come home each autumn with plunder, or sail west to take land, first as Rome's hired soldiers and later as its masters. On land, Franks and Thuringians watch our borders."
 tfe_history_SCR: "Near the Dniester, where the forest gives way to the grass, our wagons and herds move among a handful of scattered villages. We share the Goths' speech and their Arian faith. When the Huns broke the Greuthungian realm twenty years ago, most of the Goths fled to the Roman Danube. We stayed, and now we live on land the Hunnic riders call their own.\n\nWith so few settlements and warriors, we cannot stand against anyone alone. Each spring we must decide whether to pay Hunnic tribute and ride in their raids, or join the Goths in Moesia under Roman rule. Some of our chiefs dream of Roman service and titles, for the Empire has always found room for brave men. First, though, we must survive."
 tfe_history_SGD: "Samarkand and Bukhara are the cities of the Sogdians, merchants whose caravans reach from the Oxus to the gates of China. Our traders write home in our own script from the towns of Gansu, our fire temples honour Ahura Mazda, and our walls have kept the nomads out for centuries. Samarkand leads, but each city has its own lord, bound to the rest by trade and custom.\n\nThe Kidarites hold Bactria to the south, the Kangju roam the steppe to the north, and Persia still counts us among its lost provinces. Silk and silver flow through our markets, and our wealth is our weakness. Do we buy peace from the strongest horde, arm our cities, or unite Sogdiana under Samarkand?"
 tfe_history_SHL: "Shule sits in the western corner of the Tarim at Kashgar, where the caravan roads meet before climbing to the Pamirs. Every caravan that goes west from China or east from Sogdiana passes through our market. We are Buddhists, and within living memory the young monk Kumarajiva studied here on his way home to Kucha.\n\nNow the roads we guard have no master. The Chinese soldiers are gone, and the Sogdians and the steppe peoples jostle for influence. Khotan to the south-east and Kucha to the north-east are our rivals for the western Tarim. Do we fortify our city and tax the caravans, or reach for a larger kingdom while no one else holds these roads?"
 tfe_history_SHW: "Beyond the Khingan, where the Nen and the Argun run north through birch forest and marsh, live the Shiwei. Our speech is close to the Khitan's, but our lives are poorer and harder: we keep pigs and oxen, sow a little millet, hunt sable and fish the rivers, and in the long winters dig our houses into the earth against the cold. No king rules us; our bands follow the chiefs they trust.\n\nThe Rouran gather strength on the steppe west of us, and the Khitan and Wuji watch our valleys. We hold a great, empty country from Hulunbuir to the Shilka. Will we stay scattered, trading furs for iron, or learn from the horse peoples how a people becomes a power?"
 tfe_history_SIL: "Saro began as six villages in the Gyeongju basin, and under the Kim house it has grown into Silla, master of the lands east of the Nakdong. Our maripgan Naemul has reigned for nearly forty years. When Wa raiders came up our coasts and Baekje turned hostile, he sought the protection of Goguryeo, and his kinsman Silseong has lived at the Goguryeo court as a hostage since 392.\n\nThat protection has a price. Tribute goes north every year, and our elders wonder whether we have traded one danger for a master. The Wa still land on our shores, Gaya's iron towns lie across the Nakdong, and Naemul is old. Do we keep leaning on Gwanggaeto, or make Silla strong enough to stand alone?"
 tfe_history_SLF: "Julian himself settled us in Toxandria, the sandy heath between the Scheldt and the Meuse, after he beat us in 358. We have held it ever since as Rome's guests, farming land inside the frontier and sending our young men to its armies. Our kin across the Rhine still raid, but we live among the roads and villas of Belgica, and some of our chiefs speak Latin.\n\nThat makes us the smallest Frankish people and the one closest to Rome. The regent Stilicho needs every loyal sword on the Rhine and may reward us for keeping faith. But the villas grow emptier each year, and the walls of Tornacum and the fields of the Somme are not far. We must decide whether we are Rome's frontier guards or the first Franks to make Gaul our own."
 tfe_history_SLG: "High moors, the Tweed and the valley of the Nith: this is the hill country of the Selgovae. The Romans built their great fort of Trimontium beneath the three-peaked hill and left it long ago. We raise cattle and sheep, and our strongholds look down on roads the legions no longer march.\n\nWe are few, caught between the Votadini on the eastern coast and the Damnonii on the Clyde, with Hadrian's Wall to the south. The Wall's garrison is dwindling. We can raid it, trade with it, or join our Briton neighbours against the Picts and the Irish. A people of hill forts can survive a great deal, but not division."
 tfe_history_SLH: "Dumat al-Jandal guards the head of the Wadi Sirhan, the desert road from Arabia into Syria, and we hold it for Rome. The Salihids took up the emperor's gold and the emperor's creed after Queen Mavia's Tanukh fell from favour, and our phylarchs ride as federates from Tabuk down to the Hejaz coast. Our oath was sworn to Theodosius himself.\n\nTheodosius died yesterday in Milan, and our foedus died with him. Arcadius will want the oath renewed, for he needs Arab riders between Syria and the Lakhmids of al-Hira, Persia's own Arabs, who would gladly see us gone. But Rome's pay comes late and its bishops ask much. Do we swear again to the new Augustus and stay the empire's desert shield, or take what was promised and ride on our own account?"
 tfe_history_SLX: "The upper Oder is ours, a country of rivers and forest in the shadow of our holy mountain, and some say the land will carry our name long after we have gone. We are the northern branch of the Vandals: the Hasdings to the south are our kin, but they have taken up Christ, and we keep the old gods. Our land is fertile, our people many, and Rome far away.\n\nThat is changing. The Hunnic storm drives peoples westward, and the Hasdings already dream of the Rhine. We can hold the Oder and its trade, or join our cousins and fight for a new home in the west. Our villages are many and our warriors strong, but once we leave, there is no road back."
 tfe_history_SRR: "Sarir means throne, and the Avar lords of Khunzakh keep a throne of gold older than anyone's memory; the story goes that a king of Persia gave it to our ancestors. From our high plateau in the Caucasus we look down on the Caspian plain and the road that runs through Derbent.\n\nEveryone who crosses the Caucasus needs the goodwill of the mountain lords, and we have learned to make them pay for it. The Maskut at the Gates, the Christians of Albania and the Persian king all court us, and this year the Huns have shown what a mountain realm is worth to anyone passing through. Do we deal with them all, choose one patron, or make the golden throne the seat of something greater?"
 tfe_history_SSN: "Shanshan was once Kroraina, the kingdom of Loulan on the shores of Lop Nur. Our scribes wrote on wooden tablets in the Kharosthi script of distant Gandhara, and our kings issued decrees in the Indian manner. But the lake is shrinking, the rivers wander from their beds, and the sand is creeping into the old towns.\n\nOur place on the southern Silk Road, between Dunhuang and Khotan, brings traffic and trade, but we cannot hold back the desert, nor the warlords of the Gansu corridor. Do we move our people to new waters, bind ourselves to a Chinese patron, or wring what we can from the road while it lasts?"
 tfe_history_SUA: "Ushguli sits among the highest villages of the Caucasus, and the Svans live where few armies care to climb. Strabo wrote that our fathers caught gold from the mountain torrents in sheepskins, and the rivers still give it up. Our princes keep their own laws in the valleys of the upper Enguri and the Tskhenistskali, and our people still honour the old gods.\n\nSnow closes our passes for half the year, and that has kept us free. But Lazica in the lowlands wants our allegiance, and Iberia would gladly hire our fighting men. The Huns riding south this year prove that no mountain is too far to raid. Do we trade our gold and our spears for a lowland patron, or stay above the snow line and answer to no one?"
 tfe_history_SUM: "The Sumpa are the nomads of the eastern plateau, where the Yangtze, the Mekong and the Salween are born in the high grasslands of Kham and Yushu. We herd yaks and horses, trade salt and musk, and fight each other as often as our neighbours. Our chiefs gather at Chamdo, where the rivers meet.\n\nTo the north, the Tuyuhun rule the plains around Kokonor; to the west, the Yarlung kings are stirring; to the east lies China, divided among warlords. Do we raid the Chinese borders, trade our horses to whoever will pay, or unite the eastern clans?"
 tfe_history_SVE: "Tacitus heard of us: the Suiones, strong in men, weapons and fleets, whose ships have a prow at each end and whose king rules without restraint. Our heartland lies around Uppsala and the waters of the Malaren, among rich farms and the shrines of the old gods. Other northern peoples answer to their assemblies; ours answers to its king.\n\nWe are far from Rome, and the storms that tear the south reach us only as rumours, trade goods and gold. That gives us time. The Geats to the south and the forest peoples to the east are within our reach, and the Baltic is our road. We can build the strongest kingdom of the north before the wars of the south arrive, or send our men to serve foreign lords for gold."
 tfe_history_TAY: "Between the twin mountains of Aja and Salma, where rain pools in the rock and the palms of Ha'il grow thick, live the Tayy. Our fathers came north from Yemen long ago, and our name has travelled further than we have: Syriac scribes call every Arab a Tayyaye after us. Our riders hold the wells of Qassim and the tracks that join the Hejaz to the Euphrates.\n\nNo king rules us and no empire takes our tribute. Yet al-Hira's Lakhmids reach south with Persian silver, Rome's Salihids hold the northern road, and Kinda rides across the Najd for Himyar. Each would buy our spears, and each would rather own them. Do we sell our swords to one master, raid them all, or unite the northern tribes under the Tayy?"
 tfe_history_TGI: "Some say we are the Hermunduri, who once traded with Rome on the Danube, under a new name: the Thuringi. Our horses are known far and wide, and Roman horse-doctors prize them among the best. Our lands run from the Harz to the Ore Mountains and over them into northern Bohemia, a country of good fields, forests and salt.\n\nThe Marcomanni and the Burgundians lie to our south and the Saxons to our north, and the Rhine is far away. We do not threaten Rome, and Rome does not bother to fight us. That gives us time: to unite our families under one royal house, to grow rich on horses and grain, and to choose our wars rather than have them forced on us."
 tfe_history_TJR: "Tamna is an island of black stone and wind off the southern tip of Korea, built around the great mountain Halla. Our founders, Go, Yang and Bu, rose from three holes in the earth at the mountain's foot and took brides who came over the sea bringing calves, foals and the seeds of the five grains. We fish, dive for shellfish, farm what the thin soil allows, and sail to the mainland to trade.\n\nNo one rules us but our own chiefs, yet the mainland is drawing closer. Baekje's ships pass our shores on the road to the Wa, and a kingdom that needs a harbour on that road may decide it needs ours. We can pay tribute and keep our ways, or make our island the port no one sailing between Korea and the Wa can do without."
 tfe_history_TKL: "Seventeen years ago strangers from the west marched into our city. Siyaj K'ahk', a warlord of great Teotihuacan, reached Tikal on the very day our king Chak Tok Ich'aak died, and a year later he set the young Yax Nuun Ahiin on the throne. Our new king is a son of Spearthrower Owl, lord of Teotihuacan, and under him Tikal wears the goggles and spear-thrower of the west. Uaxactun and the other cities of the lowlands now follow our lead.\n\nYax Nuun Ahiin is a foreigner's son on a Maya throne, and our nobles remember the old line. We must decide how much of Teotihuacan to keep. Tikal can remain the western city's eyes and hands in the Maya country, or build a court of its own and one day ask no one's leave."
 tfe_history_TMM: "The Yamama is green by Arabian measure: wadis of palms and grain, springs that never fail, and the old town of Hajr at its heart. The Tamim hold it, a great clan of camel herders and townsmen whose poets cut as deep as their spears. We are few in land but many in kin, and our cousins graze from the red sands of the Dahna to the edge of Bahrayn.\n\nOur wealth draws eyes. Kinda rides for Himyar just to our west, and the Lakhmids hold the Gulf coast for Persia to our east. Both would have us pay, and neither would protect us once we had. Do we bend to one to be safe from the other, or show them both that the Tamim bow to no king?"
 tfe_history_TNS: "Five kings share the narrow neck of land where the eastern and western seas come closest, and the Chinese call our country Tun Sun. Ships from India unload on the Andaman shore, their cargoes cross the hills on porters' backs and elephants, and at Chaiya they meet the ships of Funan and China. The annals say more than ten thousand merchants gather in our markets every day, and over a thousand Brahmins from India have made their homes among us.\n\nAll that wealth passes through our hands but not into our treasury: we are Funan's tributary, and Vyadhapura takes its share. Langkasuka and Kadaram to the south compete for the same trade. We can shelter under Funan, or unite the five kings, pay no one, and tax every cargo that crosses the isthmus."
 tfe_history_TRM: "Purnawarman has just come into his inheritance, and already he speaks of himself as Vishnu come to earth. Tarumanagara rules the plain of western Java below the volcanoes, from the Citarum to the sea, and our Brahmins carve Sanskrit verses in the script of southern India on the boulders of our rivers. Rice feeds us; pepper, rhinoceros horn and forest goods bring foreign ships to our ports.\n\nOur young king has great plans. He means to dig canals against the floods, set his footprints in the stones like the god's, and carry his banners across western Java. The small kingdoms of Java and the ports of Sumatra watch to see how far he will go. The question is whether we build first or conquer first."
 tfe_history_TSU: "Tsukushi is where the islands reach for the mainland. From Hakata bay and the old harbour lands of Na and Ito, whose chief once received a gold seal from a Han emperor, our ships cross by Iki and Tsushima to Gaya and Baekje, and every sword and bolt of silk bound for Yamato passes through our hands. On lonely Okinoshima our priests leave offerings to the goddesses of Munakata who guard the crossing.\n\nThe great king in Yamato calls us his vassals, and for now we answer. But his wars and his iron depend on our harbours, and our lords know it. Do we grow rich as Yamato's gatekeepers, or strike our own bargains with the kings across the strait?"
 tfe_history_TTH: "A hundred thousand people live in our city, in stone compounds along the Avenue of the Dead, beneath the Pyramids of the Sun and the Moon and the temple of the Feathered Serpent. Zapotecs and traders from the Gulf coast keep their own quarters here, and our green obsidian and our gods travel to the farthest cities. Our lord Spearthrower Owl sent his warriors deep into the Maya lowlands, and now his son Yax Nuun Ahiin rules at Tikal.\n\nYet our reach rests on trade, awe and a few garrisons, not on conquered land. We must decide whether to rule the Maya country through our kin and allies, or turn our strength closer to home, to the valleys and trade roads that feed our great city. An empire of prestige lasts only while others believe in it."
 tfe_history_TYH: "Our founder Tuyuhun was a son of the Murong chieftain of Liaodong. He quarrelled with his half-brother when their horses fought, and rather than share the pastures he led his people west. Generations later we are Xianbei khans over the Qiang of the Kokonor, our tents pitched around Dulan and the blue lake, and the horses of our high grasslands are prized even in Chang'an.\n\nNo great power reaches us here, and that is our strength. Western Qin and Later Liang press on our eastern valleys; the Sumpa and the plateau tribes lie behind us. A road from the Tarim to the Sichuan basin could run through our lands if we chose to guard it. Do we stay herdsmen of the high country, or come down and take a share of the dying north?"
 tfe_history_ULD: "Once the whole north was ours. The Ulaid gave Ireland its heroes: Cu Chulainn and the Red Branch fought for our kings at Emain Macha, whose mound still stands near Armagh. But other peoples have eaten into our lands in the west and centre, and now we hold only the north-east.\n\nThe Connachta under Niall are pressing, and his sons are hungry. We are too weak to win back everything we have lost, but strong enough to keep what remains. We can ally with the Laigin and Mumu against Niall, or look across the narrow sea to the Pictish coast, where a new kingdom might be founded. The land of heroes must endure."
 tfe_history_VIS: "Our fathers crossed the Danube twenty years ago, fleeing the Huns, and at Adrianople they killed an emperor. Theodosius made peace in the foedus of 382: land in Moesia, the annona, and our spears in Rome's wars. Last autumn we paid that price at the Frigidus, where thousands of Goths died in the front of his line while his Romans held back. Alaric of the Balthi leads us now, young and hungry for a Roman command.\n\nA foedus binds two men, not two peoples, and one of them lies dead at Mediolanum. We may swear anew to Arcadius, a youth ruled by his prefect Rufinus, or take by the sword what Rome promised and never paid. Thrace and Greece lie open to a Gothic army, and beyond them the road to Italy."
 tfe_history_VOT: "Between the Wall and the Forth, from the stronghold of Traprain Law to Din Eidyn on its rock, the Votadini have long been Rome's friends north of the frontier. Roman silver fills our chieftains' halls, and our warriors watch the Picts for the Empire. Cunedda rules us, a war leader with many sons and a large following.\n\nNow the Wall's garrison is thinning, and Rome may soon need us more than ever. Irish settlers are taking land in the western mountains of Britain, and Rome has no men to drive them out. Cunedda could lead his sons and warriors south to fight them and win a new kingdom in the west, or stay and hold the north against the Picts."
 tfe_history_VSL: "Old Dhanyawadi, with its great bronze Mahamuni, is no longer our royal seat: our chroniclers say the Chandra kings raised Vesali only a few generations ago, in the valley of the Kaladan. We are the people of Arakan, a narrow coast of rivers and mangroves walled off from Burma by the Arakan Yoma, and we face west, toward the ports of Bengal and the Bay beyond. Brahmins and Buddhist monks alike find patrons at our court.\n\nThe mountains protect us and confine us. We can grow into a sea-trading kingdom, sending our ships to Bengal and Sri Lanka, or cross the passes into the Irrawaddy valley and challenge the Pyu. The hill peoples of the Chin country to the north raid and trade by turns; they could become our allies or our first conquest."
 tfe_history_WAK: "Ohosazaki, whom later ages will call Nintoku, is our great king, ruling from the Yamato basin and the harbour at Naniwa. The chroniclers remember that when he saw no smoke rising from the people's cooking fires, he remitted every tax for three years and let his own palace roof leak. The keyhole-shaped mounds of the Kawachi plain, moated and ringed with clay haniwa, proclaim our power to every lord of the islands.\n\nThat power is a web of oaths. The lords of Kibi, Izumo, Kenu and Tsukushi bow to us but keep their own tombs, warriors and gods. Our iron comes from Gaya, across a sea where Goguryeo now fights Baekje. Do we send our warriors into Korea for iron and glory, or first bind the great houses of the islands tighter?"
 tfe_history_WJI: "In the forests of the Mudan and the Ussuri, where winter lasts half the year, live the Wuji. The old Chinese books knew our forefathers as the Sushen, who sent the sage kings arrows of hu wood tipped with stone. We raise pigs and wear their hides, winter in houses dug deep into the ground, and fight on foot with poisoned arrows that the horsemen of the plains have learned to fear.\n\nGoguryeo's forts lie to the south and the Buyeo remnant to the west, and both would sooner have us pay tribute than fight us. Our villages are many and our chiefs more. Stay free in the forests, or unite the valleys and take the rich river lands of Buyeo while its protector looks south?"
 tfe_history_WND: "Roman geographers name us the Venedi, a people of forests and marshes beyond the Vistula. We live along the upper Bug and in the Volhynian marshes, in open villages of log houses, and we plough, fish and burn our dead. Hermanaric the Goth ruled us once, but the Huns broke his realm twenty years ago, and no foreign lord has taken his place.\n\nWe are free, many and scattered, with no great kings. The Huns ride the edge of the steppe to our south, and the Gothic peoples are leaving, their lands emptying behind them. We can stay in our forests, or spread quietly into the lands the Goths leave behind, one village at a time, until the map is full of us."
 tfe_history_WQN: "For generations the Qifu Xianbei have wintered in the hills of Longxi. When Fu Jian's Qin broke at the Fei River, Qifu Guoren gathered the tribes and made himself Grand Chanyu; since 388 his brother Qifu Qiangui has ruled from Jincheng, where the Yellow River comes down out of the mountains. Last year the lord of Chouchi fell fighting us.\n\nOur realm is small and hemmed in on every side: Lü Guang's Later Liang to the west, Yao Xing's Later Qin to the east, the Tuyuhun on the Kokonor grasslands and the Di of Chouchi in the southern hills. None of them is strong enough to swallow us alone, and all of them would like to try. We must choose which of the great to kneel to, and when to stand up again."
 tfe_history_WRE: "Mediolanum mourns an emperor, and a child now reigns alone in the West. Honorius is ten, and the West is governed in his name by Stilicho: son of a Vandal officer, husband of Theodosius's niece Serena, Magister Militum and master of the army that won the Frigidus. Our realm runs from Hadrian's Wall to the Libyan sands, but our senators pay little tax, the great estates hide their tenants from the levy, and our soldiers are paid in debased coin.\n\nConstantinople is our brother court and our rival. Stilicho claims the guardianship of Arcadius too, and the prefect Rufinus will never allow it. Rome eats African grain, and Africa's count Gildo is a Moorish prince who owes us little. Some whisper that Stilicho grooms his son Eucherius for the purple. We must choose between pressing the claim on the East and mending a West whose strength is leaking away."
 tfe_history_WSN: "Five centuries ago the Han emperors sent princesses to marry our kings, and the Wusun were the great power north of the Heavenly Mountains. We still graze our herds around the warm lake of Issyk-Kul and along the Ili, and our kunmo still holds the Red Valley where Chinese envoys once came asking for horses. The Han are long gone, and the Chinese who remain are fighting among themselves.\n\nNow the Rouran are rising on the eastern steppe, and sooner or later they will want the Ili valley. To the south lie the oasis cities of the Tarim; to the west, the Sogdian merchants and the Kidarite Huns. Do we defend our pastures, move toward richer lands, or restore the Wusun as masters of the Heavenly Mountains?"
 tfe_history_YQI: "On the shore of Lake Bosten, on the road between Turfan and Kucha, lies Yanqi, which in our own Tocharian tongue is Agni. We have fields, fish and just enough soldiers to guard our walls. When Lu Guang's army came west twelve years ago, our king bowed before him rather than share Kucha's fate, and the city was spared.\n\nWe are small and surrounded. Kucha to the west has always overshadowed us, and the Chinese warlords of Gansu, the steppe nomads and the lords of Turfan all eye our pastures. Do we stay humble and survive by diplomacy, or look for a strong ally and take our chance to grow?"
 tfe_history_YTB: "Yathrib is an oasis of date gardens and fortified towers, and its masters are Jews. The tribes of Nadir, Qurayza and Qaynuqa have worked its black volcanic soil for generations, and our kin hold Khaybar, Fadak and the villages of Wadi al-Qura to the north. The Aws and Khazraj, Arab newcomers from the south, have settled among us as clients and tenants.\n\nThose newcomers grow in number every year and will not stay clients forever. The kings of Himyar have turned to the One God and may be friends, but they are far away; the tribes of the desert are close. Do we bind the Aws and Khazraj to us as allies, or keep them in their place and trust our walls?"
 tfe_history_YUB: "We are the ones who stayed. When the northern Xiongnu were broken, their strongest clans rode west, and the weaker ones stayed behind to become the Yueban. Our herds now roam the dry steppe of the Sarysu and the Nura, between the Aral Sea and Lake Balkhash, where the grass is thin and the winters are hard.\n\nThe cousins who went west are now called Huns, and caravans bring news of their victories over Goths and Romans. In the east the Rouran are growing strong, and the Wusun hold the better pastures to the south. Do we follow our kin west to share in their plunder, carve out a steppe realm of our own, or seek rich protectors among the oasis kings?"
 tfe_history_ZHZ: "Zhangzhung is the land of Bon, stretching across the high plateau of western Tibet from sacred Mount Kailash to the salt lakes of the Changtang. Our kings rule from Khyunglung, the Silver Palace of the Garuda Valley, and our priests keep the rites of Tonpa Shenrab, the teacher of Bon. We are herders of yaks and sheep, and our gold is dug from the high plateau.\n\nThe Yarlung kings to the east grow stronger with every generation, and the trade routes to India and Khotan pass through our lands. Do we build our kingdom on the wealth of the passes, or strike at Yarlung before it becomes a threat?"
 tfe_history_ZOT: "No king rules the Zo. Our villages cling to the ridges of the Chin Hills above Falam, each under its own chief, each burning new fields from the forest and moving on when the soil tires. We hunt, we raise the mithun, great half-wild cattle whose sacrifice crowns a chief's feasts of merit, and we honour Pathian above and the spirits of hill and stream below.\n\nKingdoms are rising on every side of us: the Pyu in the Irrawaddy valley, Vesali on the Arakan coast, Kamarupa and the Meitei to the northwest. Their merchants want our cotton and beeswax, and their kings want our young men as soldiers. We can stay scattered and free on ridges no army wants to climb, or unite the clans under one chief and deal with the valleys as equals."
 tfe_history_ZPT: "For nearly nine centuries the Zapotec have ruled the Valley of Oaxaca from Monte Alban, the mountaintop city our ancestors made by levelling a summit. Our lords carve their victories and their captives in stone, in one of the oldest scripts of these lands, and our great plaza saw sacrifices and ball games when Teotihuacan was still a village. Now a whole quarter of that city is home to Zapotecs who keep our customs.\n\nTeotihuacan is our friend for now, and its envoys climb to our city bearing gifts. But its power grows and ours does not. The towns of the valley floor grow richer, and their lords less willing to make the climb. We must decide whether to meet Teotihuacan as an equal, or to bind the valley towns more tightly to the mountain."
