l_english:
 tfe_decline_of_the_west: "The Decline of the West"
 tfe_decline_of_the_west_desc: "Two emperors, one of them a boy of ten, and a West that can no longer pay for its own defence. Beyond the Rhine and the Danube whole peoples look south, and in Africa a Moorish count holds the grain ships."
 tfe_decline_west_fallen_tt: "The Western Roman Empire has fallen"
 TFE_DECLINE_PHASE_1: "The Frontiers Give Way"
 TFE_DECLINE_PHASE_1_DESC: "The limes still stands, but thinly manned. Africa, the West's granary, answers to Gildo more than to Ravenna, and the peoples of Germania and Dacia wait for a gap in the line."
 TFE_DECLINE_AFRICA: "Africa"
 TFE_DECLINE_GILDO_PROGRESS: "Gildo's hold on Africa stands at #Y [GetCountry('WRE').MakeScope.GetVariable('tfe_gildo_progress').GetValue|0]#! of #Y 100#!. At 100, or in August 397 at the latest, he rises, and the grain ships stop."
 TFE_DECLINE_GILDO_RISEN: "#R Gildo has risen.#! Africa is his, and Italy goes hungry until the West takes it back."
 TFE_DECLINE_MIGRATORS: "The Peoples Beyond the Rivers"
 TFE_DECLINE_AT_HOME_LIST: "At home (#Y [GetDataModelSize(SituationView.GetActiveSituation.GetSituation.MakeScope.GetList('tfe_migrators_at_home'))]#!)"
 TFE_DECLINE_ON_THE_ROAD_LIST: "On the road (#Y [GetDataModelSize(SituationView.GetActiveSituation.GetSituation.MakeScope.GetList('tfe_migrators_on_the_road'))]#!)"
 TFE_DECLINE_SETTLED_LIST: "Settled on new land (#Y [GetDataModelSize(SituationView.GetActiveSituation.GetSituation.MakeScope.GetList('tfe_migrators_settled'))]#!)"
 TFE_DECLINE_WEST: "The Western Empire"
 TFE_DECLINE_EAST: "The Eastern Empire"
 TFE_DECLINE_AT_HOME: "A people still in its homeland"
 TFE_DECLINE_SETTLED: "A host settled on new land"
 TFE_DECLINE_GILDO: "Gildo's Africa"
 TFE_DECLINE_GUIDE: "#weak #T What the Frontier Reports#!\nAny people of Germania or Dacia that is its own master may take the road from this panel. It abandons its homeland, and every warrior it has marches in one great host that costs nothing while it owns no land but can never replace its dead. The first land it wins becomes its home.\n\nWhere the limes is manned, no people can pass it. The Huns at a people's back, or two Augusti at odds, set them moving.\n\nIn Africa, Gildo gathers the province to himself. When his hold is complete, or in August 397 at the latest, he rises, and takes the grain coast town by town.#!"
