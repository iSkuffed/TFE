l_english:
 tfe_walls.1.title: "Anthemius Measures the Plain"
 tfe_walls.1.desc: "The praetorian prefect Anthemius has walked the ground west of the city with a rope and a surveyor. The old wall of Constantine is a day's walk too close to the harbours, and every year the suburbs spill further past it. He proposes a new line across the whole peninsula: a moat, an outer wall, and behind it a great wall with towers every hundred feet.\n\nThe stone would come from the quarries of Proconnesus, and the work from every guild and every landowner in the city, who would be taxed for their own safety. He offers to begin this spring, and to do it for a third less than the treasury would pay if it waited and commissioned the work itself."
 tfe_walls.1.a: "Raise the walls (a third cheaper than later)"
 tfe_walls.1.b: "The old wall has held so far"
