l_english:
 tfe_walls.1.title: "A Wall Across the Peninsula"
 tfe_walls.1.desc: "Constantine's wall, raised seventy years ago, now stands inside the city: the suburbs, the harbours and the granaries have all spilled past it into open fields. Gothic bands raid Thrace within sight of the gates, and the Huns are on the Danube. The Emperor's ministers have a plan: a single great line of wall from the Propontis to the Golden Horn, with a moat, an outer wall, and behind it a high inner wall with towers every hundred feet. If it stands, no army will take the city from the land.\n\nThe stone would come from the quarries of Proconnesus and the labour from every guild in the city, who would be taxed for their own safety. The ministers can begin this spring and have the work done for a third less than it would cost if the treasury waited and commissioned it later. Or the old wall may hold for a few more years, and the Theodosian Walls can still be raised later, at full price."
 tfe_walls.1.a: "Raise the walls (a third cheaper than later)"
 tfe_walls.1.b: "The old wall has held so far"
