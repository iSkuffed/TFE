l_english:
 tfe_illyricum_claims_name: "Support Stilicho's Claims"
 tfe_illyricum_claims_tooltip: "Stilicho holds that Theodosius meant all Illyricum for the West. Press the claim on Docleatae, the Dardanian Mines, the Margus Valley, Singidunum, Viminacium, Naissus, Dardania and Praevalitana: a casus belli against the East for ten years.\n\nRoman Empire Unity -10"
 tfe_illyricum_claims_color: "dark_red"
 tfe_illyricum_claims_icon: "I"
 tfe_align_visigoths_name: "Align the Visigoths"
 tfe_align_visigoths_tooltip: "Buy Alaric's Goths out of the Eastern foedus and ally them to the West. They will march in your wars, the next one against the East included.\n\nRoman Empire Unity -10"
 tfe_align_visigoths_color: "dark_purple"
 tfe_align_visigoths_icon: "V"
 cb_tfe_illyrian_claim: "Claim Eastern Illyricum"
 cb_tfe_illyrian_claim_desc: "Stilicho's claim: Illyricum was to be the West's."
 war_goal_tfe_take_illyricum: "Take Illyricum"
 war_goal_tfe_take_illyricum_desc: "Only the provinces of Eastern Illyricum can be taken."
 tfe_take_illyricum_valid_locations_tt: "Docleatae, the Dardanian Mines, the Margus Valley, Singidunum, Viminacium, Naissus, Dardania and Praevalitana"
