l_english:
 tfe_gildo.1.title: "Gildo's Count"
 tfe_gildo.1.desc: "Hidden monthly count of Africa's drift."
 tfe_gildo.2.title: "Late Ships from Carthage"
 tfe_gildo.2.desc: "The grain fleet from Carthage sailed three weeks behind its season, and half its holds were short. Count Gildo blames the weather. The harbour masters at Ostia say the weather was fine, and that the missing wheat was sold in Numidia to men who paid in silver and asked no questions."
 tfe_gildo.2.a: "Send an inspector to count the sacks"
 tfe_gildo.2.b: "Ships are late every year"
 tfe_gildo.3.title: "Gildo Names His Price"
 tfe_gildo.3.desc: "Gildo has stopped answering letters from the consistory. He answers the Donatist bishops the day their letters arrive. His envoy at court says the count would be content with the rank of Master of Soldiers for Africa, for life, and a bride from the imperial house for his son.\n\nThe envoy also mentions, as if by chance, how many ships lie in Carthage harbour."
 tfe_gildo.3.a: "Make him Master of Soldiers for Africa"
 tfe_gildo.3.b: "Put our own garrisons in the African ports"
 tfe_gildo.3.c: "He can wait for an answer"
 tfe_gildo.4.title: "The Bishops of Numidia"
 tfe_gildo.4.desc: "Honorius's edicts against the Donatists are still the law, and the bishops of Numidia say Gildo is the only count in Africa who does not enforce them. Whole congregations now pray for him by name. His soldiers sleep in their churches.\n\nThe Catholic bishop of Carthage begs us to choose: the edicts or the count."
 tfe_gildo.4.a: "Suspend the edicts in Africa"
 tfe_gildo.4.b: "The law is the law"
 tfe_gildo.5.title: "Gildo at Cirta"
 tfe_gildo.5.desc: "The bishops of Numidia crowd the forum at Cirta. Gildo speaks to them in Latin, then in Punic, so the Moors at the back can follow. He does not call himself emperor. He says Africa has fed Rome for four hundred years and been sent tax collectors in return.\n\nBy evening the road to the coast is full of carts, and none of them carry wheat to the ships."
 tfe_gildo.5.a: "So it begins"
 tfe_gildo.6.title: "Gildo's Reach"
 tfe_gildo.6.desc: "Hidden monthly check on Gildo's homage to the East and his seat."
