l_english:
 tfe_senior_augustus: "Senior Augustus"
 tfe_senior_augustus_plural: "Senior Augusti"
 tfe_senior_augustus_desc: "The Augustus who has reigned longest. The Senior Augustus leads the [GetUniqueInternationalOrganization('tfe_roman_empire').GetName] and decrees its edicts. When the Senior Augustus dies, the other Augustus becomes Senior."
 tfe_edicts_law: "Edicts of the Augusti"
 tfe_edicts_law_desc: "An edict of the Senior Augustus binds both halves of the Empire. Decreeing one costs 5 Unity and needs Unity of at least 50. Once decreed, an edict binds for 5 years before another can replace it."
 tfe_edict_fide_policy: "Edict of Faith"
 tfe_edict_fide_policy_desc: "All peoples under the Empire shall hold the faith of Nicaea. Arians, Donatists and pagans are to be brought in, whether they like it or not."
 tfe_edict_codificatio_policy: "Codification of the Laws"
 tfe_edict_codificatio_policy_desc: "The emperors' constitutions gathered into a single code for East and West. Governors must obey it, and so must bishops who would rather judge their own."
 tfe_edict_cursus_publicus_policy: "Cursus Publicus"
 tfe_edict_cursus_publicus_policy_desc: "The imperial post is restored between the two courts. Couriers ride from Mediolanum to Constantinople in days, on horses the provincials must feed."
 tfe_edict_agri_deserti_policy: "Agri Deserti"
 tfe_edict_agri_deserti_policy_desc: "Deserted fields go to whoever will till them. Their taxes fall on the neighbouring landowners until the land bears again."
 tfe_edict_annona_policy: "Annona Civica"
 tfe_edict_annona_policy_desc: "Free bread for the people of the great cities, paid for with the provinces' grain."
