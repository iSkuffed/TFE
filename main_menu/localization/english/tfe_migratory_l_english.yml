l_english:
 tfe_migrate_east: "Migrate into the East"
 tfe_migrate_east_desc: "We leave the lands of our fathers behind. Every warrior of our people joins the host on the road, south over the Danube, to take by the sword a richer home within the Empire of the East."
 tfe_migrate_west: "Migrate into the West"
 tfe_migrate_west_desc: "We leave the lands of our fathers behind. Every warrior of our people joins the host on the road, west over the Rhine, to take by the sword a richer home within the Empire of the West."
 tfe_migrate_EAR_tt: "#R We declare war on [GetCountry('EAR').GetName] at once.#! Its Augustus may offer us land for our fealty."
 tfe_migrate_WRE_tt: "#R We declare war on [GetCountry('WRE').GetName] at once.#! Its Augustus may offer us land for our fealty."
 tfe_migration_not_yet_tt: "A month has passed since the death of Theodosius"
 tfe_start_migration_tt: "#R We abandon every [location|e] we own#! and live in our host from now on.\nTwenty-four regiments of footmen and eight of tribal cavalry join our host.\nA fifth of our people leave with it, to settle the first land we take.\nWhile we own no land our [army|e] costs nothing to maintain and suffers far less attrition, but it cannot be replenished: the fallen are gone.\n#R When we take land of our own, the host disbands back to our old warband.#!"
 AUTO_MODIFIER_NAME_tfe_migrating_host: "Host on the Move"
 cb_tfe_migration: "Migration"
 cb_tfe_migration_desc: "Our people are on the road, and the road ends where we take land of our own."
 war_goal_superiority_tfe_migration: "Seize a Homeland"
 war_goal_superiority_tfe_migration_desc: "We will take land from them for our people to settle."
 tfe_barbaricum: "Barbaricum"
 tfe_barbaricum_desc: "The lands beyond the limes, as Rome calls them. Their peoples raid, trade and marry across borders nobody polices, and a warband may cross a neighbour's land without asking leave. A host on the road goes where it will."
