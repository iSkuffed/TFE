l_english:
 tfe_start_migration: "Start Migration"
 tfe_start_migration_desc: "We leave the lands of our fathers behind. Every warrior of our people joins the host on the road, to take by the sword a richer home within the Empire."
 tfe_start_migration_tt: "#R We abandon every [location|e] we own#! and live in our host from now on.\nTwenty-four regiments of footmen and eight of tribal cavalry join our host.\nWhile we own no land our [army|e] costs nothing to maintain and suffers far less attrition, but it cannot be replenished: the fallen are gone.\n#R When we take land of our own, the host disbands back to our old warband.#!"
 AUTO_MODIFIER_NAME_tfe_migrating_host: "Host on the Move"
 cb_tfe_migration: "Migration"
 cb_tfe_migration_desc: "Our people are on the road, and the road ends where we take land of our own."
 war_goal_superiority_tfe_migration: "Seize a Homeland"
 war_goal_superiority_tfe_migration_desc: "We will take land from them for our people to settle."
