l_english:
 tfe_make_camp: "Make Camp"
 tfe_make_camp_desc: "Our host halts on empty land and raises its camp there. The camp becomes our capital and the place our warriors gather; the old camp is left behind."
 tfe_make_camp_tt: "One of our armies standing on [location|e] without an owner plants our camp there: we [own|e] it and make it our capital. Our previous camp is abandoned."
 tfe_raise_warband: "Raise Warband"
 tfe_raise_warband_desc: "The warriors of our people take up arms and join the host."
 tfe_raise_warband_tt: "Three regiments of footmen and one of tribal cavalry gather at our camp, or else with our host, or else at our capital."
 MODIFIER_TYPE_NAME_tfe_make_camp_cost_modifier: "Make Camp Cost"
 MODIFIER_TYPE_DESC_tfe_make_camp_cost_modifier: "This impacts the [costs|e] of making camp."
 MODIFIER_TYPE_NAME_tfe_raise_warband_cost_modifier: "Raise Warband Cost"
 MODIFIER_TYPE_DESC_tfe_raise_warband_cost_modifier: "This impacts the [costs|e] of raising a warband."
