l_english:
 tfe_hospitalitas: "Hospitalitas"
 tfe_hospitalitas_desc: "The Empire cannot throw a whole people back over the river, but it can give them a province to live in, and a foedus to keep them there. As Rome settled the Visigoths in Aquitaine in 418, we offer a host on the road the land of one of our provinces. They may take it, or they may go on."
 tfe_hospitalitas_tt: "Our [location|e]s in the chosen [province|e] pass to the host if it accepts, and it becomes our [ShowSubjectTypeName('tfe_foederati')]. The host may refuse."
 tfe_hospitalitas_choose_host: "Choose the host to settle"
 tfe_hospitalitas_no_host: "No host is on the road."
 tfe_hospitalitas_choose_province: "Choose the province to give"
 tfe_hospitalitas_no_province: "We have no province to spare."
 tfe_decline_rome.1.title: "Lands for Fealty"
 tfe_decline_rome.1.desc: "Envoys of [tfe_rome.GetName] have found our host on the road. The Augustus offers us land within his borders, a foedus, and the annona, in return for our spears against his enemies. It is not the richest country in the Empire, but it is land, and it is offered, not taken."
 tfe_decline_rome.1.a: "Accept this offer."
 tfe_decline_rome.1.a.tt: "Lands we will get within the Empire: every [location|e] of #Y [tfe_land.GetName]#! that [tfe_rome.GetName] still holds.\nWe make peace with [tfe_rome.GetName], take the offered land and become its [ShowSubjectTypeName('tfe_foederati')]. The great host disbands back to our old warband."
 tfe_decline_rome.1.b: "Decline this offer."
 tfe_decline_rome.1.b.tt: "We refuse, and [tfe_rome.GetName] is told."
 tfe_decline_rome.1.b.war_tt: "We continue our war with [tfe_rome.GetName]. This will be settled on the battlefield."
 tfe_decline_rome.2.title: "The Host Refuses"
 tfe_decline_rome.2.desc: "[tfe_host.GetName] has heard our envoys out and sent them home. The land we offered is still ours, and the host is still on the road."
 tfe_decline_rome.2.a: "So be it"
 tfe_man_the_limes: "Man the Limes"
 tfe_man_the_limes_desc: "The river forts stand half empty, their men sold to the field armies. Gold and recruits will fill them again for a decade, and no people beyond that diocese's frontier will dare take the road."
 tfe_man_the_limes_tt: "Every frontier fort we hold in the chosen diocese is garrisoned for 10 years: stronger defence and a larger garrison. No people whose land borders them may migrate."
 tfe_man_the_limes_cost: "The cost of a garrison"
 tfe_man_the_limes_choose_region: "Choose the diocese whose frontier to man"
 tfe_man_the_limes_no_region: "Every diocese on our frontier is already manned."
 STATIC_MODIFIER_NAME_tfe_limes_manned: "Limes Manned"
 STATIC_MODIFIER_DESC_tfe_limes_manned: "An Augustus has filled the river forts and watchtowers of this stretch of the frontier with men."
 tfe_barred_by_the_limes_tt: "A Roman garrison mans the frontier beside our lands"
 tfe_man_the_limes_price: "Manning the Limes"
