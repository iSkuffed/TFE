l_english:
 tfe_opening.1.title: "Guardian of Both Sons"
 tfe_opening.1.desc: "Theodosius is dead at Mediolanum, and his sons are a boy of ten in the West and a youth of seventeen in the East. Stilicho, magister of both services, husband of the emperor's niece, swears that with his last breath Theodosius gave him both boys to guard.\n\nThe armies of East and West are still camped together in Italy. In Constantinople, the prefect Rufinus holds Arcadius and does not mean to share him."
 tfe_opening.1.a: "Send the Eastern legions home under Gainas"
 tfe_opening.1.b: "The East is mine to guard as well"
 tfe_opening.2.title: "Murder on the Campus Martius"
 tfe_opening.2.desc: "The Eastern legions have come home. Arcadius and his prefect Rufinus rode out to greet them on the Campus Martius outside Constantinople. Gainas's Goths closed around the prefect and cut him down at the emperor's feet. His head was carried through the city on a pike.\n\nArcadius is free of Rufinus. Whether he is free of anyone else is another matter."
 tfe_opening.2.a: "Eutropius will manage the court"
 tfe_opening.2.b: "The Augustus will rule for himself"
 tfe_opening.3.title: "Gildo Withholds the Grain"
 tfe_opening.3.desc: "Gildo, son of the Moorish prince Nubel and count of Africa for a dozen years, has stopped the grain ships bound for Rome. He now says that Africa answers to Constantinople, not Mediolanum, and the Donatist bishops of Africa bless his cause.\n\nHis brother Mascezel, whose sons Gildo murdered, is at our court and offers to lead the army against him."
 tfe_opening.3.a: "Mascezel will take Africa back"
 tfe_opening.3.b: "Italy can go hungry for a season"
 tfe_opening.4.title: "Africa Offered to the East"
 tfe_opening.4.desc: "Envoys from Gildo, count of Africa, are at Constantinople. Gildo has broken with the West and asks to hold the diocese of Africa from our Augustus instead: its grain, its ports and its legions. To accept is to steal the bread of Rome from the brother court."
 tfe_opening.4.a: "Accept Africa's homage"
 tfe_opening.4.b: "Send his envoys back in chains"
 tfe_opening.5.title: "A Constantine in Britain"
 tfe_opening.5.desc: "The army in Britain has made an emperor of Marcus, killed him, crowned the townsman Gratian and killed him too. Now it has raised a common soldier for his lucky name: Constantine, like the great Constantine who was also proclaimed in Britain. He is gathering ships to cross to Gaul, where the Rhine frontier has already broken."
 tfe_opening.5.a: "Denounce the tyrant"
 tfe_opening.5.b: "Recognise him as a colleague"
 TFE_GILDO: "Gildonian Africa"
 TFE_GILDO_ADJ: "Gildonian"
 TFE_CONSTANTINE: "Constantine's Empire"
 TFE_CONSTANTINE_ADJ: "Constantinian"
 cb_tfe_suppress_usurper: "Suppress the Usurper"
 cb_tfe_suppress_usurper_desc: "A usurper holds a Roman province that is ours by right."
 cb_tfe_claim_the_purple: "Claim the Purple"
 cb_tfe_claim_the_purple_desc: "We have been proclaimed Augustus. The rest of the Empire must be won."
 STATIC_MODIFIER_NAME_tfe_stilicho_regency: "Stilicho's Regency"
 STATIC_MODIFIER_DESC_tfe_stilicho_regency: "The magister of both services rules for the boy Honorius. The army is his and the great houses follow him."
 STATIC_MODIFIER_NAME_tfe_rufinus_prefecture: "Rufinus's Prefecture"
 STATIC_MODIFIER_DESC_tfe_rufinus_prefecture: "The praetorian prefect Rufinus rules Arcadius's court, sells its offices and squeezes its provinces."
 STATIC_MODIFIER_NAME_tfe_eutropius_chamber: "Rule of the Chamberlain"
 STATIC_MODIFIER_DESC_tfe_eutropius_chamber: "The eunuch Eutropius holds the emperor's bedchamber, and with it the Empire."
