l_english:
 AUTO_MODIFIER_NAME_tfe_roman_recruitment: "Recruits, Not Levies"
 AUTO_MODIFIER_DESC_tfe_roman_recruitment: "Rome raises no peasant host. Landowners owe recruits to the conscription tax, or pay gold in their place, and the Empire fights with soldiers it pays."
 AUTO_MODIFIER_NAME_tfe_rations_in_kind: "Rations in Kind"
 AUTO_MODIFIER_DESC_tfe_rations_in_kind: "The field army is fed from the grain tax of Italy and Africa, gathered into the state granaries, so its soldiers cost less than their debased pay would."
 STATIC_MODIFIER_NAME_tfe_ravaged_by_the_goths: "Ravaged by the Goths"
 STATIC_MODIFIER_DESC_tfe_ravaged_by_the_goths: "Since Adrianople the Goths have burned their way across Thrace and the Moesias, and they still live inside the frontier. The villages are empty and the fields untilled."
 STATIC_MODIFIER_NAME_tfe_hunnic_ravages: "Hunnic Ravages"
 STATIC_MODIFIER_DESC_tfe_hunnic_ravages: "The Huns came through the Caspian Gates in the summer of 395 and drove off the herds and the people as far as Antioch."
 STATIC_MODIFIER_NAME_tfe_isaurian_brigands: "Isaurian Brigands"
 STATIC_MODIFIER_DESC_tfe_isaurian_brigands: "The mountain folk of the Taurus raid the roads and the coast towns, and no governor has ever tamed them."
 tfe_east_395.1.title: "The Huns Beyond the Caspian Gates"
 tfe_east_395.1.desc: "While the Eastern army is still in Italy with Stilicho, the Huns have ridden through the Caspian Gates. They are plundering Armenia and Cappadocia, burning the villages of Cilicia and driving captives out of Syria. Antioch has manned its walls, and there is no army to send."
 tfe_east_395.1.a: "Let the cities hold their walls until they go home."
 tfe_east_395.1.a.tt: "Armenia, Cappadocia, Cilicia and northern Syria suffer Hunnic Ravages for 2 years."
