l_english:
 orthodox: "Nicene Christianity"
 orthodox_ADJ: "Nicene"
 orthodox_desc: "The faith of the Creed of Nicaea, made the religion of the Empire by Theodosius in 380: one Catholic and Orthodox Church under the bishops of Rome, Constantinople, Alexandria and Antioch, which will not divide for centuries yet."
 norse: "Germanic Paganism"
 norse_ADJ: "Germanic"
 norse_desc: "The old religion of the Germanic peoples, from the Rhine to the fjords: Wodan and Donar, Tiwaz and Frija, the sacred groves and the lots cast before battle."
 nestorianism: "Church of the East"
 nestorianism_ADJ: "East Syriac"
 nestorianism_desc: "The Christians of the Persian Empire, who pray in Syriac from Edessa to Merv. Suspected by the Shahanshahs as friends of Rome, they are growing into a church of their own under the Catholicos of Seleucia-Ctesiphon."
