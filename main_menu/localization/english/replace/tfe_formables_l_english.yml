l_english:
 GER_f: "Germania"
 GER: "Germania"
 GER_ADJ: "Germanic"
 GER_f_desc: "Rome drew the Rhine and the Danube as the edge of the world, and named everything beyond them Germania. Now one crown holds the forests and the river valleys the legions never kept: no longer a land of warbands and their chiefs, but a kingdom of its own."
 POR_f_desc: "Between the Tagus and the Minius lie Lusitania and the southern marches of Gallaecia, the old lands of Viriathus that Rome took two centuries to subdue. Gathered under one crown, the coast that faces the Ocean is a kingdom of its own."
 HRE_f_desc: "Gaul, Germania, Raetia and Noricum, the whole Western frontier that the Augusti once held from Treveri and Mediolanum, under one Christian crown. The Empire of the West has fallen, or soon will; we claim its mantle and its holiness, and name ourselves its heirs."
