l_english:
 LIV_a_order_knights: "Sacred Horse of the Order"
 LIV_a_order_knights_desc: "Horsemen sworn to defend the faith and its shrines fight with a zeal that others lack."
 LIV_a_order_knights_2: "Holy Horse of the Order"
 LIV_a_order_knights_2_desc: "A sworn brotherhood of heavy horse answers to its master and to the Church."
 absolute_rulership: "Autocracy"
 absolute_rulership_desc: "The ruler stands above every other power, and the crown's authority over the estates grows."
 absolutism_agressive_advance: "Needs of the State"
 absolutism_agressive_advance_desc: "As more regions are consolidated and resources run short, the ruler's claims are enforced with force, and the anger it stirs is easier to bear."
 absolutism_control_decline_advance: "Divan"
 absolutism_control_decline_advance_desc: "The divan of ministers and secretaries runs the realm by decree and letter, so control over the provinces decays more slowly."
 absolutist_court: "Sacred Palace"
 absolutist_court_desc: "The palace is the heart of the realm; courtiers and officers depend on the ruler, and the estates lose ground."
 additional_merchants: "Collegia of Merchants"
 additional_merchants_desc: "Merchants form collegia in every port, and their numbers and standing grow."
 advanced_anti_piracy_warfare: "Coastal Watch"
 advanced_anti_piracy_warfare_desc: "Watchtowers and patrol ships guard the coast, and the pirates have fewer places to hide."
 advanced_paik_system_advance: "Paik Companies"
 advanced_paik_system_advance_desc: "The paik levy system matures into a regular body of light infantry."
 albanian_the_fortified_kulla_houses: "Tower Houses"
 albanian_the_fortified_kulla_houses_desc: "Nobles and wealthy farmers build stone tower-houses against feud and invader."
 albanian_the_stradioti_tradition: "Illyrian Horsemen"
 albanian_the_stradioti_tradition_desc: "The poverty of our mountains has made our men the finest light horsemen, hired by every emperor and king."
 anatomy_advance: "Galenic Medicine"
 anatomy_advance_desc: "Physicians study Galen's anatomy and writings, treat wounds better, and keep more of the sick alive."
 art_school_advance: "Workshops of the Mosaicists"
 art_school_advance_desc: "Mosaicists, sculptors and painters train their pupils in set styles, so that the craft does not die with its masters."
 artillery_institution_advance: "Greek Fire"
 artillery_institution_advance_desc: "Engineers of Constantinople learn to throw a burning liquid that water cannot put out. The secret of its making is closely kept, and the fleets and walls it defends are hard to take."
 artillery_vs_fort_age_6_revolutions: "Counterweight Trebuchets"
 artillery_vs_fort_age_6_revolutions_desc: "Counterweight trebuchets and heavy rams fill the gap between small engines and mining, and walls fall."
 artists_advance_reformations: "Icons and Mosaics"
 artists_advance_reformations_desc: "Painters of icons and mosaicists fill the churches, and new artists come to the trade with better skills."
 artists_advance_revolutions: "Carolingian Illumination"
 artists_advance_revolutions_desc: "Scribes and painters fill gospels and psalters with illumination, and new artists come with better skills."
 arts_academy_advance: "Palace Academy"
 arts_academy_advance_desc: "A palace academy gathers poets, painters and philosophers under the emperor's patronage."
 assault_ability_reformation: "Storming Parties"
 assault_ability_reformation_desc: "Our best and most disciplined troops are picked to storm a breach, and assaults succeed more often."
 assault_ability_revolutions: "Scaling the Walls"
 assault_ability_revolutions_desc: "Troops trained to go up ladders and through breaches under missile fire carve a path for our army."
 banking_advance: "The Solidus"
 banking_advance_desc: "Constantine's gold coin has kept its weight for generations, and the world prices its goods by it. Where the solidus circulates, bankers lend against it and merchants trust a bargain made in it."
 basic_financial_instruments: "Bills of Credit"
 basic_financial_instruments_desc: "A merchant can pay in one port against a bill drawn in another, and trade becomes safer and surer."
 bayonet_leaders: "Leading from the Front"
 bayonet_leaders_desc: "Men who are well led will follow, so our officers ride at the head of the charge."
 beat_to_windward_advance: "Lateen Rig"
 beat_to_windward_advance_desc: "Triangular sails let a ship sail closer to the wind, so voyages are quicker and surer."
 blast_furnace: "Improved Bloomeries"
 blast_furnace_desc: "Taller bloomery furnaces with water-driven bellows make more iron from the same ore."
 bng_bengali_industrialization: "Muslin Weavers"
 bng_bengali_industrialization_desc: "The weavers of Bengal make the finest muslin in the world, and our cloth and fine cloth output grows."
 bole_smelting: "Hilltop Smelting"
 bole_smelting_desc: "Lead is smelted in open-air hearths on windy hilltops, and output rises."
 borjigin_blood: "Blood of the Great Chief"
 borjigin_blood_desc: "Our chiefs claim descent from the great war leaders of the steppe, and the clans follow a ruler of that blood."
 castle_advance: "Burgus"
 castle_advance_desc: "Small fortified towers and strongholds on the frontier give a garrison somewhere to hold when the legions are far away."
 cir_multireligious_society: "Religious Coexistence"
 cir_multireligious_society_desc: "Our lands are crossed by Christian, Jewish and pagan traders and settlers, and we have learned to let each keep their own rites."
 city_of_scholars: "Schools of Africa"
 city_of_scholars_desc: "Carthage, Hippo and Cirta keep schools of rhetoric and grammar that train the best advocates and bishops of the Empire."
 colonies: "Frontier Settlement"
 colonies_desc: "Settlers are sent out to farm land beyond the frontier, and the crown claims the clearings, wells and villages they found there."
 combined_arms_advance_reformation: "Mixed Formations"
 combined_arms_advance_reformation_desc: "Armies now fight with horse, foot and archers together, and commanders who use each to cover the other's weakness gain a bonus."
 combined_arms_advance_revolutions: "Combined Arms Doctrine"
 combined_arms_advance_revolutions_desc: "Centuries of fighting with horse, foot and archers together have made the doctrine second nature."
 confessional_court: "Episcopal Court"
 confessional_court_desc: "A court that lets its bishops advise and manage the household spends more wisely, and the people come to the ruler's faith faster."
 confessionalism_advance: "Religious Law"
 confessionalism_advance_desc: "A faith that writes down its rules makes a community of its believers, with courts of its own. Councils, synods and schools of jurists set out what the faithful must do, and judges apply it to the common life."
 confucian_academy_advance: "Imperial Academy"
 confucian_academy_advance_desc: "The state trains scholar-officials in the classics, and a man who passes its examinations may serve."
 conscription_advance: "Levy"
 conscription_advance_desc: "All free men of age are bound to serve when the army is called."
 conscription_center_advance: "Muster Field"
 conscription_center_advance_desc: "Free men gather in arms on the muster field each spring."
 construction_speed_revolutions: "Stone Vaulting"
 construction_speed_revolutions_desc: "Masons learn to span wider spaces with vaults and domes, and great buildings go up faster."
 conviction_of_sin: "Penance"
 conviction_of_sin_desc: "Those who have done wrong fall to their knees; public penance under the clergy gives the pious peace of mind."
 cork_stoppers: "Cooperage"
 cork_stoppers_desc: "Casks of well-seasoned oak keep wine through long voyages, and the vintners' output grows."
 corps_organisation: "Comitatus"
 corps_organisation_desc: "Bands of sworn companions fight beside their lord; units attached to one another keep pace and fight faster."
 correct_box_advance_discovery: "Tribunes"
 correct_box_advance_discovery_desc: "Tribunes and decurions lead the troops under the commander, and orders reach the line so that the army fights closer to its plan."
 correct_box_advance_reformation: "Strategikon Drill"
 correct_box_advance_reformation_desc: "The drill laid down in the military manuals of Maurice's Strategikon makes bodies of troops fight as they are taught."
 correct_box_advance_revolutions: "Household of the Commander"
 correct_box_advance_revolutions_desc: "Commanders keep staffs of officers and clerks who plan the advance and send out orders."
 crown_power_advance_reformation: "Anointed Rulers"
 crown_power_advance_reformation_desc: "The ruler is God's anointed, the clergy preach his right to rule, and the crown commands more of its estates."
 crown_power_advance_renaissance: "Sovereign Majesty"
 crown_power_advance_renaissance_desc: "The emperor's sacred person stands above the old orders; senators, curiae and bishops answer to his will."
 crown_power_advance_revolutions: "Renewed Empire"
 crown_power_advance_revolutions_desc: "A ruler who has gathered all powers under him is hailed as emperor, and subjects across the realm see themselves as one people under him."
 dai_ca_tru: "Court Singers"
 dai_ca_tru_desc: "Singers and storytellers carry our culture's tales to the great houses, and our name is known the further for them."
 dai_don_dien: "Garrison Farms"
 dai_don_dien_desc: "Soldiers and landless peasants are settled on new land as garrison farmers, and newly won regions are integrated faster."
 dai_literary_reform: "Literary Reform"
 dai_literary_reform_desc: "Our scholars adapt the writing of the classical tongue to our own speech, and literacy spreads."
 dai_thuan_thien: "Heaven's Mandate"
 dai_thuan_thien_desc: "Our ruler holds the mandate of heaven, shown by omens and victory, and the crown's power over the estates is great."
 dai_trade_advance: "Local Trade Contracts"
 dai_trade_advance_desc: "Our existence has been shaped by our great neighbour for too long. To leave our own mark we write our own contracts with merchants and extend our trade."
 deus_vult: "Holy War"
 deus_vult_desc: "Those who do not share our faith are our enemies, and God wills that we fight them."
 diplomatic_range_age_6: "Distant Embassies"
 diplomatic_range_age_6_desc: "Envoys travel to far courts, Constantinople, Baghdad, Aachen, Chang'an, and our diplomacy reaches farther."
 distiller_mill_advance: "Alembic Works"
 distiller_mill_advance_desc: "Alchemists' alembics distil spirits and perfumes in works large enough to sell them."
 early_modern_administation: "Palace Bureaus"
 early_modern_administation_desc: "A larger palace bureaucracy of secretaries, notaries and treasurers lets the crown govern a wider realm."
 economic_ideas: "Directed Economy"
 economic_ideas_desc: "The crown measures, taxes and directs the wealth of the country, and the economy serves the government."
 emancipation: "Grants of Freedom"
 emancipation_desc: "Owners who free their bondsmen gain loyal tenants, and the land is held by those who will fight for it."
 empiricism: "Observation of Nature"
 empiricism_desc: "Things are learned by looking at them closely and writing down what is seen, and law made on what is known is better law."
 eng_red_coats: "Island Spearmen"
 eng_red_coats_desc: "The spearmen of the far island are drilled to stand in ranks that nothing breaks."
 enlightened_court: "Palace School"
 enlightened_court_desc: "A palace school teaches the sons of nobles and clerks to read the classics, and the court's culture reaches far."
 enlightenment_advance: "The Carolingian Renaissance"
 enlightenment_advance_desc: "Charlemagne gathers scholars from every part of Christendom to his court. Schools open at cathedrals and monasteries, handwriting is made clear, and the Latin classics are copied again."
 exploration_maintenance_advance: "Seaworthy Hulls"
 exploration_maintenance_advance_desc: "Ships built of well-seasoned timber on strong keels stand long voyages and need less patching."
 faceting: "Lapidaries"
 faceting_desc: "Master gem-cutters work stones for the crowns and belts of emperors and kings, and the demand for jewels rises."
 feudalism_advance: "Patrocinium"
 feudalism_advance_desc: "Where the state cannot protect the poor, a great landlord can. Peasants and small owners commend themselves and their land to a patron, pay him rent and service, and are defended in return. The patron's estate grows into a power of its own."
 flintlock_gun: "Hunting Methods"
 flintlock_gun_desc: "Hunters learn better ways of baiting, trapping and tracking, and bring in more fur and game."
 food_advance_absolutism: "Three-Field Rotation"
 food_advance_absolutism_desc: "Fields are divided into three and sown in turn, and the harvest improves."
 formalized_officer_corps: "Ranks of Command"
 formalized_officer_corps_desc: "Officers are given rank and pay by the crown, not by birth, and our armies show more initiative."
 fort_limit_1_advance: "Limes Forts"
 fort_limit_1_advance_desc: "Garrison forts are strung along the frontier roads and rivers, and a prefect can hold more of them."
 free_subjects: "Freedmen"
 free_subjects_desc: "A freedman who works for himself produces more raw material than a slave who is beaten into the field."
 frisian_legend_grutte_pier: "The Legend of Redbad"
 frisian_legend_grutte_pier_desc: "Tales are told of a Frisian king who held his marshes against the Franks, and our sea captains take heart from them: raiding the enemy's shipping is honourable."
 german_mountain_toll_castle_advance: "Pass Tolls"
 german_mountain_toll_castle_advance_desc: "A tower over the pass takes a toll of every cart and mule that climbs it."
 german_river_toll_castle_advance: "River Tolls"
 german_river_toll_castle_advance_desc: "Strongholds on the great rivers stop every boat and take the lord's toll before they let it pass."
 global_empire: "Tributary Provinces"
 global_empire_desc: "Our commitment to the provinces and tributary kingdoms changes attitudes toward working in them, and subjects pay more."
 global_trade_advance: "The Silk Road"
 global_trade_advance_desc: "Caravans carry silk, paper and spice across the oases of Central Asia, and the cities along the road grow rich on tolls and markets. Goods, faiths and ideas pass from hand to hand between China and the Mediterranean."
 gov_reform_reformation_a: "Mirror for Princes"
 gov_reform_reformation_a_desc: "Bishops and scholars write books that teach a king his duties, and rulers who read them govern with more offices."
 government_size_revolutions: "Assemblies of the Realm"
 government_size_revolutions_desc: "With regular assemblies of nobles and bishops, government grows in size and capacity."
 greek_group_hesychast_traditions_advance: "Ascetic Tradition"
 greek_group_hesychast_traditions_advance_desc: "The desert fathers and those who follow them teach a life of silence and prayer, and monasteries fill with men who copy books and write down their sayings."
 greek_group_stratioti_levies_advance: "Limitanei"
 greek_group_stratioti_levies_advance_desc: "Frontier soldiers settled on the land and bound to defend it give us hardy light horsemen who know the hills."
 greek_group_the_modern_greek_enlightenment_advance: "Macedonian Renaissance"
 greek_group_the_modern_greek_enlightenment_advance_desc: "Scholars of Constantinople gather, copy and comment on the classics and write new works in the old forms."
 gunpowder_empires: "Engines of Conquest"
 gunpowder_empires_desc: "The caliphs' armies bring great siege engines, mangonels, ballistae and naphtha throwers, across the desert, and keeping them costs less."
 hakkapelitta: "Northern Horse"
 hakkapelitta_desc: "Horsemen of the north learn to charge fast and hit hard with the sword."
 home_of_hussars: "Home of the Light Horse"
 home_of_hussars_desc: "The hills and plains of our land breed the finest light horse, and the best of them ride for us."
 honji_suijaku: "Kami and Foreign Gods"
 honji_suijaku_desc: "The local kami are read as faces of the gods of other lands, and the clergy of both are content."
 house_of_parliament_advance: "Senate House"
 house_of_parliament_advance_desc: "A hall where the senators or councillors of a city meet, debate and vote."
 humanism: "Learning for All"
 humanism_desc: "Mankind is God's highest creation, and the schools teach more people to read and write."
 humanist_tolerance: "Edicts of Toleration"
 humanist_tolerance_desc: "By making room for other creeds, we can calm the tensions between our peoples."
 hun_found_the_black_army: "Found the Standing Army"
 hun_found_the_black_army_desc: "A king who pays his soldiers all year keeps a standing army of veterans that no neighbour can match."
 iconostasis: "Templon"
 iconostasis_desc: "The wall between nave and altar is hung with icons and carved into a screen, and patrons pay well for its painters."
 imperial_creed: "Imperial Creed"
 imperial_creed_desc: "Nicene Christianity is the faith of the Empire by Theodosius's law, and the emperor's standing rests on his care for the Church."
 improve_relation_impact_absolutism: "Chancery of Foreign Letters"
 improve_relation_impact_absolutism_desc: "A standing chancery, its clerks fluent in many tongues, keeps friendly letters flowing to every court."
 impulse_warfare: "Skirmish Tactics"
 impulse_warfare_desc: "Light troops harass the enemy line before the main body closes, and our morale is steadier."
 incamisana_advance: "Huaca Shrines"
 incamisana_advance_desc: "Stepped platforms of adobe rise above the valley, where priests make their offerings and read the will of the gods."
 industrial_expansion_advance: "Collegia"
 industrial_expansion_advance_desc: "Craftsmen's collegia grow in the cities, and the state can promote their trades across a wider web of workshops."
 industrialization_advance: "The Manor"
 industrialization_advance_desc: "A lord's estate is farmed in strips by dependent peasants, who owe him labour on his own fields. The mill, the heavy plough and the three-field rotation make such estates the cell of the northern economy."
 industry_promotion_advance: "State Workshops"
 industry_promotion_advance_desc: "The fabricae of the Empire forge arms and weave cloth under the eye of the state, and the crown can favour the crafts of the cities it chooses."
 intelligence_agency_advance: "Agentes in Rebus"
 intelligence_agency_advance_desc: "The agentes in rebus, couriers who also report on officials, give the state eyes in every province."
 international_nobility: "Families Across Borders"
 international_nobility_desc: "Great families hold lands and kin in many realms, and can send envoys to them."
 ira_persian_rug_production: "Persian Carpets"
 ira_persian_rug_production_desc: "Persia has long been famous for its carpets and rugs, and the looms of its towns work for courts from Constantinople to China."
 iron_mill_advance: "Hammer Mill"
 iron_mill_advance_desc: "Water-driven trip hammers beat iron bars out of the bloom, and iron output rises."
 italian_condottieri: "Great Captains"
 italian_condottieri_desc: "Our land is known for its great soldiers, whether in the emperor's service or hired out to whoever pays, and hiring a mercenary and his captain costs less."
 jap_bushido: "Way of the Bow and Horse"
 jap_bushido_desc: "The warrior's conduct is not written down, but it is known: loyalty to his lord, courage in the field, and no shame at the end."
 jap_codified_bushido: "Ideals of Honour"
 jap_codified_bushido_desc: "The conduct of the warrior is praised in poems and chronicles, and our prestige fades more slowly."
 jap_head_hunting: "Battle Trophies"
 jap_head_hunting_desc: "A warrior's deed is worth little unless it can be shown, and trophies taken from the fallen carry his name home."
 jap_ichiban_yari: "First Blow"
 jap_ichiban_yari_desc: "To strike the first blow is an honour and a good omen, and our warriors charge eagerly to claim it."
 jap_shinobi: "Spies and Scouts"
 jap_shinobi_desc: "Some of our people have long made a trade of watching others and carrying word, and the lords of the land pay them well."
 jesuits_bark: "Bimaristans"
 jesuits_bark_desc: "Hospitals with trained physicians treat fevers with herbs and bark, and sufferers in the fever lands live."
 jewish_group_civic_emancipation: "The Geonim"
 jewish_group_civic_emancipation_desc: "The heads of the great academies guide the communities, and under the host states our people rise in standing."
 jewish_group_court_financiers: "Radhanite Merchants"
 jewish_group_court_financiers_desc: "Our family firms serve the courts of Franks, Byzantines and caliphs, lending and trading, and the tax collectors favour them."
 judaism_hasidic_movement: "Wandering Preachers"
 judaism_hasidic_movement_desc: "Preachers carry comfort and the stories of the sages to the common people in every village, and they bear their burdens more easily."
 judaism_international_banking_networks: "Kinship Networks"
 judaism_international_banking_networks_desc: "Kin spread across Persian, Frankish and Arab lands pass credit and news between them, and our envoys are many."
 judaism_modern_orthodoxy: "Karaite Scholars"
 judaism_modern_orthodoxy_desc: "Scholars who debate Scripture against the rabbis make our learning famous."
 judaism_mussar_movement: "Masoretes"
 judaism_mussar_movement_desc: "Masoretes copy, vowel and fix the text of Scripture, and the clergy's work is held in respect."
 judaism_positive_historical_movement: "Responsa"
 judaism_positive_historical_movement_desc: "Rabbis answer questions of law from every community, and their answers are copied and cited."
 judaism_rationalist_yeshiva: "Talmudic Academies"
 judaism_rationalist_yeshiva_desc: "The academies of Sura and Pumbedita debate and write down the Talmud, and the books of their scholars spread."
 judaism_state_credit_apparatus: "Radhanite Credit"
 judaism_state_credit_apparatus_desc: "Our traders pool credit across the Frankish, Byzantine and Persian worlds and lend to rulers, and our loan capacity grows."
 judaism_tikkun_mysticism: "Merkabah Mysticism"
 judaism_tikkun_mysticism_desc: "Our mystical school contemplates the divine chariot and the heavenly halls, and the pious find in it a way to bring the world nearer to God."
 kainerekowa: "Law of the Longhouse"
 kainerekowa_desc: "We keep faith with the Peacemaker's law, which binds the nations of the longhouse to council before they go to war, and the weariness of war fades sooner."
 kor_geobukseon: "Armoured Galleys"
 kor_geobukseon_desc: "Galleys roofed with iron plates and spikes are hard to board and hard to sink."
 kurultai_advance: "Gathering of the Chiefs"
 kurultai_advance_desc: "The leaders of every warrior band gather beneath one tent and choose the one they will follow to war."
 late_feudal_relations: "Client Kingdoms"
 late_feudal_relations_desc: "Rome rules through client kings who owe it troops and loyalty by treaty, and those bound to us by treaty are slower to turn."
 late_winged_hussars_advance: "Late Winged Cataphracts"
 late_winged_hussars_advance_desc: "The winged lancers are better armed and drilled, and no line holds against their charge."
 lazaretto_advance: "Plague Houses"
 lazaretto_advance_desc: "After the Plague of 541 cities set aside houses where the sick are kept apart from the healthy."
 leader_recruit_cost_advance: "Schools of Command"
 leader_recruit_cost_advance_desc: "Young men of good houses are trained in the art of command before they are given troops or ships, and it costs less to train them."
 legalism_advance: "Roman Law"
 legalism_advance_desc: "Rome's jurists have written down how a citizen may sue, marry, bequeath and contract, and the codes of the emperors bind the whole Empire. Where the law is known and its courts sit, a stranger can trust a bargain and a governor can be held to a rule."
 letters_of_marque: "Sealed Commissions"
 letters_of_marque_desc: "A sealed commission turns a pirate into a raider of the crown, and every captain can be hired more cheaply."
 levee_en_masse_advance: "Feudalism"
 levee_en_masse_advance_desc: "Land is held in return for military service, and every lord owes his king a body of mounted men. Counts and their vassals can call up an army for the season and send it home when the campaign is over."
 lumber_improvements_absolutism: "Water-Powered Sawmills"
 lumber_improvements_absolutism_desc: "With the water wheel at our sawmills, we process timber into planks far faster."
 manufactories_advance: "Paper"
 manufactories_advance_desc: "Paper, a Chinese art, reaches the workshops of Samarkand and Baghdad. It is cheaper than parchment and papyrus, and the clerks, merchants and scholars who use it write more."
 march_to_the_sound_of_the_guns_advance: "Forced March"
 march_to_the_sound_of_the_guns_advance_desc: "Commanders learn to push troops hard toward the fight."
 maritime_advance_age_3: "Coastal Fleets"
 maritime_advance_age_3_desc: "Patrol and trade fleets keep to the coasts and chart the harbours, and they reach farther each year."
 maritime_advance_age_4: "Reach of the Fleets"
 maritime_advance_age_4_desc: "Ships from our harbours reach every coast of the Mediterranean and beyond, and our presence at sea grows."
 maritime_advance_age_5: "Escorted Fleets"
 maritime_advance_age_5_desc: "Ships travel in escorted fleets that carry more goods with less loss."
 massed_battery: "Siege Train"
 massed_battery_desc: "Let us mass our engines in a single siege train, and its destruction will blast a hole in any line."
 matchlock_gun: "Hunting Traditions"
 matchlock_gun_desc: "Better bows, spears, snares and nets, and hunters who know the animals' paths, bring in more fur and game."
 measuring_the_world: "Measuring the World"
 measuring_the_world_desc: "Scholars measure the circumference of the earth and the latitude of cities, and distance from the capital is felt less."
 medical_school_advance: "Medical Schools"
 medical_school_advance_desc: "At Gundeshapur and elsewhere, physicians of many creeds teach and heal side by side, and learned doctors are trained."
 medieval_administration: "Dioceses and Prefectures"
 medieval_administration_desc: "Diocletian's reforms cut the provinces small and set prefects and vicars over them."
 medieval_military: "Late Roman Army"
 medieval_military_desc: "The field armies and frontier troops have been reorganised, and discipline and drill hold them steady in a hard fight."
 merchant_adventures: "Sea Venturers"
 merchant_adventures_desc: "Merchants share the risk and the profit of a voyage, and our sea routes grow more efficient."
 merchant_officials: "Publicani"
 merchant_officials_desc: "Companies of publicani bid for state contracts and supply the army, and the merchants among them come to hold office."
 merchant_power_from_maritime_absolutism_advance: "Merchant Colleges"
 merchant_power_from_maritime_absolutism_advance_desc: "Merchants of the ports form colleges to protect their trade, and their share of the sea's wealth grows."
 merchant_power_from_maritime_reformation_advance: "Shipping Partnerships"
 merchant_power_from_maritime_reformation_advance_desc: "Sea trade needs capital and shared risk, and merchants who join forces for it gain more from the seas we hold."
 meritocracy_advance: "The Nine Ranks"
 meritocracy_advance_desc: "Officials are graded in nine ranks by the quality of their character and learning, and the court rises by recommendation rather than by blood. The system began under the kings of Wei and shapes the governments of the east."
 military_revolution_advance: "The Heavy Horse"
 military_revolution_advance_desc: "The stirrup and a stronger breed of horse give the armoured rider a seat from which he can couch a lance. A charge of such men can break an infantry line, and the ruler who can field them has the upper hand."
 modern_bureaucracy: "Missi Dominici"
 modern_bureaucracy_desc: "Envoys of the ruler ride in pairs, a count and a bishop, to inspect every province, and provinces are integrated faster."
 modern_road_advance: "Military Roads"
 modern_road_advance_desc: "Roads of laid stone, cambered and drained, carry carts in any weather and armies at the march."
 mountain_roads: "Mountain Paths"
 mountain_roads_desc: "A network of paths carries goods and runners over the passes and between the valleys."
 mourning_wars: "Adoption of Captives"
 mourning_wars_desc: "When a family has lost one of its own, its women ask for captives to take his place, and war brings new people into the tribe."
 nanto_rokushuu: "Continental Learning"
 nanto_rokushuu_desc: "Scholars from across the sea bring writing and the teachings of the sages, and the best families keep clerks and teachers."
 national_assemblies_advance: "Provincial Councils"
 national_assemblies_advance_desc: "Delegates of the provincial cities meet each year to petition the governor and the emperor, and the councils give them a voice."
 national_bank: "Imperial Treasury"
 national_bank_desc: "A central treasury gives the ruler a firm hand on coin, minting and loans."
 national_conscripts: "Compulsory Service"
 national_conscripts_desc: "Service is made compulsory for every free man who is able, and regiments are raised faster."
 national_sovereignty: "Territorial Rule"
 national_sovereignty_desc: "The ruler's authority comes to be tied to the land rather than to each subject, and new provinces are folded in faster."
 nationalistic_enthusiasm: "Care for the Army"
 nationalistic_enthusiasm_desc: "Giving our troops adequate support is vital to defence, and with good administration the army is cheaper to keep."
 nav_people_of_the_sea: "People of the Sea"
 nav_people_of_the_sea_desc: "From the harbours of the Basque coast, hardy crews man fishing boats and warships alike and know the Biscay waters better than any."
 nav_shipyards_ironworks: "Yards and Forges"
 nav_shipyards_ironworks_desc: "The shipyards of the Cantabrian coast and the iron forges of its river valleys supply the fleets."
 naval_ambitions: "Mastery of the Sea"
 naval_ambitions_desc: "A navy that believes it rules the waves sails farther and fights harder."
 naval_morale_advance_1: "Late Roman Fleet"
 naval_morale_advance_1_desc: "Crews of the provincial fleets drill in coastal waters and know their harbours, and hold together at sea."
 naval_morale_advance_3: "Long Voyages"
 naval_morale_advance_3_desc: "Crews used to weeks out of sight of land hold their nerve in battle."
 naval_professionalism: "Standing Fleets"
 naval_professionalism_desc: "Permanent fleets with salaried crews sail farther without disbanding."
 naval_supplies_manufactory_advance: "Naval Stores"
 naval_supplies_manufactory_advance_desc: "Dockside depots stock timber, pitch, rope and sailcloth for the fleet."
 new_currency_demands: "Small Change"
 new_currency_demands_desc: "Growing trade needs small coin, and the demand for the copper and tin that coins and bronze work are made of goes up."
 new_world_advance: "The Monsoon Trade"
 new_world_advance_desc: "Sailors from Egypt and Arabia have learned the rhythm of the monsoon winds and cross the Indian Ocean to the pepper coasts of India. Each year the ships carry out gold and wine and bring back spices, cloth and gems."
 new_world_crops: "Heavy Plough"
 new_world_crops_desc: "The heavy plough with coulter and mouldboard turns the wet clay lands of the north, and fields that were forest bear grain."
 noble_officers: "Comites and Duces"
 noble_officers_desc: "Counts and dukes command our troops, and our nobles see to it that army and navy keep their traditions alive."
 noble_resilience: "Noble Connections"
 noble_resilience_desc: "The war-bands of this land are headed by lesser nobles, and a ruler who befriends them finds troops for hire."
 optimism: "Confident Councils"
 optimism_desc: "Victory is won in the council chamber too, and our advances in war weary our people less."
 overseas_merchants: "Foreign Quarters"
 overseas_merchants_desc: "Merchants who settle abroad are granted rights and protection, and our trade reaches farther."
 overseas_trade: "Distant Markets"
 overseas_trade_desc: "Merchants and shippers push farther across the Mediterranean, the Red Sea and the Atlantic, and our trade reaches new markets."
 paper_guild_cloth_maintenance_advance: "Rag Paper"
 paper_guild_cloth_maintenance_advance_desc: "Cotton too worn for cloth is pulped and pressed into paper, and the paper-makers keep their cloth supply."
 peasants_rights_laws_advance: "Law of the Free Peasantry"
 peasants_rights_laws_advance_desc: "The law protects the free peasant against his lord's demands, and the coloni of the Empire have a claim to the soil they till."
 pike_and_shot_advance: "Mounted Archery"
 pike_and_shot_advance_desc: "The riders of the steppe and the Persian plateau shoot from the saddle, wheeling and loosing. Their way of war spreads to every army that has faced them and survived."
 pike_square: "Shield Wall"
 pike_square_desc: "Heavy infantry stand shoulder to shoulder behind a wall of shields and spear-points and hold against a charge, and our battle tactics improve."
 platoon_fire: "Archer Volleys"
 platoon_fire_desc: "Maurice teaches the troops to loose their missiles in volleys by rank, and the army's fire is steady."
 pop_promotion_speed_age_4: "Monastic Clergy"
 pop_promotion_speed_age_4_desc: "Monasteries take in the sons of farmers and craftsmen and train them as clerks and priests, and a gifted boy can rise."
 pop_promotion_speed_age_6: "Service for Land"
 pop_promotion_speed_age_6_desc: "Service in the household of a great lord lifts men from the farm to rank and land."
 por_cacadores: "Lusitanian Skirmishers"
 por_cacadores_desc: "Light infantry of the Atlantic coast fight in open order and shoot from cover."
 pound_lock_canals_advance: "Canal Locks"
 pound_lock_canals_advance_desc: "Gates of timber and stone hold the water, so barges climb."
 power_projection_advance_2: "Imperium"
 power_projection_advance_2_desc: "Rome claims the right to command in every land it has ever held, and its ambition outreaches its armies."
 power_projection_advance_5: "Dream of Universal Rule"
 power_projection_advance_5_desc: "As the ruler's power centralises, his officers begin to look abroad, and more governors are placed."
 power_projection_advance_6: "Imperial Ambitions"
 power_projection_advance_6_desc: "Rulers who gather many peoples under one crown dream of empire, and their reach is felt abroad."
 press_gangs: "Coastal Conscription"
 press_gangs_desc: "Fishermen and coastal men are bound to serve in the fleet, so ships are repaired and manned easily."
 printing_of_religious_texts: "Scriptoria"
 printing_of_religious_texts_desc: "Monasteries and cathedral schools copy Scripture and the Fathers by hand and send the codices out, and new learning takes root more cheaply."
 printing_press_advance: "The Scriptorium"
 printing_press_advance_desc: "The codex has replaced the scroll, and monks and clerks copy it by hand in workshops attached to cathedrals and monasteries. Books grow cheaper and more people learn to read them."
 private_to_marshal: "Rise from the Ranks"
 private_to_marshal_desc: "Every soldier may become a captain by his deeds, and our heavy infantry fight with greater power."
 privateers: "Corsairs"
 privateers_desc: "Raiding enemy shipping is a poor man's navy; we shall license captains who prey on our enemies' coasts."
 professional_armies_advance: "Foederati"
 professional_armies_advance_desc: "Whole peoples are settled within the frontier and bound by treaty to fight for the emperor under their own chiefs. Their warbands are better soldiers than the levies of the provinces, and they know it."
 public_punishments: "Ship's Discipline"
 public_punishments_desc: "Life at sea is full of dangers, and punishments must be harsh; crews who obey hold together in battle."
 quinine: "Pharmacopoeia"
 quinine_desc: "Apothecaries compile pharmacopoeias of drugs and herbs, and medicine for the fevers is known."
 raj_fortress_architecture: "Fortress Architecture"
 raj_fortress_architecture_desc: "Hill forts and walled cities rise across the plains and hills, and every raid taught the builders where the walls must be thickest."
 raj_reorganized_rajput_regiments: "Clan Contingents"
 raj_reorganized_rajput_regiments_desc: "The clan structures that have always filled our armies are drilled into steadier bodies of men."
 regiment_reinforcement_speed_absolutism: "Quartermasters"
 regiment_reinforcement_speed_absolutism_desc: "Standing armies have a quartermaster for each regiment, and reinforcements and supplies reach them faster."
 regiment_reinforcement_speed_reformation: "Reserve Drafts"
 regiment_reinforcement_speed_reformation_desc: "Regiments are topped up from depots with fresh men, and losses are made good faster."
 regimental_camp_advance: "Standing Camps"
 regimental_camp_advance_desc: "Fortified camps train and house the regiments through the winter."
 regimental_system: "Theme System"
 regimental_system_desc: "Troops raised from set regions are tied to them, and keeping them in the field costs less."
 renaissance_advance: "Monasticism"
 renaissance_advance_desc: "Men and women leave the world for a life of prayer and labour under a rule. Their houses clear land, copy books, shelter travellers and keep the learning of an older age alive."
 renaissance_court: "Court of the Rhetors"
 renaissance_court_desc: "Poets, rhetors and philosophers crowd the palace, and our culture is known the further for them."
 renaissance_sculptures: "Spolia and Sculpture"
 renaissance_sculptures_desc: "Old statues and columns are reused and new ones carved, and the quarries are worked harder."
 renaissance_thought: "Senatorial Counsel"
 renaissance_thought_desc: "The notion of a noble council ruling beside the emperor is hardly new, and the counsel of the old senatorial families opens more offices to us."
 renaissance_urbanisation: "Roman City Planning"
 renaissance_urbanisation_desc: "Streets laid on a grid, with quarters for workshops and markets, let a city make more of the land around it."
 repair_at_sea_aorev: "Careening"
 repair_at_sea_aorev_desc: "Ships are heeled over in deep coastal water, and cleaned and caulked, without a trip to the yard."
 res_publica_christiana: "Respublica Christiana"
 res_publica_christiana_desc: "We must keep good relations with our fellow Christians of every creed, for the Church spans every frontier and its bishops write to one another across them."
 rgo_build_time_advance: "Brick and Concrete"
 rgo_build_time_advance_desc: "Masons who know vaults, concrete and brick-faced walls raise great buildings in far less time."
 rgo_size_advance_absolutism: "Estate Management"
 rgo_size_advance_absolutism_desc: "Treatises on estate management teach lords to farm and mine their land properly, and it supports more labour."
 rgo_size_advance_reformation: "Land Reclamation"
 rgo_size_advance_reformation_desc: "New fields are cleared, terraced and drained, and the land supports more labour."
 rights_of_man: "Capitularies"
 rights_of_man_desc: "Written capitularies set out the rights and duties of free men and officials, and the cabinet runs better under them."
 romanian_the_foundation_of_the_voivodeship_tradition: "Rule of the Knezes"
 romanian_the_foundation_of_the_voivodeship_tradition_desc: "In the hills and valleys the war leaders of the villages are named knezes and judges, and one of them holds the rest together."
 rotherham_plough: "Heavy Wheeled Plough"
 rotherham_plough_desc: "The heavy plough on wheels breaks the heavy soils of the north and feeds more people."
 saiger_process_discovery: "Cupellation"
 saiger_process_discovery_desc: "Smelters refine silver out of lead ore by cupellation, as the Romans did, to fill the mints."
 scholasticism: "Patristic Learning"
 scholasticism_desc: "Augustine, Jerome and Ambrose are read and copied in every cathedral school, and the learning of the Fathers spreads with the faith."
 schools_of_thought: "Schools of Law"
 schools_of_thought_desc: "Muslim tradition has always prized learning; from the schools of law and theology scholars and ideas flow outward, and new practices spread more cheaply."
 scientific_experimentation: "Disputation"
 scientific_experimentation_desc: "Scholars test arguments against one another in public, and new ideas spread faster."
 scientific_mapping_advance: "Geographers' Maps"
 scientific_mapping_advance_desc: "Geographers at the caliph's court gather reports from travellers and merchants and draw the known world with new accuracy."
 scientific_revolution_advance: "The House of Wisdom"
 scientific_revolution_advance_desc: "Scholars at the caliph's court gather books from every land and translate them into Arabic. In Baghdad mathematicians, astronomers and physicians set out to test what the ancients wrote."
 sea_hawks: "Sea Captains"
 sea_hawks_desc: "We focus on war at sea, and our captains and crews raise our naval tradition."
 separation_of_powers: "Mixed Constitution"
 separation_of_powers_desc: "Writers recall Polybius, who held that a lasting state mixes the rule of one, of the few and of the many, and rulers can open more offices."
 serfdom: "Coloni"
 serfdom_desc: "The coloni are tied to the land they till, and their landlords answer for their rents and their recruits. The army eats, and the estates grow quiet."
 ship_building_techniques_absolutism: "Slipways"
 ship_building_techniques_absolutism_desc: "Shipwrights haul hulls ashore on slipways and build and repair them in sheltered yards, so builds go faster."
 ships_penny: "Ship Levy"
 ships_penny_desc: "Coastal cities that cannot build ships pay a levy to those who can, and ships are built faster."
 siege_ability_revolutions: "Siege Engineers"
 siege_ability_revolutions_desc: "Specialist engineers direct sapping, mining and engines at the walls."
 slave_center_advance: "Slave Markets"
 slave_center_advance_desc: "Dealers gather bondsmen at set markets in the cities, where they are priced, sold and shipped across the Empire."
 slave_soldiers: "Servile Troops"
 slave_soldiers_desc: "Our rulers keep corps of bought and freed slaves, loyal to their master alone, and these give us sturdy infantry and growing numbers."
 slave_trade_act_advance: "Roman Slave Law"
 slave_trade_act_advance_desc: "Rome's law knows the slave as a thing that can be bought, sold and set free, and every people that trades with Rome learns that law."
 slitting_mills: "Water-Powered Forges"
 slitting_mills_desc: "Watermills drive hammers and rollers that cut iron bars into rods, and iron output rises."
 smithian_economics: "Regulated Markets"
 smithian_economics_desc: "The state regulates weights, measures and markets and meddles no further, and production runs more efficiently."
 spa_naval_reforms: "Fleets of Three Seas"
 spa_naval_reforms_desc: "The coasts of Iberia face the Bay, the Atlantic and the Mediterranean, and its fleets learn each of them."
 spy_construction_absolutism: "The Barid"
 spy_construction_absolutism_desc: "The postal system doubles as a network of informers across the realm."
 spy_construction_reformation: "Cipher Offices"
 spy_construction_reformation_desc: "Clerks trained to make and break ciphers help build spy networks faster."
 standardisation_of_calibre: "Standard Issue"
 standardisation_of_calibre_desc: "Arms of one pattern are easier to store and replace, and an army can be supplied further."
 standardized_pikes: "Spear Levy"
 standardized_pikes_desc: "A spear is a simple weapon, and spears of one length and make are easy to store and issue, so a levy can be armed and fed in the field."
 sturdy_privateers: "Hardy Corsairs"
 sturdy_privateers_desc: "Corsairs are always in the line of fire, and ships built for the work, and crews who expect it, last longer."
 subject_integration: "Absorbing Client Kings"
 subject_integration_desc: "When a client's line fails or its king is deposed, the kingdom is folded into the provinces and its elites are made citizens."
 subject_loyalty_absolutism: "Oaths of Fealty"
 subject_loyalty_absolutism_desc: "Every subject, and every vassal state, swears loyalty to the ruler, and revolt is counted heresy."
 suez_canal_advance: "Canal of the Pharaohs"
 suez_canal_advance_desc: "Clear the old canal between the Nile and the Red Sea, silted and abandoned, and ships pass between the seas again."
 superior_firepower: "Massed Engines"
 superior_firepower_desc: "Massing engines to break an enemy before the final charge is one of the oldest tactics, and our artillery hits harder."
 supply_depot_advance_age_4_reformation: "Magazines"
 supply_depot_advance_age_4_reformation_desc: "Grain and fodder stored in fortified magazines let armies march farther from home."
 surgery_advance: "Surgery"
 surgery_advance_desc: "Field surgeons set bones, cauterise wounds and cut out arrows, and fewer men die of their wounds."
 swiss_reislaufer: "The Alpine Spearmen"
 swiss_reislaufer_desc: "The spearmen of the high valleys are hired out to any prince who pays, and fight as one."
 tamazight: "Tamazight"
 tamazight_desc: "The Amazigh-speaking tribes, from the Syrtis to the Atlantic, keep their own tongue under every governor Rome sends them, and their flocks graze the high pastures."
 tambo_advance: "Waystations"
 tambo_advance_desc: "Rest houses along the roads feed and shelter runners, travellers and soldiers on the march."
 the_constitution: "Imperial Edicts"
 the_constitution_desc: "The ruler issues written edicts that bind his officials and assemblies, and the shape of government can be redrawn."
 the_red_cannon: "The Great Onager"
 the_red_cannon_desc: "A famous founder builds an engine so huge that a single stone brings down a tower."
 town_rights_rev_advance: "Seat of Empire"
 town_rights_rev_advance_desc: "The capital, seat of the ruler, is granted special rights, and the whole realm looks to it."
 trampling_horde: "Trampling Horde"
 trampling_horde_desc: "Attila made the world tremble with his conquests, and we will do the same."
 tribal_modernization_law_advance: "Settling the Tribes"
 tribal_modernization_law_advance_desc: "Tribes that settle under a king take on law and the plough."
 turco_mongol_tradition: "Steppe Tradition"
 turco_mongol_tradition_desc: "Xiongnu, Huns and the peoples after them each took something from the riders before; we are heirs of them all, and can rule many peoples."
 ukrainian_farmlands: "Pontic Farmlands"
 ukrainian_farmlands_desc: "The black earth of the lands north of the Euxine yields enough wheat, pulses and flax to feed a nation."
 university_advance: "Higher Schools"
 university_advance_desc: "Rhetors and grammarians teach the sons of the elite in endowed chairs at Rome, Athens, Constantinople and Alexandria, and the best go on to the law."
 urbanization: "Revival of Towns"
 urbanization_desc: "New markets and walled towns draw people from the countryside."
 vaccination_advance: "Public Hospitals"
 vaccination_advance_desc: "Public hospitals with trained doctors keep the populace healthier and the old longer lived."
 wagenburg: "Carrago"
 wagenburg_desc: "A ring of wagons gives archers and spearmen a fort wherever the army halts, as the peoples of the steppe have long known."
 war_college_advance: "School of War"
 war_college_advance_desc: "Officers learn the art of war from the manuals of old and from veterans, and our commanders are better trained."
 war_score_revolutions_advance: "Just War"
 war_score_revolutions_advance_desc: "Clerics argue what makes a war just, and a ruler who wins on just grounds takes more from the peace."
 winged_hussars_advance: "Winged Cataphracts"
 winged_hussars_advance_desc: "Heavy lancers with wings of feathers on their backs thunder through the enemy line."
 xuanzang_travels: "Faxian's Journey"
 xuanzang_travels_desc: "Faxian, a Chinese Buddhist monk, travelled to India for the sacred texts and came home with them, and his account makes our name known abroad."
 yams_of_the_great_khan: "Relay Riders of the Great Chief"
 yams_of_the_great_khan_desc: "Fast riders carry the chief's word from camp to camp, with fresh horses waiting at every halt."
 zmw_controlling_the_mutapan_riches: "Gold of the Interior"
 zmw_controlling_the_mutapan_riches_desc: "Gold from the mines and the Zambezi, traded down to the coast, enriches the land."
