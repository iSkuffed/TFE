l_english:
 TUR_scenario_desc: "The #W Huns#! have burst out of the steppe and hold the lands north of the Black Sea. The Goths flee before them, and the frontiers of Rome lie open."
 CAS_scenario_desc: "Under Bahram IV, the #W Sasanian Empire#! watches a divided Rome and holds the old borders from Nisibis to the Oxus."
 HUN_scenario_desc: "Christian #W Aksum#! controls the Red Sea trade between Rome, Arabia and India from its highland capital."
 HOL_scenario_desc: "The #W Gupta Empire#! under Chandragupta II is at the height of its power, rich from the Ganges plain and the trade of both seas."
 NOR_scenario_desc: "Theodosius is dead. His young son Arcadius rules the #W Eastern Roman Empire#! from Constantinople, while the prefect Rufinus holds the real power and Alaric's Goths are in revolt."
 NAP_scenario_desc: "The child emperor Honorius reigns over the #W Western Roman Empire#!, but the general Stilicho rules it. The Rhine and Danube must be held with ever fewer Roman soldiers."
