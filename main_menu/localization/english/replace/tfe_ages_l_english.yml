l_english:
 age_1_traditions: "Theodosius"
 age_1_traditions_desc: "Theodosius is dead, and for the last time one man has ruled the whole Roman world. His sons divide it: Arcadius in Constantinople, Honorius in the West. Beyond the rivers the peoples of Germania and the steppe watch the Empire's armies, and wait."
 age_2_renaissance: "Migrations"
 age_2_renaissance_desc: "Whole peoples are on the road. Goths, Vandals, Burgundians and Franks cross the Rhine and the Danube, and the Huns drive them on. The West breaks into kingdoms ruled by barbarian kings over Roman subjects, while the East holds its walls."
 age_3_discovery: "Justinian"
 age_3_discovery_desc: "Constantinople reaches out to take back what was lost: Africa, Italy, the shores of Spain. Law is codified and the greatest church in the world rises over the Bosporus, but plague follows the armies and the reconquest strains the Empire to breaking."
 age_4_reformation: "the Prophet"
 age_4_reformation_desc: "Rome and Persia exhaust each other in the last great war of antiquity, and out of Arabia comes a new faith that overruns both. Slavs settle the Balkans, the Lombards hold Italy, and the old world gives way."
 age_5_absolutism: "the Caliphs"
 age_5_absolutism_desc: "From the Indus to the Pyrenees one empire rules in the name of God. Constantinople survives its sieges, Iconoclasm divides the Church, and in the West the Franks become the shield of Latin Christendom."
 age_6_revolutions: "Charlemagne"
 age_6_revolutions_desc: "A Frankish king is crowned Emperor of the Romans in Rome. Vikings strike from the north, Magyars from the steppe, and the empire Charlemagne built is divided among his grandsons. The world of Late Antiquity is gone."
