l_english:
 feudalism: "Patrocinium"
 feudalism_desc: "Where the state cannot protect the poor, a great landlord can. Peasants and small owners commend themselves and their land to a patron, pay him rent and service, and are defended in return. The patron's estate grows into a power of its own."
 legalism: "Roman Law"
 legalism_desc: "Rome's jurists have written down how a citizen may sue, marry, bequeath and contract, and the codes of the emperors bind the whole Empire. Where the law is known and its courts sit, a stranger can trust a bargain and a governor can be held to a rule."
 meritocracy: "The Nine Ranks"
 meritocracy_desc: "Officials are graded in nine ranks by the quality of their character and learning, and the court rises by recommendation rather than by blood. The system began under the kings of Wei and shapes the governments of the east."
 renaissance: "Monasticism"
 renaissance_desc: "Men and women leave the world for a life of prayer and labour under a rule. Their houses clear land, copy books, shelter travellers and keep the learning of an older age alive."
 banking: "The Solidus"
 banking_desc: "Constantine's gold coin has kept its weight for generations, and the world prices its goods by it. Where the solidus circulates, bankers lend against it and merchants trust a bargain made in it."
 professional_armies: "Foederati"
 professional_armies_desc: "Whole peoples are settled within the frontier and bound by treaty to fight for the emperor under their own chiefs. Their warbands are better soldiers than the levies of the provinces, and they know it."
 new_world: "The Monsoon Trade"
 new_world_desc: "Sailors from Egypt and Arabia have learned the rhythm of the monsoon winds and cross the Indian Ocean to the pepper coasts of India. Each year the ships carry out gold and wine and bring back spices, cloth and gems."
 printing_press: "The Scriptorium"
 printing_press_desc: "The codex has replaced the scroll, and monks and clerks copy it by hand in workshops attached to cathedrals and monasteries. Books grow cheaper and more people learn to read them."
 pike_and_shot: "Mounted Archery"
 pike_and_shot_desc: "The riders of the steppe and the Persian plateau shoot from the saddle, wheeling and loosing. Their way of war spreads to every army that has faced them and survived."
 confessionalism: "Religious Law"
 confessionalism_desc: "A faith that writes down its rules makes a community of its believers, with courts of its own. Councils, synods and schools of jurists set out what the faithful must do, and judges apply it to the common life."
 global_trade: "The Silk Road"
 global_trade_desc: "Caravans carry silk, paper and spice across the oases of Central Asia, and the cities along the road grow rich on tolls and markets. Goods, faiths and ideas pass from hand to hand between China and the Mediterranean."
 artillery_institution: "Greek Fire"
 artillery_institution_desc: "Engineers of Constantinople learn to throw a burning liquid that water cannot put out. The secret of its making is closely kept, and the fleets and walls it defends are hard to take."
 manufactories: "Paper"
 manufactories_desc: "Paper, a Chinese art, reaches the workshops of Samarkand and Baghdad. It is cheaper than parchment and papyrus, and the clerks, merchants and scholars who use it write more."
 scientific_revolution: "The House of Wisdom"
 scientific_revolution_desc: "Scholars at the caliph's court gather books from every land and translate them into Arabic. In Baghdad mathematicians, astronomers and physicians set out to test what the ancients wrote."
 military_revolution: "The Heavy Horse"
 military_revolution_desc: "The stirrup and a stronger breed of horse give the armoured rider a seat from which he can couch a lance. A charge of such men can break an infantry line, and the ruler who can field them has the upper hand."
 enlightenment: "The Carolingian Renaissance"
 enlightenment_desc: "Charlemagne gathers scholars from every part of Christendom to his court. Schools open at cathedrals and monasteries, handwriting is made clear, and the Latin classics are copied again."
 industrialization: "The Manor"
 industrialization_desc: "A lord's estate is farmed in strips by dependent peasants, who owe him labour on his own fields. The mill, the heavy plough and the three-field rotation make such estates the cell of the northern economy."
 levee_en_masse: "Feudalism"
 levee_en_masse_desc: "Land is held in return for military service, and every lord owes his king a body of mounted men. Counts and their vassals can call up an army for the season and send it home when the campaign is over."
