l_english:
 aalborg_desc: "No town stands on the Limfjord yet. Himmerland and the fjord shores are farmed by Germanic villages of the Jutland peninsula, whose chiefs are buried with Roman bronze and glass that came north along the old amber roads. Aalborg's market will not be founded for centuries."
 aarhus_desc: "No town stands at the mouth of the Aarhus river yet, only farming villages of eastern Jutland around a sheltered bay. The people here are the forebears of the Danes, living in long timber houses, raising cattle and barley, and burying their dead with the odd Roman cup or coin from the south."
 abo_desc: "No town stands at the mouth of the Aura river yet. The coast of southwest Finland holds scattered farmers, hunters and sealers, ancestors of the Finns, who bury their dead under stone cairns on the ridges and trade furs across the Baltic with the Svear and the Aesti."
 adan_desc: "Adane, the old Eudaemon Arabia of the Greek sailors, a harbour inside an extinct volcano on the Gulf of Aden. Himyar rules southern Arabia from Zafar, and ships between Egypt, Aksum and India still put in here for water and goods, though the trade is smaller than in the days of the Periplus."
 aghmat_desc: "No town stands in the Ourika valley yet. At the foot of the High Atlas the plain and foothills belong to Mauri herders and farmers who have never known Roman officials, for the province of Mauretania Tingitana ends far to the north. Aghmat, a Berber market below the mountains, lies in the future."
 aleppo_desc: "Beroea, a Greek city of Syria founded by Seleucus on a citadel mound above the Quwayq river. It sits on the road from Antioch to the Euphrates frontier, with a bishop and a Greek-speaking town of weavers and traders, while Syriac is spoken in the villages of the plain around it."
 alexandria_desc: "Alexandreia, founded by Alexander, capital of Egypt and the second city of the East. Its grain fleet feeds Constantinople, and in 391 the bishop Theophilus led the crowds that tore down the great Serapeum, last shelter of the old gods and their books."
 algeciras_desc: "Iulia Traducta, a small port of Baetica on the bay opposite the Rock of Calpe, settled under Augustus with people brought over from Tingis. Its coast is lined with fish-salting yards whose garum goes by sea to Rome, and the older colony of Carteia faces it across the water."
 alicante_desc: "Lucentum, a small coastal town of Carthaginiensis under the rock of Benacantil, fading while nearby Ilici takes its trade. Salt, wine and fish sauce still leave its modest harbour, and the road along the coast carries them north towards Valentia and the Via Augusta."
 almaden_desc: "Sisapo, a mining town of the Oretani, whose cinnabar has given Rome its vermilion since the Republic. In Pliny's day the red ore went under seal to Rome to be refined, a monopoly of the state, from the same hills where Almaden's mines will be dug."
 almeria_desc: "No town stands here yet, and none will until the tenth century. The bay is the Portus Magnus of the Roman coast guides, a plain anchorage below the dry Sierra Alhamilla, while the nearest town of any size is Urci inland in Carthaginensis, near the silver and lead workings of the hills."
 amasya_desc: "Amaseia, metropolis of Helenopontus, set in a deep gorge of the Iris river. The rock-cut tombs of the kings of Pontus look down on the town where the geographer Strabo was born, now a Christian bishopric on the road to the eastern frontier."
 ancona_desc: "Ancona, a port of Picenum on the Adriatic, founded by Greek exiles from Syracuse who named it for the elbow of its headland. Trajan rebuilt its harbour and raised the marble arch that still stands on the mole, and ships leave it for Salona and the Dalmatian coast across the sea."
 anfa_desc: "No town stands on this stretch of Atlantic coast, far south of Mauretania Tingitana, whose last Roman post lay at Sala. The shore holds Mauri fishers and herders on the plains of the Chaouia, and the sea trade of the Mediterranean passes it by. Casablanca will grow from a Berber village much later."
 ankara_desc: "Ankyra, chief city of Galatia, founded by Celtic Galatians who crossed into Asia seven centuries ago. Its temple of Rome and Augustus bears the emperor's own account of his deeds carved in stone, and every road across the plateau meets beneath its citadel."
 antwerp_desc: "A Gallo-Roman riverside settlement on the Scheldt, on the northern edge of Belgica Secunda, whose wharves and potters serve the road to the Rhine. Salian Franks settled in nearby Toxandria with Julian's leave in 358, and the forts of the Saxon Shore stand not far to the west."
 aquila_desc: "Amiternum, an old Sabine town in the high Apennine valley of the Aterno and birthplace of the historian Sallust. No city stands where Aquila will rise; the uplands belong to Amiternum and the villages of the Vestini, shepherds who drive their flocks down to the Apulian plains each winter."
 asfi_desc: "No town stands at Safi, a rocky stretch of Atlantic coast far south of the Roman frontier of Mauretania Tingitana. Mauri herders and fishers live on the plains behind the cliffs, and the old dye works of Mogador, where Juba once made purple, lie a few days down the shore."
 asilah_desc: "Zilil, the Roman colony of Iulia Constantia Zilil, a small port on the Atlantic coast of Mauretania Tingitana a few days from Tingis. It is one of the few towns still held by the province, whose governor sits at Tingis under the Vicar of the Spains across the strait."
 athens_desc: "Athenai, a quiet provincial town living on its past. Young men still come from across the empire to its schools of rhetoric and philosophy, as Basil and Gregory of Nazianzus did, and pagan teachers still lecture beneath the Acropolis."
 augsburg_desc: "Augusta Vindelicum, capital of Raetia Secunda where the Wertach meets the Lech. It stands behind the Danube frontier facing the Alamanni, and the Via Claudia Augusta carries its trade and the emperor's orders over the Alps to Italy."
 avignon_desc: "Avennio, a modest city of the Cavares in Viennensis, built on a limestone rock above the Rhone where the road from Arelate crosses the river. Arles downstream is the great town of the region, and Avennio lives on the traffic of the valley and the wine and olives of its hills."
 avila_desc: "Abula, a small town of the Vettones on the high Castilian plateau. Its bishop Priscillian, an ascetic whose teaching spread widely, was beheaded at Trier in 385 on the orders of Magnus Maximus, the first Christian put to death for heresy by the state, and his followers bore his body home."
 aviles_desc: "No town stands on this estuary yet. The coast belongs to the Paesici, a people of the Astures beyond the mountains, fishermen and herders of green valleys, and the nearest Roman town is Gigia, a walled harbour on its headland to the east."
 axum_desc: "Aksum, capital of the Negus of the Aksumites, King of Kings, on the highlands of Abyssinia. Its kings minted gold coin and raised great stelae over their tombs, and a lifetime ago King Ezana turned Christian, taught by Frumentius, whom Athanasius made bishop. Ships from Adulis carry its ivory to Egypt and India."
 azemmour_desc: "No Roman town stands at the mouth of the Oum er-Rbia, on a stretch of Atlantic coast far south of Mauretania Tingitana. Mauri farmers and herders hold the plains of Doukkala, and in old times Punic traders called here for fish and hides. Azemmour is not yet a town."
 baden_desc: "Aquae, the spa of the Black Forest, whose hot springs served Roman soldiers and officials until Rome gave up the Agri Decumates around 260. The baths stand empty now, the Alamanni farm the valley, and the Rhine a few miles west is the frontier again."
 baghdad_desc: "No city stands here yet, only villages and canals among the date palms of the Tigris. A short way downstream lies Ctesiphon, winter capital of the Sasanian King of Kings, whose walls the emperor Julian reached in 363 before his fatal retreat."
 barcelona_desc: "Barcino, a small walled colony on the coast of the Laietani, founded under Augustus and ringed in the late third century with new walls and towers. Its bishop Pacian, dead a few years since, was praised by Jerome, and in 394 the rich senator Paulinus was ordained priest here before leaving for Nola."
 belgrad_desc: "Singidunum, fortress of the legion IV Flavia where the Sava meets the Danube. The legion guards the river against the peoples beyond it, and since the division of the Empire the far bank of the Sava belongs to the West."
 bergen_desc: "No town stands on this fjord yet. The harbour under the seven hills belongs to farming families of Norway's west coast, who live in long houses on the green slopes, fish and keep boats on the shore, and bury their dead in mounds. Bergen will not be founded until the eleventh century."
 bilbao_desc: "No town stands on the Nervion estuary yet. The land belongs to the Autrigones, whose Roman port is Flaviobriga on the coast to the west, founded by Vespasian, and the coastal hills hold the iron that Pliny called a whole mountain of metal."
 bologna_desc: "Bononia, a Roman colony on the Via Aemilia at the foot of the Apennines, once the Etruscan Felsina, and a busy stop on the road between Mediolanum and Ariminum. In 393 Ambrose came here with its bishop to raise the relics of the martyrs Vitalis and Agricola."
 braga_desc: "Bracara Augusta, capital of Gallaecia, a city founded by Augustus where five Roman roads of the northwest meet. Its milestones mark the road to Asturica, and the Priscillianist quarrel that followed Magnus Maximus's execution of the heretic in 385 still divides the bishops of the province."
 brescia_desc: "Brixia, a Roman colony at the foot of the Alps on the road from Mediolanum to Verona, with a Capitolium raised by Vespasian above its forum. Its bishop Gaudentius, consecrated by Ambrose, brought home relics of martyrs from his travels in the East for a new church."
 bruges_desc: "The marshy coast of the Menapii, where tidal creeks cut the mud flats between the sea and the Scheldt. Small settlements of fishers and salt makers live on the higher ground, and the fort at Oudenburg nearby guards the shore against Saxon and Frankish raiders."
 bukhara_desc: "A walled oasis town of the Sogdians on the Zarafshan, near the citadel mound where Bukhara will rise. Sogdian merchants carry silk and silver along the road to China, while the broken Kushan kingdom has left the region to local lords, the Sasanians hold the lands to the south, and nomad Chionites gather on the steppe."
 burgos_desc: "No town stands in the valley of the Arlanzon yet, and none will until the ninth century. The land belongs to the Autrigones and Turmogi, farmers and shepherds long under Roman rule, and the nearest towns are Segisamo and Virovesca on the road from Asturica to Burdigala."
 bursa_desc: "Prousa, a Bithynian town at the foot of Mount Olympus, founded by King Prusias and known for its hot springs. It was the home of the orator Dio Chrysostom, and the villas of Bithynian landowners fill the valley below the mountain."
 cadiz_desc: "Gades, the old Phoenician Gadir at the end of the world, a rich city of Baetica on an island off the Atlantic coast. Its famous salted fish and garum go out across the empire, the temple of Hercules still draws pilgrims on the sandbar to the south, and its merchants were once among the wealthiest in Spain."
 caerphilly_desc: "The hill valleys of the Silures north of Isca, where a Roman fort once kept the tribe in check. The Second Legion has left Isca for the Saxon Shore, and the fort at Cardiff now guards the coast below against Irish raiders crossing the Severn Sea."
 cairo_desc: "No city stands here yet. At the head of the Delta the Roman fortress of Babylon holds the legion XIII Gemina and guards the Nile crossing, while across the river the old pharaonic capital of Memphis fades beside the pyramids."
 candia_desc: "Herakleion, a small harbour town serving Knossos on the north coast of Crete. The island is governed from Gortyn in the south, and its farms send oil and wine across the sea lanes of the East."
 canterbury_desc: "Durovernum Cantiacorum, the walled town of the Cantiaci in Britannia Prima, where the Roman road from Dubris and Rutupiae meets Watling Street to Londinium. Its theatre has long gone out of use, and a stone wall with bastions guards the town against pirates from the Saxon Shore."
 cartagena_desc: "Carthago Nova, capital of the province of Carthaginiensis, a great port founded by Hasdrubal. Its silver mines are past their best, but the esparto grass of the surrounding plain still goes out in ships for cordage and mats, and its harbour is one of the best on the Spanish coast."
 ceuta_desc: "Septem, Ad Septem Fratres, a small port on the African shore of the strait beneath seven hills, held by the province of Mauretania Tingitana. Its fish-salting yards ship garum across the sea to Spain, and a small garrison watches the narrow crossing that links Africa to Hispania."
 coimbra_desc: "Aeminium, a small town of Lusitania on the Mondego on the road from Olisipo to Bracara. Nearby Conimbriga is the greater place, with its hurried walls and fine mosaics, and Aeminium lives in its shadow. Later its rival's name and bishopric will pass to the hill, and the town will be called Coimbra."
 cologne_desc: "Colonia Agrippina, capital of Germania Secunda and seat of a bishop since Maternus. Constantine's stone bridge crosses the Rhine to the fort of Divitia, and the city, sacked by the Franks in 355 and won back by Julian, keeps watch over the Frankish bank."
 constantinople_desc: "Konstantinoupolis, the New Rome that Constantine founded in 330 on the Bosphorus and now the capital of Arcadius. Theodosius has raised his forum and set an Egyptian obelisk in the Hippodrome, and the grain fleet from Alexandria feeds its people every summer."
 cordoba_desc: "Corduba, capital of Baetica on the river Baetis, city of the two Senecas and the poet Lucan. Its bishop Hosius counselled Constantine and presided at Nicaea, and the oil of the olive groves along the valley goes down the river in amphorae for Rome and the armies."
 corinth_desc: "Korinthos, capital of the province of Achaea, refounded by Julius Caesar as a Roman colony after its destruction in 146 BC. From its two harbours it commands the Isthmus, and its Christians still read the letters Paul wrote to them."
 damascus_desc: "Damaskos, an ancient oasis city fed by the Barada at the foot of the Anti-Lebanon. Its state factory forges shields and arms for the eastern army, and the great temple of Jupiter Damascenus is being turned into a church of John the Baptist."
 doncaster_desc: "Danum, a fort and small town where the road from Lindum to Eboracum crosses the Don. Its garrison of Crispiani answers to the Dux Britanniarum at Eboracum, one link in the chain of forts that holds the north of Britain."
 dublin_desc: "No town stands here yet. The mouth of the Liffey was known to Ptolemy as Eblana, and the Laigin, who hold Leinster, live in farmsteads and hillforts and raid Roman Britain. A black tidal pool and a ford of hurdles mark the place where Dublin will rise."
 dubno_desc: "Forest and river land of the Venedi in Volhynia, along the Ikva. The Gothic kingdom that once claimed tribute from the Venedi broke under the Huns in the 370s, and the villages of the valley now answer to their own elders."
 dubrovnik_desc: "Epidaurum, a small Roman town on the Dalmatian coast of the West. Jerome tells how the hermit Hilarion stood on its shore during the great wave of 365 and drove the sea back with the sign of the cross."
 dunstable_desc: "Durocobrivis, a small posting town where Watling Street meets the old Icknield Way below the chalk hills. Travellers on the road from Londinium to the northwest change horses here, beside the earthworks of a far older hill fort."
 durres_desc: "Dyrrachion, capital of Epirus Nova, founded by Corinthian and Corcyrean colonists. Its harbour faces Italy at the western end of the Via Egnatia, so officials and armies crossing between Rome and Constantinople land here, where Caesar and Pompey once fought."
 edinburgh_desc: "The rock of Din Eidyn rises over the Forth in the land of the Votadini, a people between the two Roman walls who keep their own kings. Once under Roman protection, they hold the hillfort on the crag and trade with Britain, while the abandoned Roman fort at Cramond lies on the coast nearby."
 edirne_desc: "Hadrianoupolis, founded by Hadrian on the Hebros and capital of Haemimontus. In 378 the Goths destroyed the army of Valens outside its walls and the emperor died in the rout; its arms factory now works to replace what was lost."
 erbach_desc: "The wooded hills of the Odenwald, where Rome's frontier once ran as a line of forts and watchtowers. Since the Agri Decumates were abandoned the posts have fallen to ruin in the forest, and the land belongs to the Alamanni."
 evora_desc: "Ebora Liberalitas Iulia, a town of Lusitania on a low hill in the wheat plains of the Alentejo. Its small granite temple, raised in the first century, still stands in the forum, and the road from Emerita to Olisipo carries grain, wool and olives out of the district."
 falun_desc: "No town stands in Dalarna. Dark forest and lakes cover the land north of the Svear, where charcoal burners and iron makers work bog ore, hunters and herders live scattered in clearings, and no one knows the great copper mountain where the mine of Falun will open."
 fez_desc: "No town stands here yet, and none will for four centuries. The fertile Saiss plain below the Middle Atlas belongs to Mauri farmers and herders, with Volubilis, the last Roman town of the south, a day's ride to the west. The city of Fez will be founded on the Wadi Fas in 789."
 florence_desc: "Florentia, a Roman colony on the Arno and seat of the governor of Tuscia and Umbria. In 393 Ambrose stayed here to avoid the usurper Eugenius, who held the court at Mediolanum, and consecrated a new basilica for the city before Theodosius crushed Eugenius at the Frigidus."
 gdansk_desc: "The mouth of the Vistula, which the Goths remember as Gothiscandza, the first landfall of their ancestors from Scandza. The Goths have long gone south; the Aesti gather amber on these shores, as Tacitus wrote, and trade it towards the Roman markets."
 genoa_desc: "Genua, a harbour town of the Ligurians on the narrow strip between the mountains and the sea, allied to Rome since the wars with Carthage. Mago the Carthaginian burned it in 205 BC and Rome rebuilt it; now it is a modest port on the coast road, with a bishop who sat at the council of Aquileia in 381."
 gibraltar_desc: "Mons Calpe, the northern pillar of Hercules, a limestone rock rising from the strait between Hispania and Africa. No town stands on it, though sailors steer by its summit, and the Roman port of Carteia lies across the bay, where fish and salt are loaded for the Mediterranean."
 girona_desc: "Gerunda, a small walled town of Tarraconensis on a hill above the Onyar, where the Via Augusta crosses on its way from the Pyrenees to Tarraco. Its walls and towers were raised in the late third century, and the town guards the gap through which armies have always come down from Gaul."
 glasgow_desc: "The lands of the Damnonii on the Clyde, far beyond Hadrian's Wall. The turf rampart of the Antonine Wall, abandoned two centuries ago, still scars the hills to the north, and the Damnonii trade or raid with Roman Britain as it suits them."
 granada_desc: "Iliberri, the old Iberian town below the Sierra Nevada, a city of Baetica on the hill that Granada will cover. Around the year 300 a council of bishops met here at Elvira, and its harsh canons are still read across Hispania, while the fertile Vega around it feeds the town."
 grenoble_desc: "Gratianopolis, the old Cularo renamed for the emperor Gratian, walled under Diocletian where the Drac meets the Isère. Its first known bishop, Domninus, sat at the council of Aquileia in 381, and its roads lead up into the Alpine passes."
 grojec_desc: "A level plain of sand, pine and oak west of the middle Vistula, with no town and no lord. Small villages of the Venedi farm the clearings and keep cattle, far from any Roman road."
 hamar_desc: "No town stands on Lake Mjosa yet. The shores of Hedmark are farmed by families whose chiefs raise burial mounds above their long houses and are buried with Roman bronze vessels and glass brought up from the south. Hamar will not be founded for nearly eight hundred years."
 hamburg_desc: "No town stands here yet. A sandy ridge above the Elbe marshes holds a few farms of the Saxons, who have spread across the lands between the Elbe and the Weser and raid the coast of Gaul and Britain. Hamburg will begin as a fort, the Hammaburg, many centuries from now."
 hanover_desc: "Wet meadows along the Leine in the old country of the Cherusci, whose chief Arminius destroyed Varus' legions in AD 9. The name of the Cherusci has faded; the lowland now belongs to the Saxons, whose ships raid the coasts of Gaul and Britain."
 heidelberg_desc: "Where the Neckar leaves the Odenwald for the Rhine plain, a Roman fort and bridge once stood; since the 260s the valley has been Alamannic. Downstream at Lopodunum, Valentinian built a fortified landing to keep a Roman foothold on the enemy's bank."
 herat_desc: "Aria, the green valley of the Hari Rud, an ancient Persian satrapy now held by the Sasanian King of Kings. Its fruit and wine are famed, its people are Zoroastrian and Christian, and the Chionite nomads beyond the eastern mountains and the fading Kushan lords are the dangers its governor watches."
 hormuz_desc: "No town of that name stands here yet. The Strait of Hormuz is where Sasanian Fars meets the sea, a hot coast of Persian pearl-divers and Arab merchants. Persian ships carry dates, pearls and goods between Mesopotamia and India, and the King of Kings keeps garrisons along the shore."
 ioannina_desc: "No town yet stands on the shore of the mountain lake of Pambotis. The land belongs to Epirus Vetus, governed from Nicopolis on the coast, and nearby the ancient oracle of Zeus at Dodona is falling silent under the Christian emperors."
 isfahan_desc: "Spahan, the Sasanian city called Gay or Gabae by the Greeks, in the province of the same name. Bahram IV, King of Kings, rules from Ctesiphon, and a Jewish community is said to live here since the Babylonian exile, in a green oasis on the Zayandeh river."
 izmit_desc: "Nikomedeia, metropolis of Bithynia, where Diocletian kept his court and began the Great Persecution in 303. Constantine died near it, baptised by its bishop Eusebius, and the city has risen again from the earthquake that levelled it in 358."
 jaca_desc: "Iacca, the town of the Iacetani in the foothills of the Pyrenees, where the road from Caesaraugusta climbs towards the Somport pass into Aquitaine. It guards the Aragon river valley, a hard country of mountain farmers and shepherds long under Roman rule."
 jerusalem_desc: "Aelia Capitolina, the Roman city built on the ruins of Jerusalem and now the goal of Christian pilgrims. Constantine's church of the Holy Sepulchre stands over Golgotha, Jerome writes in nearby Bethlehem, and the Jews may enter only to mourn the Temple once a year."
 jonkoping_desc: "No town stands at the southern end of Lake Vattern yet. The Gautar, the people known later as Geats, farm the surrounding hills, burying their chiefs in great mounds and trading southwards to the Baltic and the North Sea. Jonkoping will be founded in the middle ages."
 kalmar_desc: "No town stands on this coast yet. The Kalmar sound separates the Smaland shore from Oland, where the new ring fort of Eketorp shelters farmers behind a stone wall. Gold and Roman coin have reached the Gautar of the mainland, and Kalmar itself will be founded long after."
 kendal_desc: "Alone, a small auxiliary fort in a loop of the River Kent among the fells. Its roads link the garrisons of the Lune and of Windermere, part of the web of forts the Dux Britanniarum keeps behind the Wall."
 kinsale_desc: "A sheltered harbour of the Iverni on the south coast of Hibernia, beyond the Empire. Traders' ships reach it from Britain and Gaul, and Irish crews sail from coasts like this one to raid and settle in western Britain."
 kobenhavn_desc: "No town stands at the Sound yet. Zealand is rich in farms, and at Himlingoje to the south, a family of chiefs is buried with Roman gold and glass in the grandest graves of Denmark. A fishing beach on the strait will grow into the harbour of Copenhagen only in the middle ages."
 konya_desc: "Ikonion, capital of the young province of Lycaonia on the high plateau. Paul and Barnabas preached here and Thecla, the city's own saint, followed Paul from it; its bishop Amphilochius was a friend of Basil and Gregory."
 krakow_desc: "A limestone hill above the upper Vistula, with farmsteads of the Lugian peoples around it. The villages along the river are busy with potters who turn wheel-made ware in the Roman fashion, and Roman coins reach them by the roads from the Danube."
 kunow_desc: "Forested hills on the Kamienna at the edge of the Łysogóry, full of martens. Lugian smiths here have worked one of the great iron fields of the barbarian north, thousands of smelting pits heaped with slag, and nearby lie striped-flint mines dug long before any Roman."
 kyiv_desc: "No town stands on the high bank of the Dnieper yet. The Chernyakhov farmers of the Ukrainian steppe live in open villages, making wheel-turned pottery in the Roman fashion. The Gothic kingdom broke under the Huns in the 370s, and Hunnic horsemen now roam the grass beyond."
 larache_desc: "Lixus, a very old Phoenician town on the Loukkos, made a Roman colony by Claudius, in Mauretania Tingitana. Its fish-salting vats still send garum across the sea, though the town has shrunk, and the myth of Hercules and the garden of the Hesperides is told here."
 leipzig_desc: "Wet meadows where the White Elster meets the Pleisse, on the plain of the Hermunduri. The Thuringians, heirs of that people, now hold it, and their villages farm the rich black soil far from any Roman road."
 leksand_desc: "The southern shore of Lake Siljan in the forested Dales, far inland from the Svear coast. Farmers and hunters live by the lake, smelting bog iron and taking furs, which travel down the Dal river towards the richer lands by the sea."
 leon_desc: "Legio, the camp of Legio VII Gemina, the only legion left in all Hispania, on the road from Asturica to the Bay of Biscay. Its soldiers guard the gold mines and passes of the northwest, and its Christian bishop, Basilides, was already writing to Saint Cyprian a century and a half ago."
 linkoping_desc: "No town stands on the Stanga yet. The broad plain of Ostergotland is farmed by the Gautar, rich in graves and gold, in the country some will name as the home of the Ostrogoths, whose ancestors the Goths remember sailing south from Scandza. Linkoping will be founded only in the middle ages."
 lisbon_desc: "Olisipo, called Felicitas Julia, a town of Roman citizens on the great estuary of the Tagus. Ships from its harbour sail the Atlantic coast, and the salting works along the river fill amphorae with fish and fish sauce for the markets of the Empire."
 lodose_desc: "No town stands on the Gota river yet. The Gautar farm Vastergotland and the river, which flows from Lake Vanern to the Kattegat, carries their trade to the western sea. Burial mounds mark the farms of their chiefs, and Lodose will be founded as a river market in the middle ages."
 london_desc: "Londinium, now also called Augusta, capital of Maxima Caesariensis and seat of the vicarius of the Britains. Its bishop sat at the council of Arles in 314, and Count Theodosius, father of the late emperor, marched in to save it from the Great Conspiracy in 368."
 lubeck_desc: "No town stands on the Trave yet, and none will for seven centuries. Holstein is half empty, for the Saxons and Langobards of the old Elbe lands are moving south and west, and the hills and forests above the Baltic shore lie quiet. Lubeck will be founded only in the twelfth century."
 lublin_desc: "Low hills and loess fields on the Bystrzyca, east of the Vistula. Lugian and Venedi villages share this borderland, which Gothic migrants crossed long ago on their way south to the Black Sea."
 lucca_desc: "Luca, a Roman colony on the Serchio where Caesar, Pompey and Crassus met in 56 BC to renew their pact. Its streets still keep the straight grid of the colony, and its amphitheatre stands outside the walls among the farms of the plain."
 lund_desc: "No town stands here yet, but a few miles south lies Uppakra, a great chief's hall in the plain of Scania where Roman glass and bronze have been brought for generations. Lund will be founded about six centuries later, among farms of the people who will be called Danes."
 lyon_desc: "Lugdunum, capital of Lugdunensis Prima and the old centre of the Three Gauls, set on its hill where the Rhone meets the Saone. The Christians here suffered in 177, in the days of Blandina, and in 383 the emperor Gratian was murdered at Lugdunum by agents of Magnus Maximus."
 madrid_desc: "No town stands on the Manzanares yet, and none will for centuries. The Carpetani farm the dry plateau, a Roman villa stands at Carabanchel, and the real towns of the district are Complutum on the road to Caesaraugusta and Toletum to the south."
 malaga_desc: "Malaca, an old Phoenician harbour on the Baetic coast, a quiet port of Baetica. It exports wine, raisins and salted fish, and the bronze of its Flavian municipal charter, engraved three centuries ago, still sets out the rules of its council and elections."
 malmo_desc: "The flat, fertile coast of Scania on the Øresund, facing the Danish islands across the narrow strait. Nearby at Uppåkra stand the great hall and cult house of the region's chiefs, who bury their dead with Roman glass and silver brought over the sea."
 marbella_desc: "No town of note stands on this stretch of the Baetic coast between Malaca and Calpe. Roman villas, baths and fish-salting yards line the shore at Rio Verde, and the mountains of the Sierra Blanca rise behind, with the nearest real towns at Malaca and Barbesula."
 marrakesh_desc: "No town stands in the Haouz plain, and none will until 1070. Mauri herders and farmers hold the red plain below the High Atlas, and the Roman province of Mauretania Tingitana ends far to the north. The city will be founded by the Almoravids nearly seven centuries from now."
 mecca_desc: "Makkah, a dry valley in the Hejaz where the tribes gather around a sanctuary and a well, perhaps the Macoraba of Ptolemy. Caravans carrying incense from Himyar towards Syria pass through, and the tribes of the valley hold their markets here, while Rome and Persia compete for the desert."
 megara_desc: "Megara, a small town on the road between Athens and Corinth. Once a sea power, it sent out the colonists who founded Byzantion, the city that has become Constantinople, and it keeps little more than that memory."
 meknes_desc: "No town stands here yet. The olive hills of the Saiss plain lie a short ride east of Volubilis, the last Roman town of the south, whose officials left the district a century ago. The farmers and herders are Mauri, and Meknes will be founded by the Berber Miknasa much later."
 merida_desc: "Emerita Augusta, capital of Lusitania and one of the greatest cities of Spain, founded for veterans by Augustus. Its theatre, amphitheatre and circus still stand beside the long Roman bridge over the Guadiana, and the young martyr Eulalia, killed in 304, is honoured by the church here."
 messina_desc: "Messana, the old Greek Zancle, on its sickle-shaped harbour at the strait between Sicily and Italy. Rome's first war with Carthage began here in 264 BC; now the ferry crosses to Rhegium, and grain ships bound for Rome pass under its walls."
 mosul_desc: "No city stands on the west bank of the Tigris yet. Across the river lies the ruined Assyrian capital of Nineveh in the Persian province of Adiabene, with its Syriac-speaking Christians, and Nisibis, which Jovian surrendered to Persia in 363, is the frontier fortress to the northwest."
 murcia_desc: "No town stands on the Segura plain yet, and none will for four centuries. The river waters a marshy valley of orchards and a few Roman villas in Carthaginiensis, and the nearest city is Carthago Nova, a day's journey to the south, where the provincial governor sits."
 naples_desc: "Neapolis, a Greek city on its bay that long kept its Greek speech and games under Rome, a place of villas, baths and learning where the rich of Rome come to rest. Virgil lies buried outside its walls, and Christians gather at the tomb of the martyr Januarius in the hill above."
 nidaros_desc: "No town stands at the mouth of the Nid yet. The flat bend of the river at the head of the Trondheim fjord lies within Trondelag, a country of rich farms and hill graves whose chiefs trade furs south. Nidaros will not be founded until the year 997."
 nis_desc: "Naissus, birthplace of Constantine and a crossroads of the Balkan military road. Here Claudius Gothicus crushed the Goths in 269, and in the palace of Mediana outside the town Valentinian and Valens divided the armies of the Empire in 364."
 odense_desc: "No town stands on this stream yet. Funen is the centre of the Danish islands, and at Gudme, a few days' ride to the south, a hall of great chiefs stands near the trading beach of Lundeborg, where Roman gold and glass arrive. Odense will rise many centuries later."
 ohrid_desc: "Lychnidos, a town on the Via Egnatia beside its deep mountain lake. Soldiers, couriers and bishops on the road between Dyrrachion and Thessalonike stop here, and fishermen work the lake below the town."
 oslo_desc: "No town stands at the head of the Oslofjord yet. The fertile farms of Viken ring the water, with burial mounds on their ridges and Roman bronze in the graves of their chiefs, and they trade furs and iron down the coast. Oslo will be founded only in the eleventh century."
 osnabruck_desc: "Hills and heath on the Hase in the old land of the Angrivarii, now held by the Saxons. A short march north, at the foot of the Kalkriese hill, Arminius' warriors trapped and destroyed Varus' three legions in AD 9."
 paderborn_desc: "The springs of the Pader rise here in their hundreds, at the head of the Lippe valley below the wooded ridge. Down the river at Anreppen, Tiberius' legions camped in AD 4, before Varus' disaster ended Rome's hope of a province to the Elbe; now Frankish farmers hold the land."
 padova_desc: "Patavium, the city of Livy and of the Trojan Antenor's legend, once the richest town of Italy after Rome. Its weavers make woollen cloaks and rugs sold in the markets of Rome, and the rivers of the Venetian plain carry its goods to the lagoon and the sea."
 palermo_desc: "Panormus, the All-Harbour, a Phoenician town and Carthage's stronghold in Sicily until Rome took it in 254 BC. Now a Roman colony on the northern coast between its two headlands, it ships the grain and wine of the western plains of the island."
 palma_desc: "Palma, a Roman colony founded in 123 BC by Metellus on the south coast of Mallorca, capital of the province of the Balearic Islands since Diocletian. The island's famous slingers long ago joined Rome's armies, and it now sends wine, oil and salt to the mainland, with Pollentia, the other colony, on the north coast."
 pamplona_desc: "Pompaelo, a small town of the Vascones on the Arga, founded by Pompey in 74 BC. The Roman road from Asturica to Aquitaine passes through it, but the Vascones of the hills have never fully submitted to Roman customs, and their Basque tongue is still spoken in the valleys."
 paris_desc: "Lutetia of the Parisii, a walled island town in the Seine and seat of a bishop. Julian wintered here and was hailed Augustus by his troops in 360, and here in 383 Gratian's army deserted him for the usurper Magnus Maximus."
 parma_desc: "Parma, a Roman colony founded in 183 BC where the Via Aemilia crosses the river Parma, famed for the fine wool of its sheep. In 377 Gratian settled Taifali prisoners taken from the Gothic war on its farmland, to till the fields of the Po plain."
 penafiel_desc: "No castle crowns the hill above the middle Duero yet. This is the wheat country of the Vaccaei, who once shared out their fields and harvests in common, and the nearest town is Pintia, an old Vaccaean town now Roman, among villas spread along the river."
 perpignan_desc: "Ruscino, an old town on the Via Domitia by the river Tet in Narbonensis Prima, much shrunk since the high empire. Its market and mint have gone, and the plain of Roussillon around it is farmed from scattered villas. The village that will become Perpignan is not yet founded."
 perugia_desc: "Perusia, one of the old cities of Etruria on its hill above the Tiber, besieged and burned by Octavian in 41 BC and rebuilt as Augusta Perusia. That name is still carved on its great Etruscan gate, and the city now belongs to the province of Tuscia and Umbria."
 pisa_desc: "Pisae, a Roman colony near the mouth of the Arno among lagoons and river channels. Its harbour, Portus Pisanus, was Rome's base in the old wars against the Ligurians, and its ships still carry the timber, wine and goods of Tuscia along the coast."
 porto_desc: "Cale, a river town and landing place at the mouth of the Durius, where the road from Olisipo to Bracara Augusta crosses the river. The river here divides Lusitania from Gallaecia, and its boats bring the goods of the valleys inland down to the sea."
 prague_desc: "A rocky bend of the Vltava in Bohemia, the land named for the Celtic Boii, whose great hill fort still stands upstream at Závist. Since Maroboduus led them here the Marcomanni have held it, farming the river terraces and sending warriors to serve Rome."
 prizren_desc: "Theranda, a small town in the mountains of inland Dardania. It lies on the road that climbs from Lissus on the Adriatic to Naissus, among hill farmers and herdsmen of old Dardanian stock."
 rabat_desc: "Sala, the old Roman town of Chellah beside the Bou Regreg, the southernmost city of the Atlantic coast. The empire pulled back from the south of Mauretania Tingitana under Diocletian, so Sala now lives among Mauri neighbours, and Rabat will be founded many centuries later."
 radom_desc: "Rolling farmland on the Mleczna, north of the iron-working hills of the Łysogóry. The people are Lugians, whom Roman geographers split into tribes like the Burgiones; they trade iron and furs south towards the Danube and bury Roman coins with their dead."
 ravenna_desc: "Ravenna, a town among marshes and lagoons on the Adriatic, home of the fleet since Augustus built its harbour at Classis. Its causeways and canals make it almost impossible to besiege, a quality the western court at Mediolanum has not yet needed."
 ribe_desc: "No town stands on the Ribe river yet, and none will for three centuries. The marsh country of western Jutland is farmed by villages of the folk who will become the Danes, Angles and Jutes, some of whom are already crossing the North Sea to raid and settle in Britain."
 riga_desc: "No town stands on the Daugava yet. The river mouth is held by the Livs, a Finnic people, and the upper valley by Baltic tribes such as the Semigallians and Selonians, who farm, keep horses and trade amber. Riga will be founded by German merchants only in 1201."
 rodos_desc: "Rhodos, capital of the Province of the Islands, long past its glory. The Colossus has lain broken since the earthquake of 226 BC, but the sea law of the Rhodians still settles the disputes of merchants across the Mediterranean."
 roskilde_desc: "No town stands at the head of the fjord yet. The farms of Zealand are worked by families of the island folk who bury their chiefs with Roman goods and throw captured weapons into the bogs as offerings. The hall of Lejre and the town of Roskilde lie in the future."
 saint_marceilin_desc: "Farm country in the Isère valley between Gratianopolis and Valentia, in the land of the Allobroges, Roman since 121 BC. Their old capital Vienna, down the Rhône, saw the young emperor Valentinian II found hanged in his palace in 392."
 salamanca_desc: "Salmantica, a town of the Vettones on the Tormes, on the great Via de la Plata that runs from Emerita to Asturica. A long Roman bridge crosses the river, and the town serves as a staging post for the army and the governors of Lusitania travelling north."
 sale_desc: "No town stands on the north bank of the Bou Regreg yet. Marshes and dunes line the estuary opposite the Roman ruins of Sala, and Mauri fishers and herders live on the plains. The Empire's province of Mauretania Tingitana lies far to the north, beyond the Sebou."
 salerno_desc: "Salernum, a Roman colony founded in 194 BC on its gulf below the mountains, set there to watch the Picentes whom Rome had moved from the Adriatic. It is a harbour for the farms and villas of the plain, on the road south into Lucania."
 samarkand_desc: "Maracanda, chief city of Sogdiana, where Alexander wintered and killed his friend Cleitus in a drunken quarrel. Its merchants carry silver, silk and musk along the caravan roads as far as China, under Sogdian lords who answer to no empire."
 samarra_desc: "No city stands here yet, only a Persian canal country on the east bank of the Tigris. Here in 363 the emperor Julian died of a spear wound in the retreat from Ctesiphon, and the army chose Jovian, who bought peace and gave up Nisibis and the five provinces beyond the Tigris."
 san_sebastian_desc: "No town stands on this bay yet. The coast belongs to the Varduli and Vascones, hill farmers and fishers, and the nearest Roman port is Oiasso, where Irun will stand, at the end of the road from Asturica to Aquitaine. Donostia will be founded around Mount Urgull many centuries later."
 santiago_compostela_desc: "No town stands here yet, only a Roman burial ground and farmsteads on the road through Gallaecia. The nearest town is Iria Flavia on the coast, a road station on the way to Bracara, and the hills belong to farmers of the old Gallaeci, who live in round-house villages."
 segovia_desc: "Segovia, a town of Carthaginiensis on a rocky spur above two streams in the high plateau. Its great aqueduct of granite blocks, built about three centuries ago and held together without mortar, still carries water from the sierra to the town, which lies on the road from Emerita to Caesaraugusta."
 siena_desc: "Saena Julia, a small Roman colony on its hills in Tuscia, far from the great roads and lesser than its neighbours Clusium and Florentia. Tacitus remembers it only for a senator beaten by its townsmen, and it lives from the farms and woods of the hills around it."
 sijilmasa_desc: "No town stands in the Tafilalt yet. The oasis of the Ziz river is held by Gaetulian herders and date farmers, and camels are only beginning to be used on the desert tracks to the south. The trade in gold and salt that will make Sijilmasa lies far in the future."
 sitges_desc: "Subur, a small Roman town on the coast road between Barcino and Tarraco, in the country of the Laietani. The vineyards on its slopes fill amphorae of Laietanian wine, once shipped in bulk to Gaul and Rome."
 sivas_desc: "Sebasteia, metropolis of Armenia Prima on the upper Halys. Here the Forty Martyrs, soldiers of the legion XII Fulminata, were left to die on a frozen pond in 320, and Peter, brother of Basil the Great, is its bishop."
 skara_desc: "No town stands here yet. The fertile Falbygden plain of Vastergotland is the heart of the Gautar, whose farms cluster round old megalithic graves from before history. They trade amber and iron with the south, and their chiefs bury their dead with weapons and imported bronze."
 smyrna_desc: "Smyrne, one of the great ports of Asia, which claims to be Homer's birthplace. Marcus Aurelius rebuilt it after the earthquake of 178, and its church honours the bishop Polycarp, burned in its stadium."
 soderkoping_desc: "No town stands on the Stora stream yet. Where it falls to the Baltic, farms and fishing beaches of Ostergotland stand along the coast, and ships of the Gautar pull up on the shingle. Soderkoping will rise as a market town in the middle ages."
 srebrenica_desc: "Domavia, a silver mining town in the Dalmatian hills of the West. The procurator of the silver mines of Pannonia and Dalmatia has had his seat here since the early Empire, and the silver dug from its hills has long fed the imperial treasury."
 sredets_desc: "Serdica, capital of Dacia Mediterranea, below the Haemus mountains. Galerius issued his edict of toleration for the Christians here in 311, and the council of 343 met in the city; Constantine is said to have called it his Rome."
 stavanger_desc: "No town stands at the head of the fjord yet. The coast of Rogaland is a country of farmers, with the large settlement of Ullandhaug on a ridge overlooking the sea, of a type built from about 350. Some say the Rugii of Jordanes came from here, long before they travelled south."
 stockholm_desc: "Rocky islets and skerries where the bay of Mälaren opens to the Baltic; the land is still rising from the sea, and ships sail freely into the inner waters. The Svear, whom Tacitus called the Suiones, strong in ships, farm the shores and bury their chiefs in mounds."
 stockton_desc: "A low bank on the Tees near its mouth, in the country behind the Wall. The fort at Vinovia upstream and the signal towers built along the Yorkshire coast after 367 watch for Pictish and Saxon boats."
 syracuse_desc: "Syracusae, once the mightiest Greek city of the West, which broke the Athenian armada and held off Rome with the engines of Archimedes. Now a Roman colony and the seat of the governor of Sicily, it has a Christian community as old as Paul's landing here, and great catacombs outside its walls."
 tabriz_desc: "A small settlement of Atropatene, the Sasanian province of Adurbadagan, on a plain below Mount Sahand. The great fire temple of Adur Gushnasp stands at Ganzak to the south, and to the north lies Armenia, which Rome and Persia partitioned in 387, with the smaller share to Persia."
 tallinn_desc: "No town stands on this bay yet. The Estonians, a Finnic people the Romans called Aesti, farm and fish the coast, and bury their dead in stone cists. Roman coins reach the shore by the amber route, and the limestone hill of Tallinn is only a forested headland."
 tangier_desc: "Tingis, capital of Mauretania Tingitana and seat of its governor, on the African shore of the strait opposite Spain. Its harbour links the province to Hispania, from which it is administered, and in 298 the centurion Marcellus was beheaded here for casting off his soldier's belt in protest at the pagan feast."
 tarnovo_desc: "Hills above a bend of the Yantra, near Nicopolis ad Istrum, the city Trajan founded to mark his Dacian victory. Ulfilas brought his Christian Goths to settle this land in 348, and since the treaty of 382 the Goths hold it as allies of Rome."
 taroudant_desc: "No town stands in the Sous plain yet. Gaetulian and Mauri herders drive their flocks between the Atlas and Anti-Atlas, the argan groves cover the valley slopes, and the Roman province of Tingitana lies far to the north. Taroudant will not be founded for centuries."
 tarragona_desc: "Tarraco, capital of Hispania Tarraconensis since the days of Augustus and seat of the provincial governor and the imperial cult. Its vast circus, amphitheatre and aqueduct are the monuments of a rich city on the Via Augusta, where the bishop Fructuosus was burned in the arena in 259."
 taza_desc: "No town stands here yet. The Taza gap, a narrow pass between the Rif and the Middle Atlas, is the route that links Mauretania Tingitana to Caesariensis in the east, and Mauri tribes drive their flocks through it. Taza will rise as a fortress many centuries from now."
 tetouan_desc: "Tamuda, a former Roman camp and Mauretanian town on the Martil river, in Mauretania Tingitana. Its walls were built long ago to guard the road to the strait, but the fort is empty now and the Mauri tribes of the Rif graze their flocks at its gates."
 thessaloniki_desc: "Thessalonike, seat of the prefect of Illyricum and a great port on the Via Egnatia. Galerius built his palace and arch here, and here Theodosius was baptised in 380 and in 390 ordered the massacre in the Hippodrome that Ambrose made him repent."
 tinmel_desc: "No town stands in the valley of the Nfis yet. The High Atlas peaks hold snow into the summer, and Mauri shepherds and farmers live in terraced villages, outside the world of Rome. Tinmel will be a mountain sanctuary of a reforming Berber movement in the twelfth century."
 toledo_desc: "Toletum, once a small fortified city of the Carpetani on a rocky bend of the Tagus, with a Roman circus and a bridge. In five years its bishops will meet in council to condemn Priscillian's followers, but today it is a quiet inland city of Carthaginiensis."
 tonsberg_desc: "No town stands in Vestfold yet. The farms along the Oslofjord's western shore are the richest in the north, with burial mounds on the ridges and boat landings on the beaches, and their chiefs receive Roman goods. Tonsberg will be founded as a market in the ninth century."
 torgau_desc: "A ford on the middle Elbe, the Albis that Drusus reached in 9 BC and Rome never held. Thuringian villages line the river terraces between marsh and pine heath."
 toro_desc: "No town stands yet on the high bank of the Durius where Toro will rise. The plain is old Vaccaean wheat country, and the nearest town is Ocelodurum downriver, a station on the road from Emerita to Asturica."
 trebizond_desc: "Trapezous, a Greek colony of Sinope on the Black Sea coast, garrisoned by the legion I Pontica. Goths sacked it in 257, but its harbour still carries supplies to the Armenian frontier and trade from the Caucasus."
 turda_desc: "Potaissa, once the fortress of the legion V Macedonica in Roman Dacia, abandoned when Aurelian withdrew across the Danube. The Gepids now farm among its ruins, and the salt the Romans mined in its hills is still dug."
 uppsala_desc: "No town stands here yet, only farms and chiefs' mounds on the plain beside the sound that will become Lake Malaren. The Svear, whom Tacitus called the Suiones, live here, a people strong in ships, and the hall of their kings and the great mounds are still to come."
 valencia_desc: "Valentia Edetanorum, a Roman colony founded in 138 BC for veterans on an island in the Turia, destroyed by Pompey and rebuilt. The deacon Vincent was martyred here in 304, and the town, a modest port on the Via Augusta, ships wheat, wine and oil from the fertile huerta."
 valladolid_desc: "No town stands here by the Pisuerga yet. The valley was the wheat land of the Vaccaei and is now divided among Roman villas, and the nearest town is Septimanca, near where the Pisuerga meets the Duero."
 venice_desc: "Venetia is the name of a province, not yet of a city: the lagoon behind the Adriatic sand bars is salt marsh and fishermen's islands. Its people live by fish and salt, and send their boats through the channels to Altinum and Aquileia, the great cities of its shores."
 verona_desc: "Verona, a Roman city in a bend of the Adige where the road from the Alpine passes comes down into Italy. Its amphitheatre seats tens of thousands, its walls were raised in haste by Gallienus against the Alamanni, and Constantine took it by siege in 312 on his march to Rome."
 viborg_desc: "No town stands among the lakes of central Jutland yet. Farmers on the heath keep their villages in long houses, and in the bogs they sink the weapons of defeated armies as offerings, as at Illerup. Viborg will be a sacred assembly place of the Danes much later."
 vienna_desc: "Vindobona, fortress of the Tenth Legion Gemina on the Danube frontier of Pannonia. Marcus Aurelius fought the Marcomanni from here; now the legion watches the same river while the Goths, Huns and Alans that Gratian settled as federates roam the province behind it."
 visby_desc: "No town stands on the west coast of Gotland yet. The island belongs to the Gutes, rich farmers who bury hoards of Roman silver coins and trade amber across the Baltic. Their stone-walled farms cover the limestone ground, and Visby will rise as a harbour in the middle ages."
 volubilis_desc: "Volubilis, once the southern capital of Mauretania Tingitana, with its olive presses and arch of Caracalla, now left behind by the empire's retreat to the north under Diocletian. The town has no governor but its own council, and its Latin-speaking Mauri families still live in its houses."
 vyborg_desc: "No town stands on this bay at the head of the Gulf of Finland yet. Finnic hunters and fishers of the Karelian isthmus live scattered along the Vuoksi waterways, bury their dead under stone cairns, and trade furs. Vyborg will be founded as a Swedish castle in 1293."
 warsaw_desc: "A high bank on the west side of the middle Vistula, with forest behind and river meadows below. Villages of the Venedi farm the clearings, and the river is their road north to the amber coast."
 wieliczka_desc: "Hills south of the upper Vistula where salt springs seep from the ground. People here have boiled brine for salt since long before Rome; the thick rock salt that lies beneath their feet is still unknown to them."
 wurzburg_desc: "A bend of the Main below a hill that once held a Celtic fort, the Segodunum of the geographers. The Burgundians who hold it quarrel with the Alamanni over salt springs and boundary stones, and in 370 Valentinian called them to the Rhine against their rivals."
 york_desc: "Eboracum, headquarters of the Dux Britanniarum and a Roman fortress town on the Ouse, where the emperors Septimius Severus died and Constantine was hailed in 306. It is the capital of Britannia Secunda, and its bishop Eborius sat at the council of Arles in 314."
 zaragoza_desc: "Caesaraugusta, the colony Augustus founded on the Ebro on the road between Tarraco and Asturica. In 380 a council of Spanish bishops met here to condemn the ascetic Priscillian, and the eighteen martyrs of the persecution of 304 are honoured here by the city's Christians."
