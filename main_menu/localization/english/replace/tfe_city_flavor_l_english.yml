l_english:
 alexandria_desc: "Alexandreia, founded by Alexander, capital of Egypt and the second city of the East. Its grain fleet feeds Constantinople, and in 391 the bishop Theophilus led the crowds that tore down the great Serapeum, last shelter of the old gods and their books."
 almaden_desc: "Sisapo, a mining town of the Oretani, whose cinnabar has given Rome its vermilion since the Republic. In Pliny's day the red ore went under seal to Rome to be refined, a monopoly of the state, from the same hills where Almaden's mines will be dug."
 amasya_desc: "Amaseia, metropolis of Helenopontus, set in a deep gorge of the Iris river. The rock-cut tombs of the kings of Pontus look down on the town where the geographer Strabo was born, now a Christian bishopric on the road to the eastern frontier."
 ancona_desc: "Ancona, a port of Picenum on the Adriatic, founded by Greek exiles from Syracuse who named it for the elbow of its headland. Trajan rebuilt its harbour and raised the marble arch that still stands on the mole, and ships leave it for Salona and the Dalmatian coast across the sea."
 ankara_desc: "Ankyra, chief city of Galatia, founded by Celtic Galatians who crossed into Asia seven centuries ago. Its temple of Rome and Augustus bears the emperor's own account of his deeds carved in stone, and every road across the plateau meets beneath its citadel."
 aquila_desc: "Amiternum, an old Sabine town in the high Apennine valley of the Aterno and birthplace of the historian Sallust. No city stands where Aquila will rise; the uplands belong to Amiternum and the villages of the Vestini, shepherds who drive their flocks down to the Apulian plains each winter."
 athens_desc: "Athenai, a quiet provincial town living on its past. Young men still come from across the empire to its schools of rhetoric and philosophy, as Basil and Gregory of Nazianzus did, and pagan teachers still lecture beneath the Acropolis."
 augsburg_desc: "Augusta Vindelicum, capital of Raetia Secunda where the Wertach meets the Lech. It stands behind the Danube frontier facing the Alamanni, and the Via Claudia Augusta carries its trade and the emperor's orders over the Alps to Italy."
 aviles_desc: "No town stands on this estuary yet. The coast belongs to the Paesici, a people of the Astures beyond the mountains, fishermen and herders of green valleys, and the nearest Roman town is Gigia, a walled harbour on its headland to the east."
 baden_desc: "Aquae, the spa of the Black Forest, whose hot springs served Roman soldiers and officials until Rome gave up the Agri Decumates around 260. The baths stand empty now, the Alamanni farm the valley, and the Rhine a few miles west is the frontier again."
 baghdad_desc: "No city stands here yet, only villages and canals among the date palms of the Tigris. A short way downstream lies Ctesiphon, winter capital of the Sasanian King of Kings, whose walls the emperor Julian reached in 363 before his fatal retreat."
 barcelona_desc: "Barcino, a small walled colony on the coast of the Laietani, founded under Augustus and ringed in the late third century with new walls and towers. Its bishop Pacian, dead a few years since, was praised by Jerome, and in 394 the rich senator Paulinus was ordained priest here before leaving for Nola."
 belgrad_desc: "Singidunum, fortress of the legion IV Flavia where the Sava meets the Danube. The legion guards the river against the peoples beyond it, and since the division of the Empire the far bank of the Sava belongs to the West."
 bilbao_desc: "No town stands on the Nervion estuary yet. The land belongs to the Autrigones, whose Roman port is Flaviobriga on the coast to the west, founded by Vespasian, and the coastal hills hold the iron that Pliny called a whole mountain of metal."
 bologna_desc: "Bononia, a Roman colony on the Via Aemilia at the foot of the Apennines, once the Etruscan Felsina, and a busy stop on the road between Mediolanum and Ariminum. In 393 Ambrose came here with its bishop to raise the relics of the martyrs Vitalis and Agricola."
 brescia_desc: "Brixia, a Roman colony at the foot of the Alps on the road from Mediolanum to Verona, with a Capitolium raised by Vespasian above its forum. Its bishop Gaudentius, consecrated by Ambrose, brought home relics of martyrs from his travels in the East for a new church."
 bruges_desc: "The marshy coast of the Menapii, where tidal creeks cut the mud flats between the sea and the Scheldt. Small settlements of fishers and salt makers live on the higher ground, and the fort at Oudenburg nearby guards the shore against Saxon and Frankish raiders."
 bursa_desc: "Prousa, a Bithynian town at the foot of Mount Olympus, founded by King Prusias and known for its hot springs. It was the home of the orator Dio Chrysostom, and the villas of Bithynian landowners fill the valley below the mountain."
 caerphilly_desc: "The hill valleys of the Silures north of Isca, where a Roman fort once kept the tribe in check. The Second Legion has left Isca for the Saxon Shore, and the fort at Cardiff now guards the coast below against Irish raiders crossing the Severn Sea."
 cairo_desc: "No city stands here yet. At the head of the Delta the Roman fortress of Babylon holds the legion XIII Gemina and guards the Nile crossing, while across the river the old pharaonic capital of Memphis fades beside the pyramids."
 candia_desc: "Herakleion, a small harbour town serving Knossos on the north coast of Crete. The island is governed from Gortyn in the south, and its farms send oil and wine across the sea lanes of the East."
 cologne_desc: "Colonia Agrippina, capital of Germania Secunda and seat of a bishop since Maternus. Constantine's stone bridge crosses the Rhine to the fort of Divitia, and the city, sacked by the Franks in 355 and won back by Julian, keeps watch over the Frankish bank."
 constantinople_desc: "Konstantinoupolis, the New Rome that Constantine founded in 330 on the Bosphorus and now the capital of Arcadius. Theodosius has raised his forum and set an Egyptian obelisk in the Hippodrome, and the grain fleet from Alexandria feeds its people every summer."
 cordoba_desc: "Corduba, capital of Baetica on the river Baetis, city of the two Senecas and the poet Lucan. Its bishop Hosius counselled Constantine and presided at Nicaea, and the oil of the olive groves along the valley goes down the river in amphorae for Rome and the armies."
 corinth_desc: "Korinthos, capital of the province of Achaea, refounded by Julius Caesar as a Roman colony after its destruction in 146 BC. From its two harbours it commands the Isthmus, and its Christians still read the letters Paul wrote to them."
 damascus_desc: "Damaskos, an ancient oasis city fed by the Barada at the foot of the Anti-Lebanon. Its state factory forges shields and arms for the eastern army, and the great temple of Jupiter Damascenus is being turned into a church of John the Baptist."
 doncaster_desc: "Danum, a fort and small town where the road from Lindum to Eboracum crosses the Don. Its garrison of Crispiani answers to the Dux Britanniarum at Eboracum, one link in the chain of forts that holds the north of Britain."
 dubno_desc: "Forest and river land of the Venedi in Volhynia, along the Ikva. The Gothic kingdom that once claimed tribute from the Venedi broke under the Huns in the 370s, and the villages of the valley now answer to their own elders."
 dubrovnik_desc: "Epidaurum, a small Roman town on the Dalmatian coast of the West. Jerome tells how the hermit Hilarion stood on its shore during the great wave of 365 and drove the sea back with the sign of the cross."
 dunstable_desc: "Durocobrivis, a small posting town where Watling Street meets the old Icknield Way below the chalk hills. Travellers on the road from Londinium to the northwest change horses here, beside the earthworks of a far older hill fort."
 durres_desc: "Dyrrachion, capital of Epirus Nova, founded by Corinthian and Corcyrean colonists. Its harbour faces Italy at the western end of the Via Egnatia, so officials and armies crossing between Rome and Constantinople land here, where Caesar and Pompey once fought."
 edirne_desc: "Hadrianoupolis, founded by Hadrian on the Hebros and capital of Haemimontus. In 378 the Goths destroyed the army of Valens outside its walls and the emperor died in the rout; its arms factory now works to replace what was lost."
 erbach_desc: "The wooded hills of the Odenwald, where Rome's frontier once ran as a line of forts and watchtowers. Since the Agri Decumates were abandoned the posts have fallen to ruin in the forest, and the land belongs to the Alamanni."
 florence_desc: "Florentia, a Roman colony on the Arno and seat of the governor of Tuscia and Umbria. In 393 Ambrose stayed here to avoid the usurper Eugenius, who held the court at Mediolanum, and consecrated a new basilica for the city before Theodosius crushed Eugenius at the Frigidus."
 gdansk_desc: "The mouth of the Vistula, which the Goths remember as Gothiscandza, the first landfall of their ancestors from Scandza. The Goths have long gone south; the Aesti gather amber on these shores, as Tacitus wrote, and trade it towards the Roman markets."
 genoa_desc: "Genua, a harbour town of the Ligurians on the narrow strip between the mountains and the sea, allied to Rome since the wars with Carthage. Mago the Carthaginian burned it in 205 BC and Rome rebuilt it; now it is a modest port on the coast road, with a bishop who sat at the council of Aquileia in 381."
 glasgow_desc: "The lands of the Damnonii on the Clyde, far beyond Hadrian's Wall. The turf rampart of the Antonine Wall, abandoned two centuries ago, still scars the hills to the north, and the Damnonii trade or raid with Roman Britain as it suits them."
 grenoble_desc: "Gratianopolis, the old Cularo renamed for the emperor Gratian, walled under Diocletian where the Drac meets the Isère. Its first known bishop, Domninus, sat at the council of Aquileia in 381, and its roads lead up into the Alpine passes."
 grojec_desc: "A level plain of sand, pine and oak west of the middle Vistula, with no town and no lord. Small villages of the Venedi farm the clearings and keep cattle, far from any Roman road."
 hanover_desc: "Wet meadows along the Leine in the old country of the Cherusci, whose chief Arminius destroyed Varus' legions in AD 9. The name of the Cherusci has faded; the lowland now belongs to the Saxons, whose ships raid the coasts of Gaul and Britain."
 heidelberg_desc: "Where the Neckar leaves the Odenwald for the Rhine plain, a Roman fort and bridge once stood; since the 260s the valley has been Alamannic. Downstream at Lopodunum, Valentinian built a fortified landing to keep a Roman foothold on the enemy's bank."
 ioannina_desc: "No town yet stands on the shore of the mountain lake of Pambotis. The land belongs to Epirus Vetus, governed from Nicopolis on the coast, and nearby the ancient oracle of Zeus at Dodona is falling silent under the Christian emperors."
 izmit_desc: "Nikomedeia, metropolis of Bithynia, where Diocletian kept his court and began the Great Persecution in 303. Constantine died near it, baptised by its bishop Eusebius, and the city has risen again from the earthquake that levelled it in 358."
 jerusalem_desc: "Aelia Capitolina, the Roman city built on the ruins of Jerusalem and now the goal of Christian pilgrims. Constantine's church of the Holy Sepulchre stands over Golgotha, Jerome writes in nearby Bethlehem, and the Jews may enter only to mourn the Temple once a year."
 kendal_desc: "Alone, a small auxiliary fort in a loop of the River Kent among the fells. Its roads link the garrisons of the Lune and of Windermere, part of the web of forts the Dux Britanniarum keeps behind the Wall."
 kinsale_desc: "A sheltered harbour of the Iverni on the south coast of Hibernia, beyond the Empire. Traders' ships reach it from Britain and Gaul, and Irish crews sail from coasts like this one to raid and settle in western Britain."
 konya_desc: "Ikonion, capital of the young province of Lycaonia on the high plateau. Paul and Barnabas preached here and Thecla, the city's own saint, followed Paul from it; its bishop Amphilochius was a friend of Basil and Gregory."
 krakow_desc: "A limestone hill above the upper Vistula, with farmsteads of the Lugian peoples around it. The villages along the river are busy with potters who turn wheel-made ware in the Roman fashion, and Roman coins reach them by the roads from the Danube."
 kunow_desc: "Forested hills on the Kamienna at the edge of the Łysogóry, full of martens. Lugian smiths here have worked one of the great iron fields of the barbarian north, thousands of smelting pits heaped with slag, and nearby lie striped-flint mines dug long before any Roman."
 leipzig_desc: "Wet meadows where the White Elster meets the Pleisse, on the plain of the Hermunduri. The Thuringians, heirs of that people, now hold it, and their villages farm the rich black soil far from any Roman road."
 leksand_desc: "The southern shore of Lake Siljan in the forested Dales, far inland from the Svear coast. Farmers and hunters live by the lake, smelting bog iron and taking furs, which travel down the Dal river towards the richer lands by the sea."
 lisbon_desc: "Olisipo, called Felicitas Julia, a town of Roman citizens on the great estuary of the Tagus. Ships from its harbour sail the Atlantic coast, and the salting works along the river fill amphorae with fish and fish sauce for the markets of the Empire."
 london_desc: "Londinium, now also called Augusta, capital of Maxima Caesariensis and seat of the vicarius of the Britains. Its bishop sat at the council of Arles in 314, and Count Theodosius, father of the late emperor, marched in to save it from the Great Conspiracy in 368."
 lublin_desc: "Low hills and loess fields on the Bystrzyca, east of the Vistula. Lugian and Venedi villages share this borderland, which Gothic migrants crossed long ago on their way south to the Black Sea."
 lucca_desc: "Luca, a Roman colony on the Serchio where Caesar, Pompey and Crassus met in 56 BC to renew their pact. Its streets still keep the straight grid of the colony, and its amphitheatre stands outside the walls among the farms of the plain."
 malmo_desc: "The flat, fertile coast of Scania on the Øresund, facing the Danish islands across the narrow strait. Nearby at Uppåkra stand the great hall and cult house of the region's chiefs, who bury their dead with Roman glass and silver brought over the sea."
 megara_desc: "Megara, a small town on the road between Athens and Corinth. Once a sea power, it sent out the colonists who founded Byzantion, the city that has become Constantinople, and it keeps little more than that memory."
 messina_desc: "Messana, the old Greek Zancle, on its sickle-shaped harbour at the strait between Sicily and Italy. Rome's first war with Carthage began here in 264 BC; now the ferry crosses to Rhegium, and grain ships bound for Rome pass under its walls."
 naples_desc: "Neapolis, a Greek city on its bay that long kept its Greek speech and games under Rome, a place of villas, baths and learning where the rich of Rome come to rest. Virgil lies buried outside its walls, and Christians gather at the tomb of the martyr Januarius in the hill above."
 nis_desc: "Naissus, birthplace of Constantine and a crossroads of the Balkan military road. Here Claudius Gothicus crushed the Goths in 269, and in the palace of Mediana outside the town Valentinian and Valens divided the armies of the Empire in 364."
 ohrid_desc: "Lychnidos, a town on the Via Egnatia beside its deep mountain lake. Soldiers, couriers and bishops on the road between Dyrrachion and Thessalonike stop here, and fishermen work the lake below the town."
 osnabruck_desc: "Hills and heath on the Hase in the old land of the Angrivarii, now held by the Saxons. A short march north, at the foot of the Kalkriese hill, Arminius' warriors trapped and destroyed Varus' three legions in AD 9."
 paderborn_desc: "The springs of the Pader rise here in their hundreds, at the head of the Lippe valley below the wooded ridge. Down the river at Anreppen, Tiberius' legions camped in AD 4, before Varus' disaster ended Rome's hope of a province to the Elbe; now Frankish farmers hold the land."
 padova_desc: "Patavium, the city of Livy and of the Trojan Antenor's legend, once the richest town of Italy after Rome. Its weavers make woollen cloaks and rugs sold in the markets of Rome, and the rivers of the Venetian plain carry its goods to the lagoon and the sea."
 palermo_desc: "Panormus, the All-Harbour, a Phoenician town and Carthage's stronghold in Sicily until Rome took it in 254 BC. Now a Roman colony on the northern coast between its two headlands, it ships the grain and wine of the western plains of the island."
 paris_desc: "Lutetia of the Parisii, a walled island town in the Seine and seat of a bishop. Julian wintered here and was hailed Augustus by his troops in 360, and here in 383 Gratian's army deserted him for the usurper Magnus Maximus."
 parma_desc: "Parma, a Roman colony founded in 183 BC where the Via Aemilia crosses the river Parma, famed for the fine wool of its sheep. In 377 Gratian settled Taifali prisoners taken from the Gothic war on its farmland, to till the fields of the Po plain."
 penafiel_desc: "No castle crowns the hill above the middle Duero yet. This is the wheat country of the Vaccaei, who once shared out their fields and harvests in common, and the nearest town is Pintia, an old Vaccaean town now Roman, among villas spread along the river."
 perugia_desc: "Perusia, one of the old cities of Etruria on its hill above the Tiber, besieged and burned by Octavian in 41 BC and rebuilt as Augusta Perusia. That name is still carved on its great Etruscan gate, and the city now belongs to the province of Tuscia and Umbria."
 pisa_desc: "Pisae, a Roman colony near the mouth of the Arno among lagoons and river channels. Its harbour, Portus Pisanus, was Rome's base in the old wars against the Ligurians, and its ships still carry the timber, wine and goods of Tuscia along the coast."
 porto_desc: "Cale, a river town and landing place at the mouth of the Durius, where the road from Olisipo to Bracara Augusta crosses the river. The river here divides Lusitania from Gallaecia, and its boats bring the goods of the valleys inland down to the sea."
 prague_desc: "A rocky bend of the Vltava in Bohemia, the land named for the Celtic Boii, whose great hill fort still stands upstream at Závist. Since Maroboduus led them here the Marcomanni have held it, farming the river terraces and sending warriors to serve Rome."
 prizren_desc: "Theranda, a small town in the mountains of inland Dardania. It lies on the road that climbs from Lissus on the Adriatic to Naissus, among hill farmers and herdsmen of old Dardanian stock."
 radom_desc: "Rolling farmland on the Mleczna, north of the iron-working hills of the Łysogóry. The people are Lugians, whom Roman geographers split into tribes like the Burgiones; they trade iron and furs south towards the Danube and bury Roman coins with their dead."
 ravenna_desc: "Ravenna, a town among marshes and lagoons on the Adriatic, home of the fleet since Augustus built its harbour at Classis. Its causeways and canals make it almost impossible to besiege, a quality the western court at Mediolanum has not yet needed."
 rodos_desc: "Rhodos, capital of the Province of the Islands, long past its glory. The Colossus has lain broken since the earthquake of 226 BC, but the sea law of the Rhodians still settles the disputes of merchants across the Mediterranean."
 saint_marceilin_desc: "Farm country in the Isère valley between Gratianopolis and Valentia, in the land of the Allobroges, Roman since 121 BC. Their old capital Vienna, down the Rhône, saw the young emperor Valentinian II found hanged in his palace in 392."
 salerno_desc: "Salernum, a Roman colony founded in 194 BC on its gulf below the mountains, set there to watch the Picentes whom Rome had moved from the Adriatic. It is a harbour for the farms and villas of the plain, on the road south into Lucania."
 samarkand_desc: "Maracanda, chief city of Sogdiana, where Alexander wintered and killed his friend Cleitus in a drunken quarrel. Its merchants carry silver, silk and musk along the caravan roads as far as China, under Sogdian lords who answer to no empire."
 siena_desc: "Saena Julia, a small Roman colony on its hills in Tuscia, far from the great roads and lesser than its neighbours Clusium and Florentia. Tacitus remembers it only for a senator beaten by its townsmen, and it lives from the farms and woods of the hills around it."
 sitges_desc: "Subur, a small Roman town on the coast road between Barcino and Tarraco, in the country of the Laietani. The vineyards on its slopes fill amphorae of Laietanian wine, once shipped in bulk to Gaul and Rome."
 sivas_desc: "Sebasteia, metropolis of Armenia Prima on the upper Halys. Here the Forty Martyrs, soldiers of the legion XII Fulminata, were left to die on a frozen pond in 320, and Peter, brother of Basil the Great, is its bishop."
 smyrna_desc: "Smyrne, one of the great ports of Asia, which claims to be Homer's birthplace. Marcus Aurelius rebuilt it after the earthquake of 178, and its church honours the bishop Polycarp, burned in its stadium."
 srebrenica_desc: "Domavia, a silver mining town in the Dalmatian hills of the West. The procurator of the silver mines of Pannonia and Dalmatia has had his seat here since the early Empire, and the silver dug from its hills has long fed the imperial treasury."
 sredets_desc: "Serdica, capital of Dacia Mediterranea, below the Haemus mountains. Galerius issued his edict of toleration for the Christians here in 311, and the council of 343 met in the city; Constantine is said to have called it his Rome."
 stockholm_desc: "Rocky islets and skerries where the bay of Mälaren opens to the Baltic; the land is still rising from the sea, and ships sail freely into the inner waters. The Svear, whom Tacitus called the Suiones, strong in ships, farm the shores and bury their chiefs in mounds."
 stockton_desc: "A low bank on the Tees near its mouth, in the country behind the Wall. The fort at Vinovia upstream and the signal towers built along the Yorkshire coast after 367 watch for Pictish and Saxon boats."
 syracuse_desc: "Syracusae, once the mightiest Greek city of the West, which broke the Athenian armada and held off Rome with the engines of Archimedes. Now a Roman colony and the seat of the governor of Sicily, it has a Christian community as old as Paul's landing here, and great catacombs outside its walls."
 tarnovo_desc: "Hills above a bend of the Yantra, near Nicopolis ad Istrum, the city Trajan founded to mark his Dacian victory. Ulfilas brought his Christian Goths to settle this land in 348, and since the treaty of 382 the Goths hold it as allies of Rome."
 thessaloniki_desc: "Thessalonike, seat of the prefect of Illyricum and a great port on the Via Egnatia. Galerius built his palace and arch here, and here Theodosius was baptised in 380 and in 390 ordered the massacre in the Hippodrome that Ambrose made him repent."
 torgau_desc: "A ford on the middle Elbe, the Albis that Drusus reached in 9 BC and Rome never held. Thuringian villages line the river terraces between marsh and pine heath."
 toro_desc: "No town stands yet on the high bank of the Durius where Toro will rise. The plain is old Vaccaean wheat country, and the nearest town is Ocelodurum downriver, a station on the road from Emerita to Asturica."
 trebizond_desc: "Trapezous, a Greek colony of Sinope on the Black Sea coast, garrisoned by the legion I Pontica. Goths sacked it in 257, but its harbour still carries supplies to the Armenian frontier and trade from the Caucasus."
 turda_desc: "Potaissa, once the fortress of the legion V Macedonica in Roman Dacia, abandoned when Aurelian withdrew across the Danube. The Gepids now farm among its ruins, and the salt the Romans mined in its hills is still dug."
 valladolid_desc: "No town stands here by the Pisuerga yet. The valley was the wheat land of the Vaccaei and is now divided among Roman villas, and the nearest town is Septimanca, near where the Pisuerga meets the Duero."
 venice_desc: "Venetia is the name of a province, not yet of a city: the lagoon behind the Adriatic sand bars is salt marsh and fishermen's islands. Its people live by fish and salt, and send their boats through the channels to Altinum and Aquileia, the great cities of its shores."
 verona_desc: "Verona, a Roman city in a bend of the Adige where the road from the Alpine passes comes down into Italy. Its amphitheatre seats tens of thousands, its walls were raised in haste by Gallienus against the Alamanni, and Constantine took it by siege in 312 on his march to Rome."
 vienna_desc: "Vindobona, fortress of the Tenth Legion Gemina on the Danube frontier of Pannonia. Marcus Aurelius fought the Marcomanni from here; now the legion watches the same river while the Goths, Huns and Alans that Gratian settled as federates roam the province behind it."
 warsaw_desc: "A high bank on the west side of the middle Vistula, with forest behind and river meadows below. Villages of the Venedi farm the clearings, and the river is their road north to the amber coast."
 wieliczka_desc: "Hills south of the upper Vistula where salt springs seep from the ground. People here have boiled brine for salt since long before Rome; the thick rock salt that lies beneath their feet is still unknown to them."
 wurzburg_desc: "A bend of the Main below a hill that once held a Celtic fort, the Segodunum of the geographers. The Burgundians who hold it quarrel with the Alamanni over salt springs and boundary stones, and in 370 Valentinian called them to the Rhine against their rivals."
