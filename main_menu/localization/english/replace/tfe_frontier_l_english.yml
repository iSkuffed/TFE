l_english:
 COLONIAL_CHARTER: "$ADJ$ Settlement of [PROVINCE_DEFINITION.GetNameWithNoTooltip]"
 START_COLONY_TT: "Creating a Frontier Charter for [PROVINCE_DEFINITION.GetName|Y] will cost us $COST$ upfront. This will attract [pops|e] to the [locations|E] in [PROVINCE_DEFINITION.GetName] over time, and eventually give us ownership of all the territory."
 ABANDON_COLONY_TT: "Abandoning the Frontier Charter for [COLONIAL_CHARTER.GetName|Y] will cost us $COST$ upfront. The [pops|e] that have migrated into [locations|E] we do not own will be abandoned by us."
 START_COLONY_TT_NO_COST: "Creating a Frontier Charter will attract [pops|e] to the [locations|E] in [PROVINCE_DEFINITION.GetName] over time, and eventually give us ownership of all the territory."
 ABANDON_COLONY_TT_NO_COST: "Abandoning the Frontier Charter will stop the migration of pops. The [pops|e] that have migrated into [locations|E] we do not own will be abandoned by us."
 ABANDON_BUTTON: "Abandon Frontier Charter"
 NO_COLONIAL_CHARTER_RELIGION: "Due to $NAME|Y$ only [COUNTRY.GetName] is allowed to settle it, and all other [COUNTRY.GetReligion.GetAdjective] countries are blocked from it."
 COLONIAL_PROGRESS_POT_HEADER: "Settlement Progress"
 COLONIAL_CHARTER_CURRENT: "$VAL|Y$ [pops|e] will move from [LOCATION.GetName] to settle [TARGET_LOCATION.GetName] each month."
 COLONIAL_CHARTER_CURRENT_WITH_CABINET_ENTRY: "$BULLET_WITH_TAB$$VAL|Y$ [pops|e] will move from [LOCATION.GetName] to settle [TARGET_LOCATION.GetName]."
 COLONIAL_CHARTER_COUNT: "Currently, there are $OWN|Y$ [locations|E] that have been settled by [COUNTRY.GetName], with another $POSSIBLE|Y$ still possible."
 COLONIAL_TARGET_NO_COLONIAL_BUILDINGS_KNOWN: "No possible [buildings|e] to settle with!"
 COLONIZE_ACTION_BUTTON: "Start Settling"
 COLONIZE_BUTTON: "Settle"
 COLONIAL_FLIP_HEADER: "Settlement Progress for [LOCATION.GetNameWithNoTooltip]"
 COLONIAL_PROGRESS_HEADER: "Settlement Progress"
 colonial_charter.3.desc: "One of our settlements, [target.GetName], has received a surge of immigrants seeking their fortune in our settlements. It will soon become a self-supporting city providing much wealth to our realm."
 colonial_charter.4.title: "Frontier Disaster"
 colonial_charter.4.desc: "A disaster has struck one of our settlements. Many settlers have died and yet more have returned home. This is a disaster and we may even lose our settlement."
 colonial_charter.4.b: "Spare no effort in aiding the settlement."
 colonial_charter.5.desc: "Our Settlers have managed to reach out to the Natives and arrive at an understanding with them. This agreement has allowed [SCOPE.sColonialCharter('target').GetName] greater scope for growth without the natives getting upset."
 colonial_charter.6.desc: "A pioneer settlement is very much a man's place, but, as a settlement develops, we seek to grow less by emigration and more by the births of children. The frontier company responsible for [SCOPE.sColonialCharter('target').GetName] has arranged for a number of marriageable women, mostly widows, to travel to the settlement to ensure that families are started."
 colonial_charter.7.desc: "The matter of the native population is of key concern to us. We must ensure that natives under our care are protected from hostile neighbors, become properly civilized, and practice the true faith. Our plan is to charge our settlers with this duty, wherein each settler will be given a number of natives to tutor and protect. This is obviously not something that people will do for free, so the natives will provide a number of days of labor to our settlers in return."
 colonial_charter.9.title: "Settlement in Trouble!"
 colonial_charter.9.desc: "Our frontier efforts are spread thin. One of our settlements has run into trouble, as food has become difficult to find. Many have died and yet more have left the settlement and returned home."
 colonial_charter.10.desc: "[SCOPE.sColonialCharter('target').GetName] has suffered a run of poor harvests, leading to food shortages. The settlement is looking less attractive to new immigrants while others are leaving to return home. This is harming the settlement's prospects."
 COLONIAL_CHARTER_COMPLETED: "The frontier settlement of $PROVINCE$ is complete. $GOAL$."
 CHARTER_GOAL_FORM_NATION_LABEL: "Form Frontier Nation"
 CHARTER_GOAL_FORM_NATION_NAME: "Form Frontier Nation"
