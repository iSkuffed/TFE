 colonial_charter.200.title: "The Failed Settlement of [target.GetNameWithNoTooltip]"
 colonial_charter.200.desc: "The charter we founded to settle [target.GetNameWithNoTooltip] has completely failed; the [attacker.GetLongName] has been more successful and beaten back all of our attempts!"
