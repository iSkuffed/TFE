l_english:
 STATIC_MODIFIER_NAME_almaden_base: "Cinnabar of Sisapo"
 STATIC_MODIFIER_DESC_almaden_base: "The cinnabar mines of Sisapo give the Empire its mercury and vermilion. Pliny says the state guards them closely."
 STATIC_MODIFIER_NAME_srebrenica_silver_mines_base: "Silver of Domavia"
 STATIC_MODIFIER_DESC_srebrenica_silver_mines_base: "The silver and lead mines of Domavia, run by an imperial procurator of the Pannonian and Dalmatian mines."
 STATIC_MODIFIER_NAME_turda_salt_mines_base: "Salt of Potaissa"
 STATIC_MODIFIER_DESC_turda_salt_mines_base: "The rock salt of Potaissa, worked since the legion held Dacia."
 STATIC_MODIFIER_NAME_damascus_base: "Arms Factory of Damascus"
 STATIC_MODIFIER_DESC_damascus_base: "A state fabrica of the Notitia Dignitatum makes shields and arms for the army of the East."
 STATIC_MODIFIER_NAME_bilbao_iron_base: "Cantabrian Iron"
 STATIC_MODIFIER_DESC_bilbao_iron_base: "Pliny's mountain of iron on the Cantabrian coast."
