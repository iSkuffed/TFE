 sevilla_desc: "Baetica's olive oil fills the amphorae of the annona. Their broken sherds have piled up a hill by the Tiber in Rome, Monte Testaccio."
 sidon_desc: "The murex shells of the Phoenician shore give the purple that only the emperor may wear whole. The dye works of Sidon and Tyre stink of rotting shellfish and are worth a fortune."
