 ferrara_desc: "The marshes of the lower Po, thinly farmed. What grain they grow is gathered for the annona."
 friesach_desc: "Noricum's iron from the Hüttenberg makes the hardest blades the legions know. The Romans call it ferrum Noricum, and an imperial arms factory works it at Lauriacum."
 gabes_desc: "The wheat fields of the Bagradas valley and Byzacena are among the richest in the Mediterranean. Their grain is paid as tax and shipped from Carthage to feed Rome."
 gaeta_desc: "The Falernian slopes above the Campanian shore grow the most famous wine in Italy, which the poets praised and the rich still lay down for decades."
 gaza_desc: "Gaza's white wine travels in its own tall jars to Gaul, Egypt and Britain. It is the great wine of the late Roman world."
