l_english:
 adony_desc: "Pannonia gave the legions their hardest recruits and the Empire its soldier-emperors, from Probus of Sirmium to Valentinian of Cibalae. Its villages still send their sons to the army."
 alessandria_desc: "The Po plain is good grain land, but its land tax is paid in kind. Carts of wheat go to the state granaries for the court and the armies of the Alpine frontier, and much of the harvest never reaches the market."
 beja_TUN_desc: "The wheat fields of the Bagradas valley and Byzacena are among the richest in the Mediterranean. Their grain is paid as tax and shipped from Carthage to feed Rome."
