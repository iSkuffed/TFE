l_english:
 cannons: "Siege Equipment"
 cannons_desc: "Siege weapons have existed since antiquity: onagri, ballistae and rams. The ability to throw bigger projectiles at greater speed and distances will make all but the sturdiest of fortifications fall before them, and they can also be turned on armies in the field."
 cannon_maker: "Siege Workshop"
 cannon_maker_desc: "A guild specialized in building and assembling siege engines. These powerful weapons are essential for sieges and defense."
 cannon_workshop: "Siege Engineers"
 cannon_workshop_desc: "The ever-increasing demand of engines for our armies requires us to increase the capabilities of the $cannons$ production."
 cannon_foundry: "Siege Foundry"
 cannon_foundry_desc: "In a $cannon_foundry$ the metal fittings of siege engines are cast and assembled from molten metal. Key for equipping armies with engines, enhancing a state's military capabilities."
 cannons_factory: "Arsenal"
 cannons_factory_desc: "A large state workshop where siege engines are built in bulk. Its expanded production capacity is a great way to facilitate the growing needs of our military forces."
 a_handgonners: "Plumbatarii"
 a_handgonners_desc: "Foot soldiers who hurl weighted darts in a storm before the lines meet, as the legions of Illyricum did."
 a_early_arquebusiers: "Sagittarii"
 a_early_arquebusiers_desc: "Archers drawn up behind a screen of spearmen, who loose volley after volley over their heads."
 a_arquebusiers: "Heavy Sagittarii"
 a_arquebusiers_desc: "A drilled corps of archers sheltered by a wall of armoured spearmen: a formidable body that cannot be easily countered."
 a_musketeers: "Scutati"
 a_musketeers_desc: "Shield-bearers in close order, who hold the line with spear and sword and break the enemy's charge."
 a_fusiliers: "Heavy Scutati"
 a_fusiliers_desc: "Veteran shield-bearers in mail, trained to march and strike as one body."
 a_grenadiers: "Plumbatarii Veterani"
 a_grenadiers_desc: "Picked men who throw their darts furthest and hardest, and lead the assault on a breach."
 a_hunters: "Exculcatores"
 a_hunters_desc: "Skirmishers who scout ahead of the army and harass the enemy from cover."
 a_sharpshooters: "Heavy Exculcatores"
 a_sharpshooters_desc: "Skirmishers chosen for their eye, who pick off officers and gunners, slingers and archers at a distance."
 a_men_at_arms: "Armoured Foot"
 a_men_at_arms_desc: "Heavy infantry in mail and helmet who stand in the line with spear and sword."
 a_halberdiers: "Axemen"
 a_halberdiers_desc: "Infantry with long-hafted axes, who cut through shields and armour and drag riders from the saddle."
 a_pikemen: "Lanciarii"
 a_pikemen_desc: "Foot soldiers with long spears who stand against cavalry in a dense, bristling line."
 a_matchlock_levy: "Javelin Levy"
 a_matchlock_levy_desc: "Levies armed with javelins and little else, who hurl them at the enemy and run."
 a_flintlock_levy: "Heavy Levy"
 a_flintlock_levy_desc: "Levies with spear and shield, drilled enough to stand in a battle line."
 a_conscripts: "Tirones"
 a_conscripts_desc: "Recruits levied by law, who serve for the campaign under the standards of the army."
 a_pistoleers: "Cataphracti"
 a_pistoleers_desc: "Horsemen in scale armour on armoured horses, who charge with lance and mace."
 a_cuirassiers: "Clibanarii"
 a_cuirassiers_desc: "The heaviest horse: riders and mounts sheathed in iron, who ride down infantry."
 a_light_dragoons: "Equites Sagittarii"
 a_light_dragoons_desc: "Light horse who shoot from the saddle and fall back, and ride down a broken enemy."
 a_hussars: "Illyriciani"
 a_hussars_desc: "Light horse raised in Illyricum, quick to scout and to raid."
 a_gallop_cavalry: "Equites Mauri"
 a_gallop_cavalry_desc: "Moorish riders who gallop at the enemy with javelins and swing away."
 a_gendarmerie: "Scholae"
 a_gendarmerie_desc: "Household horsemen of the palace, picked from the best families and paid to stand before the emperor."
 a_late_cavaliers: "Late Equites"
 a_late_cavaliers_desc: "Mounted gentlemen in good armour, who fight as the army's horse."
 a_cavaliers: "Equites"
 a_cavaliers_desc: "Mounted gentlemen who serve with their own horses and arms."
 a_plated_knights: "Plated Horse"
 a_plated_knights_desc: "Heavy horse in plate over mail, the strongest charge the age knows."
 a_mailed_knights: "Mailed Horse"
 a_mailed_knights_desc: "Horse in mail and helmet, who fight with lance and sword."
 a_order_knights: "Sacred Horse"
 a_order_knights_desc: "Horsemen sworn to defend the faith and its shrines, who fight with a zeal that others lack."
 a_order_knights_2: "Holy Horse"
 a_order_knights_2_desc: "A sworn brotherhood of heavy horse, who answer to their master and to the Church."
 a_winged_hussars: "Winged Cataphracts"
 a_winged_hussars_desc: "Heavy lancers with wings of feathers on their backs, who thunder through the enemy line."
 a_late_winged_hussars: "Late Winged Cataphracts"
 a_late_winged_hussars_desc: "Heavy lancers, now better armed and drilled, whose charge breaks any line."
 a_banner_cavalry: "Vexillation Cavalry"
 a_banner_cavalry_desc: "Horse of the standing detachments, who ride under their own banners."
 a_hungarian_hussars: "Pannonian Light Horse"
 a_hungarian_hussars_desc: "Light horse of the Pannonian plain, wheeling and skirmishing from a distance."
 a_serbian_hussars: "Balkan Light Horse"
 a_serbian_hussars_desc: "Light horse of the Balkan hills, quick on any ground."
 a_austrian_grenzhussar: "Border Light Horse"
 a_austrian_grenzhussar_desc: "Light horse raised from the border colonists, who patrol the frontier and raid beyond it."
 a_hakkapelitta: "Northern Horse"
 a_hakkapelitta_desc: "Horsemen of the north, who charge fast and hit hard with the sword."
 a_lanzas_de_castilla: "Iberian Lancers"
 a_lanzas_de_castilla_desc: "Lancers of the Iberian plateau, who fight with lance and javelin."
 a_akinji: "Border Raiders"
 a_akinji_desc: "Irregular horse who raid ahead of the army and burn the enemy's fields."
 a_muslim_riders_vijay: "Armoured Riders"
 a_muslim_riders_vijay_desc: "Mounted spearmen and swordsmen in mail, who serve the rulers of the south."
 a_light_jurchen_cavalry: "Light Steppe Cavalry"
 a_light_jurchen_cavalry_desc: "Light horse of the northern steppe, who shoot from the saddle."
 a_iron_pagoda_cavalry: "Iron Cavalry"
 a_iron_pagoda_cavalry_desc: "Heavy horse in iron armour from head to hoof."
 a_light_camelry_4: "Camel Skirmishers"
 a_light_camelry_4_desc: "Riders on camels who throw javelins and wheel away across the sand."
 a_light_camelry_6: "Dromedarii"
 a_light_camelry_6_desc: "Camel-borne troops, as the Roman army has long raised on the desert frontier."
 a_heavy_camelry_6: "Camel Cataphracts"
 a_heavy_camelry_6_desc: "Armoured riders on armoured camels, who charge through the enemy line."
 a_houfnice: "Onagri"
 a_houfnice_desc: "Torsion catapults that hurl stones at walls and massed ranks."
 a_chambered_cannon: "Ballistae"
 a_chambered_cannon_desc: "Great bolt-throwers that shoot heavy bolts to break men and walls."
 a_falconet: "Carroballistae"
 a_falconet_desc: "Light bolt-throwers on carts, which move with the army and shoot on the march."
 a_royal_mortar: "Heavy Onagri"
 a_royal_mortar_desc: "The largest catapults, which throw great stones high over the walls."
 a_flying_battery: "Mobile Ballistae"
 a_flying_battery_desc: "Bolt-throwers on light carts that follow the army and are set up in a moment."
 a_red_cannon: "Great Onager"
 a_red_cannon_desc: "A huge engine of a famous founder, which brings down towers with a single stone."
 a_cetbang_cannon: "Scorpiones"
 a_cetbang_cannon_desc: "Small bolt-throwers carried by the army, which pick off men on the walls."
 a_byz_helepolis_cannon_unit: "Helepolis"
 a_byz_helepolis_cannon_unit_desc: "A great tower of timber on wheels, from which engines and archers command the wall."
 a_hwacha: "Polybolos"
 a_hwacha_desc: "A repeating bolt-thrower that shoots a rain of bolts one after another."
 a_feudal_levy: "Provincial Levies"
 a_feudal_levy_desc: "Farmers and herders raised by the local lord, who bring what weapons they have."
 a_crusader_knights: "Holy Spearmen"
 a_crusader_knights_desc: "Spearmen sworn to the defence of the faith, who stand in the line beside the horse."
 a_late_crusader_knights: "Veteran Holy Spearmen"
 a_late_crusader_knights_desc: "Seasoned spearmen of a sworn brotherhood, who have stood in many a battle."
 a_schiltron: "Spear Circle"
 a_schiltron_desc: "Spearmen in a tight ring, spears levelled outward, who hold against any charge."
 a_almogavars: "Hill Skirmishers"
 a_almogavars_desc: "Hardy highlanders who fight with javelins and short swords and fear no horse."
 a_late_almogavars: "Veteran Hill Skirmishers"
 a_late_almogavars_desc: "Highlanders grown into a corps, whose assault wins battles."
 a_catalan_crossbowmen: "Western Crossbowmen"
 a_catalan_crossbowmen_desc: "Crossbowmen of the western coasts, who shoot from behind their shields."
 a_navarrese_crossbowmen: "Pyrenean Crossbowmen"
 a_navarrese_crossbowmen_desc: "Crossbowmen of the Pyrenean valleys, who ambush from the passes."
 a_genoese_crossbowmen: "Italian Crossbowmen"
 a_genoese_crossbowmen_desc: "Professional crossbowmen of the Italian ports, hired by every prince."
 a_early_longbowmen: "War Archers"
 a_early_longbowmen_desc: "Archers with heavy bows, who shoot down charging horse at long range."
 a_longbowmen: "Heavy War Archers"
 a_longbowmen_desc: "Archers with the great bow, whose arrows pierce even mail."
 a_late_longbowmen: "Veteran War Archers"
 a_late_longbowmen_desc: "Seasoned archers, who loose volleys that darken the sky."
 a_hobelars: "Light Horse"
 a_hobelars_desc: "Light horsemen on small nimble ponies, used to scout and to raid."
 a_gallowglass: "Axe Warriors"
 a_gallowglass_desc: "Heavy axe-bearing mercenaries, who fight in mail and hold the line."
 a_reformed_gallowglass: "Veteran Axe Warriors"
 a_reformed_gallowglass_desc: "Axe-bearing warriors, drilled into a standing body."
 a_late_gallowglass: "Elite Axe Warriors"
 a_late_gallowglass_desc: "The pick of the axe-bearers, who break shield-walls and break them again."
 a_wagenburg: "Carrago"
 a_wagenburg_desc: "A ring of wagons, behind which archers and spearmen shelter, as the peoples of the steppe have long done."
 a_byzantine_cataphracts: "Roman Cataphracts"
 a_byzantine_cataphracts_desc: "Heavily armoured horsemen of the eastern army, who charge in a wedge behind their lances."
 a_byzantine_cataphracts_2: "Late Roman Cataphracts"
 a_byzantine_cataphracts_2_desc: "Armoured horsemen with lance and bow, the shock troops of the eastern army."
 a_varangians: "Excubitors"
 a_varangians_desc: "Guards of the palace, chosen for their size and loyalty."
 a_varangians_2: "Veteran Excubitors"
 a_varangians_2_desc: "Palace guards who have seen the emperor's wars."
 a_varangians_3: "Axe-Bearing Excubitors"
 a_varangians_3_desc: "Palace guards who carry the heavy axe, to cut through any line."
 a_varangians_4: "Heavy Excubitors"
 a_varangians_4_desc: "Guards in mail and helmet, who fight beside the emperor."
 a_varangians_5: "Imperial Excubitors"
 a_varangians_5_desc: "The emperor's own guard, drilled to a fine edge."
 a_varangians_6: "Imperial Excubitor Guard"
 a_varangians_6_desc: "The finest guard in the world, armed and paid beyond all others."
 a_hafsid_ghulam: "Ifriqiyan Ghulam"
 a_hafsid_ghulam_desc: "Slave-soldiers of the African governors, loyal to their master alone."
 a_zayyanid_ghulam: "Maghribi Ghulam"
 a_zayyanid_ghulam_desc: "Slave-soldiers of the western governors, bought young and trained for the household."
 a_the_black_army: "Pannonian Veterans"
 a_the_black_army_desc: "A standing army of professionals, paid by the crown and kept at arms."
 a_landsknechte: "Germanic Foot"
 a_landsknechte_desc: "Mercenary foot from the German forests, with long spears and a taste for plunder."
 a_reislaufer: "Alpine Spearmen"
 a_reislaufer_desc: "Spearmen of the high valleys, hired out to any prince who pays."
 a_florentine_citizen_militia: "Citizen Militia"
 a_florentine_citizen_militia_desc: "Townsmen who take up arms to defend their walls."
 a_andalusi_arquebusiers: "Andalusi Skirmishers"
 a_andalusi_arquebusiers_desc: "Skirmishers of the southern Iberian cities, who harass the enemy with javelins and bows."
 a_algiers_ojaq_janissaries: "Garrison Guards"
 a_algiers_ojaq_janissaries_desc: "A corps of professional garrison troops in the coastal cities."
 a_iron_helmet_musketeers: "Iron-Helmet Spearmen"
 a_iron_helmet_musketeers_desc: "Spearmen in iron helmets, who stand in a drilled line."
 a_pontifical_swiss_guard: "Papal Guard"
 a_pontifical_swiss_guard_desc: "The pope's own guard, in the bishop's service for life."
 a_tercio: "Mixed Phalanx"
 a_tercio_desc: "A great square of spearmen and archers, which fights in every direction."
 a_saxon_defensioner: "Frontier Defenders"
 a_saxon_defensioner_desc: "Peasant-soldiers who hold the frontier forts against raiders."
 a_hesse_jager: "Chattian Skirmishers"
 a_hesse_jager_desc: "Skirmishers of the Chatti forests, who hunt men as they hunt game."
 a_gebirgsschutzen_infantry: "Mountain Skirmishers"
 a_gebirgsschutzen_infantry_desc: "Skirmishers of the high passes, who strike from above and vanish."
 a_subsaharan_musketeer_corps: "Sub-Saharan Spearmen"
 a_subsaharan_musketeer_corps_desc: "Spearmen of the savanna kingdoms, who fight in drilled bands."
 a_caroleans: "Northern Guard"
 a_caroleans_desc: "A king's guard of the north, drilled to fight as one."
 a_scottish_highlander: "Highland Warriors"
 a_scottish_highlander_desc: "Warriors of the northern hills, who charge screaming with sword and shield."
 a_tofangchi: "Persian Archers"
 a_tofangchi_desc: "Archers of the Persian king's army, who shoot in volleys from behind the front."
 a_tupchi: "Persian Engineers"
 a_tupchi_desc: "Engineers who tend the king's siege engines and serve them in battle."
 a_prussian_grenadiers: "Frontier Plumbatarii"
 a_prussian_grenadiers_desc: "Tall dart-throwers of the northern marches, drilled to the highest standard."
 a_bavarian_jager: "Bavarian Skirmishers"
 a_bavarian_jager_desc: "Skirmishers of the Bavarian forests, in loose order and quick on foot."
 a_hajduk: "Balkan Raiders"
 a_hajduk_desc: "Outlaw bands of the Balkan hills, who serve whoever pays."
 a_redcoats: "Island Spearmen"
 a_redcoats_desc: "Spearmen of the far island, drilled and disciplined above all others."
 a_experimental_riflemen: "Veteran Skirmishers"
 a_experimental_riflemen_desc: "Skirmishers trained in new ways of fighting, and trusted to act alone."
 a_cacadores: "Lusitanian Skirmishers"
 a_cacadores_desc: "Light infantry of the Atlantic coast, who fight in open order."
 a_gurkha: "Hill Warriors"
 a_gurkha_desc: "Hardy hillmen who fight with the heavy knife and the spear."
 a_jazayerchi: "Persian Spearmen"
 a_jazayerchi_desc: "Spearmen of the Persian king's guard, in drilled ranks."
 a_pandur: "Balkan Foot"
 a_pandur_desc: "Irregular infantry of the Balkan villages, raised for a campaign."
 a_austrian_grenzer: "Border Infantry"
 a_austrian_grenzer_desc: "Infantry settled along the frontier in return for service, who guard it for the crown."
 a_renaissance_conquistadors: "Adventurers"
 a_renaissance_conquistadors_desc: "Armoured fortune-seekers who march into unknown lands for gold."
 a_discovery_conquistadors: "Veteran Adventurers"
 a_discovery_conquistadors_desc: "Hardened adventurers who have won lands and wealth by the sword."
 a_a_urughs: "Camp Guards"
 a_a_urughs_desc: "Warriors who guard the chief's camp and its herds."
 a_logistics_corps: "Annona Corps"
 a_logistics_corps_desc: "Officers and wagoners of the grain supply, who keep an army fed on the march."
 a_discovery_cawa: "Ç̌äwa Archers"
 a_discovery_cawa_desc: "Ç̌äwa warriors who fight with the bow."
 a_reformation_cawa: "Ç̌äwa Spearmen"
 a_reformation_cawa_desc: "Ç̌äwa warriors who fight with spear and shield."
 a_absolutism_cawa: "Ç̌äwa Shieldmen"
 a_absolutism_cawa_desc: "Ç̌äwa warriors drilled to hold a wall of shields."
 a_revolutions_cawa: "Ç̌äwa Veterans"
 a_revolutions_cawa_desc: "Ç̌äwa warriors hardened by a century of war."
 a_renaissance_janissaries: "Household Guards"
 a_renaissance_janissaries_desc: "Slave-soldiers raised in the ruler's household, loyal to him alone."
 a_discovery_janissaries: "Household Archers"
 a_discovery_janissaries_desc: "Household soldiers trained as archers, who shoot in volleys."
 a_reformation_janissaries: "Household Spearmen"
 a_reformation_janissaries_desc: "Household soldiers with spear and shield, who hold the line."
 a_absolutism_janissaries: "Household Shieldmen"
 a_absolutism_janissaries_desc: "Household soldiers drilled in a wall of shields."
 a_revolutions_janissaries: "Household Veterans"
 a_revolutions_janissaries_desc: "Household soldiers who have fought a hundred battles."
 a_discovery_qizilbash: "Persian Skirmishers"
 a_discovery_qizilbash_desc: "Light horse of the Persian tribes, who skirmish and harass."
 a_reformation_qizilbash: "Persian Cavalry"
 a_reformation_qizilbash_desc: "Horse of the Persian tribes, the backbone of the king's army."
 n_cog: "Corbita"
 n_cog_desc: "A broad merchant ship with a deep hold, the workhorse of every harbour."
 n_early_carrack: "Round Ship"
 n_early_carrack_desc: "A beamy sailing ship built to carry cargo and little else."
 n_carrack: "Navis Oneraria"
 n_carrack_desc: "A large sailing ship that carries grain and soldiers over long voyages."
 n_hulk: "Heavy Corbita"
 n_hulk_desc: "A heavy merchant ship with a wide hull, which carries a great cargo."
 n_galleon: "Great Dromon"
 n_galleon_desc: "The largest oared and sailed warship, with several banks of oars and a crew of fighters."
 n_war_galleon: "Ousiakos"
 n_war_galleon_desc: "A big warship of the fleets, with a crew of marines and a siphon for fire."
 n_twodecker: "Bireme"
 n_twodecker_desc: "A warship with two banks of oars."
 n_threedecker: "Trireme"
 n_threedecker_desc: "A warship with three banks of oars, the pride of any fleet."
 n_ship_of_the_line: "Pamphylos"
 n_ship_of_the_line_desc: "The largest warship of the fleet, with hundreds of oarsmen and a fighting platform."
 n_barque: "Lusoria"
 n_barque_desc: "A light, quick river and coastal patrol boat."
 n_caravel: "Dromon"
 n_caravel_desc: "A fast oared and sailed warship, the main ship of the fleets."
 n_pinnace: "Scapha"
 n_pinnace_desc: "A small oared boat used as a scout and a tender."
 n_frigate: "Liburna"
 n_frigate_desc: "A light, fast warship with a single bank of oars, built for scouting and pursuit."
 n_heavy_frigate: "Heavy Liburna"
 n_heavy_frigate_desc: "A larger liburna, with more oars and a stronger ram."
 n_flute: "Chelandion"
 n_flute_desc: "A large oared ship with a ramp, which carries horses and men to war."
 n_brig: "Lembus"
 n_brig_desc: "A small, fast ship used for carrying messages and cargo."
 n_merchantman: "Navis Mercatoria"
 n_merchantman_desc: "A merchant ship built to carry a hold of goods across the sea."
 n_eastindiaman: "Grain Ship"
 n_eastindiaman_desc: "A giant merchant ship that carries the grain of Egypt to the capital."
 n_galleass: "Heavy Galley"
 n_galleass_desc: "A large galley with heavy fighting platforms and many oars."
 n_xebec: "Hemiolia"
 n_xebec_desc: "A fast light galley with a pair of sails and a bank and a half of oars."
 n_catalan_galley: "Western Galley"
 n_catalan_galley_desc: "A galley of the western Mediterranean, built for raiding and trade."
 n_early_iberian_caravel: "Atlantic Lusoria"
 n_early_iberian_caravel_desc: "A light ship built for the Atlantic swell."
 n_iberian_caravel: "Atlantic Dromon"
 n_iberian_caravel_desc: "A fast ship that sails closer to the wind than any other."
 n_square_rigged_caravel: "Square-Rigged Lusoria"
 n_square_rigged_caravel_desc: "A light ship with square sails, quick before the wind."
 n_early_iberian_galleon: "Atlantic Oneraria"
 n_early_iberian_galleon_desc: "A broad ship built to carry cargo through the Atlantic swell."
 n_iberian_galleon: "Atlantic Great Dromon"
 n_iberian_galleon_desc: "A large warship with a high deck, built to ride out the ocean."
 n_genoese_galley: "Ligurian Galley"
 n_genoese_galley_desc: "A galley of the Ligurian coast, built for trade and war."
 n_hanseatic_cog: "Northern Cargo Ship"
 n_hanseatic_cog_desc: "A tubby northern ship that carries bulk goods along the coast."
 n_barbary_fusta: "Moorish Galley"
 n_barbary_fusta_desc: "A fast galley of the African coast, used by raiders and traders alike."
 n_early_turtle_ship: "Armoured Galley"
 n_early_turtle_ship_desc: "A galley with a roof of iron plates, hard to board."
 n_turtle_ship: "Great Armoured Galley"
 n_turtle_ship_desc: "A large armoured galley, with a spiked roof and many oars."
 n_panokseon: "Heavy Warship"
 n_panokseon_desc: "A tall oared warship with fighting decks."
 n_atakebune: "Armoured Barge"
 n_atakebune_desc: "A big barge with armoured sides that carries archers and soldiers."
 n_sekibune: "Fast Galley"
 n_sekibune_desc: "A fast galley with a single bank of oars, built to raid."
 n_baochuan: "Great Junk"
 n_baochuan_desc: "A giant junk with many masts and decks."
 n_cakradonya: "Heavy Prau"
 n_cakradonya_desc: "A big prau with a fighting deck, used by the sea-raiders."
 n_galiot: "Light Galley"
 n_galiot_desc: "A small galley with a single bank of oars, quick and handy."
 n_maghrebi_galiot: "Maghrebi Light Galley"
 n_maghrebi_galiot_desc: "A light galley of the African coast, quick and handy."
 n_maghrebi_xebec: "Maghrebi Hemiolia"
 n_maghrebi_xebec_desc: "A fast African galley with a pair of sails and a bank and a half of oars."
 n_baghlah: "Great Dhow"
 n_baghlah_desc: "A large dhow of the Arabian coast, which carries cargo and soldiers across the sea."
 n_bomb_ketch: "Fireship"
 n_bomb_ketch_desc: "A ship fitted with siphons and pots of fire, to burn the enemy's fleet."
 n_archipelago_frigate: "Island Liburna"
 n_archipelago_frigate_desc: "A light warship built for the narrow island channels."
 gravel_road: "Track"
 gravel_road_desc: "The [road|e] is a beaten track of gravel and earth. Better than mud."
 paved_road: "Paved Road"
 paved_road_desc: "The [road|e] has a solid paved surface which is much better for travel."
 modern_road: "Military Road"
 modern_road_desc: "The [road|e] is a cambered road of laid stone, built for the march of armies."
 railroad: "Via Publica"
 railroad_desc: "The [road|e] is a great stone highway with kerbs, drains and milestones, massively increasing travel speed and logistics."
