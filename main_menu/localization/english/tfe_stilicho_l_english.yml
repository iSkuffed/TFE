l_english:
 tfe_stilicho.1.title: "Olympius Whispers"
 tfe_stilicho.1.desc: "Olympius, a palace official from the Black Sea coast, has the Emperor's ear at Ravenna. He tells Honorius that the army cheers Stilicho's name louder than his own, that Stilicho's son is promised to the Emperor's sister, and that a regent's chair has never yet been enough for a man the soldiers love.\n\nHonorius says nothing. He has started asking who commands the palace guard."
 tfe_stilicho.1.a: "Let him talk"
 tfe_stilicho.2.title: "The Emperor's Suspicion"
 tfe_stilicho.2.desc: "The court has split. Olympius and his friends say Stilicho means to put Eucherius in the purple, and the Emperor half believes them. The officers say Stilicho alone has held the Rhine and the Alps, and that the West will not outlive him.\n\nHonorius has asked where we stand."
 tfe_stilicho.2.a: "Stand with Stilicho"
 tfe_stilicho.2.b: "Stand with the Emperor"
 tfe_stilicho.3.title: "Stilicho Crowned"
 tfe_stilicho.4.title: "Stilicho Enters [tfe_honorius_seat.GetName]"
 tfe_stilicho.4.desc: "The gates are open. Honorius's guards laid down their arms when they saw who led the column, and the palace officials are already drafting the proclamations in Stilicho's name. The West has one master again.\n\nHonorius waits in the palace to learn what he is now."
 tfe_stilicho.4.a: "Honorius dies"
 tfe_stilicho.4.b: "Send him to his brother"
 tfe_stilicho.4.c: "The West is ours"
 tfe_stilicho.1.a.tt: "At #Y 100#! Glory, or if it is still high enough in a year's time, Honorius will force a choice."
 tfe_stilicho_glory_70_tt: "Stilicho's Glory is at least #Y 70#!"
 tfe_stilicho_holds_gaul_tt: "We hold land in Gaul, or in Hispania with Glory at #Y 90#! or more"
 tfe_stilicho.2.a.tt: "Stilicho's army rises in Gaul, and in Hispania too if his Glory is #Y 90#! or more. #Y We follow him#!: he becomes our ruler, at war with Honorius, who keeps Italy and the Imperium Romanum. Britain and Africa break away. Take Honorius's capital to win the West."
 tfe_stilicho.2.b.tt: "Stilicho and his son Eucherius are put to death. Olympius becomes regent. Stability #R -50#!, the estates grow restless, and Stilicho's Glory is gone."
 tfe_unity_up_20_tt: "[tfe_roman_unity|E]: #G +20#!"
 tfe_stilicho.4.a.tt: "Honorius is put to death. No rival Augustus is left in the West, but the East is appalled."
 tfe_stilicho.4.b.tt: "Honorius goes to Constantinople, to live at the Eastern court."
 AUTO_MODIFIER_NAME_tfe_stilicho_regency: "Stilicho's Command"
 AUTO_MODIFIER_DESC_tfe_stilicho_regency: "The Magister Militum commands the West's armies. The army is his and the great houses follow him."
 AUTO_MODIFIER_NAME_tfe_glory_discredited: "Stilicho Discredited"
 AUTO_MODIFIER_DESC_tfe_glory_discredited: "Nobody at court defends Stilicho any more, and the soldiers have stopped cheering his name."
 AUTO_MODIFIER_NAME_tfe_glory_wanes: "Confidence Wanes"
 AUTO_MODIFIER_DESC_tfe_glory_wanes: "Every defeat is laid at Stilicho's door, and the court counts them."
 AUTO_MODIFIER_NAME_tfe_glory_rises: "Stilicho's Star Rises"
 AUTO_MODIFIER_DESC_tfe_glory_rises: "The legions believe in their general, and recruits come in to serve under him."
 AUTO_MODIFIER_NAME_tfe_glory_idol: "Idol of the Army"
 AUTO_MODIFIER_DESC_tfe_glory_idol: "The soldiers would follow Stilicho anywhere, even against the Emperor. Honorius knows it."
 AUTO_MODIFIER_NAME_tfe_olympius_regency: "Olympius's Regency"
 AUTO_MODIFIER_DESC_tfe_olympius_regency: "The official who brought Stilicho down rules for Honorius. Nobody trusts him, and he trusts nobody."
 tfe_stilicho_brought_down: "Rid the West of Stilicho"
 tfe_honorius_executed: "Put Honorius to death"
 TFE_STILICHO: "Stilicho's West"
 TFE_STILICHO_ADJ: "Stilichonian"
 TFE_AFRICA: "Diocese of Africa"
 TFE_AFRICA_ADJ: "African"
 tfe_stilicho_rebels: "Stilicho's Army"
 tfe_stilicho_rebels_country: "Stilicho's West"
 tfe_stilicho_rebels_country_adjective: "Stilichonian"
