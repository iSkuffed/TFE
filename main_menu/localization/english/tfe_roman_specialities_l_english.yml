l_english:
 STATIC_MODIFIER_NAME_tfe_sidonian_purple: "Sidonian Purple"
 STATIC_MODIFIER_DESC_tfe_sidonian_purple: "The murex dye of Sidon and Tyre, which only the emperor may wear whole."
 STATIC_MODIFIER_NAME_tfe_baetican_oil: "Baetican Oil"
 STATIC_MODIFIER_DESC_tfe_baetican_oil: "The olive oil of Baetica, shipped to Rome for the annona."
 STATIC_MODIFIER_NAME_tfe_falernian_wine: "Falernian Wine"
 STATIC_MODIFIER_DESC_tfe_falernian_wine: "The most famous vintage of Italy, from the Falernian slopes of Campania."
 STATIC_MODIFIER_NAME_tfe_gazan_wine: "Wine of Gaza"
 STATIC_MODIFIER_DESC_tfe_gazan_wine: "Gaza's white wine, carried in its own jars to every shore of the Empire."
 STATIC_MODIFIER_NAME_tfe_noric_steel: "Noric Steel"
 STATIC_MODIFIER_DESC_tfe_noric_steel: "Ferrum Noricum, the hard iron of Noricum that arms the legions."
 STATIC_MODIFIER_NAME_tfe_cappadocian_studs: "Cappadocian Stud Farms"
 STATIC_MODIFIER_DESC_tfe_cappadocian_studs: "The emperor's own horse farms on the Cappadocian plateau."
 STATIC_MODIFIER_NAME_tfe_dumnonian_tin: "Dumnonian Tin"
 STATIC_MODIFIER_DESC_tfe_dumnonian_tin: "The tin streams of the Dumnonii in the far west of Britain."
 STATIC_MODIFIER_NAME_tfe_frankincense: "Frankincense of Arabia Felix"
 STATIC_MODIFIER_DESC_tfe_frankincense: "The incense of the Dhofar hills, burned in every temple and church."
