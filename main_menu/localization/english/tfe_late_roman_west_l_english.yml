l_english:
 tfe_senatorial_immunities: "Senatorial Immunities"
 tfe_senatorial_immunities_desc: "The clarissimi are spared the sordid burdens, their arrears are remitted by every new emperor, and their estates are never entered on the census at their true worth. The land tax falls on everyone else."
 tfe_patrocinium: "Patrocinium"
 tfe_patrocinium_desc: "The coloni shelter under a great landlord. He hides them from the recruiting officer and pays gold in their place, so the legions must be filled with barbarians."


 AUTO_MODIFIER_NAME_tfe_comitatenses: "Comitatenses"
 AUTO_MODIFIER_DESC_tfe_comitatenses: "The field armies of the West are paid professionals, drilled and kept under arms in peace and war."

 STATIC_MODIFIER_NAME_tfe_granary_of_rome: "Granary of Rome"
 STATIC_MODIFIER_DESC_tfe_granary_of_rome: "Africa's wheat fills the annona of Rome. Every field that can be sown is sown."
 STATIC_MODIFIER_NAME_tfe_pannonian_recruiting_grounds: "Pannonian Recruiting Grounds"
 STATIC_MODIFIER_DESC_tfe_pannonian_recruiting_grounds: "The Danube provinces gave the legions their best recruits and most of their emperors."

 tfe_hadrians_wall: "Hadrian's Wall"
 tfe_hadrians_wall_desc: "Eighty Roman miles of stone from the Tyne to the Solway, with a fort every few miles and a milecastle at every mile. Nobody crosses into Britannia without the garrison knowing."
 tfe_limes: "Limes"
 tfe_limes_desc: "The frontier of the Empire: forts on the river bank and along the desert roads, watchtowers between them and the limitanei who hold them. Raiders who cross the Rhine, the Danube or the Euphrates must first get past them."
 STATIC_MODIFIER_NAME_tfe_latifundia: "Latifundia"
 STATIC_MODIFIER_DESC_tfe_latifundia: "The great villas turned the grain fields over to vines and herds. The dole feeds Rome with African bread, so there is little profit in growing Italian wheat."
 STATIC_MODIFIER_NAME_tfe_annona_militaris: "Annona Militaris"
 STATIC_MODIFIER_DESC_tfe_annona_militaris: "The land tax is paid in grain, gathered into the state granaries for the court and army at Milan. Much of the harvest never reaches the market."
