 STATIC_MODIFIER_NAME_tfe_fled_to_the_host: "Fled to the Host"
 STATIC_MODIFIER_DESC_tfe_fled_to_the_host: "When the host came, the town's young men went over to it. Among the barbarians there was no tax collector and no landlord, and \"they would rather live free under a show of captivity than be captives under a show of liberty\" (Salvian)."
