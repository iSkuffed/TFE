l_english:
 tfe_foederati: "Foederati"
 tfe_foederati_desc: "Foederati are a people sworn by treaty, a foedus, to fight for an Augustus. They pay no tribute: the Empire pays them the annona, and they march in all of its wars. The foedus binds two rulers, not two peoples, and lapses when either of them dies."
 tfe_foederati_subject_opinion: "Our Foedus Lord"
 tfe_foederati_overlord_opinion: "Our Foederati"
 tfe_foederati.1.title: "The Oath Is Dead"
 tfe_foederati.1.desc: "Our foedus was sworn between two men, not two peoples, and one of them is dead. The annona still comes, for now, but nothing binds us to [tfe_foedus_lord.GetName] any longer. We may swear the oath anew to the living, or take by the sword what the dead promised us."
 tfe_foederati.1.a: "Swear the oath anew"
 tfe_foederati.1.b: "Take what was promised"
 cb_tfe_foedus_broken: "Broken Foedus"
 cb_tfe_foedus_broken_desc: "The foedus died with the man who swore it. Now the Empire will pay what it owes in land."
 OFFER_tfe_foederati_TOOLTIP_HEADER: "Offer [TARGET_COUNTRY.GetName] a foedus"
 OFFER_tfe_foederati_TOOLTIP_HEADER_NO_TARGET: "Offer a [country|e] a foedus"
 CANCEL_tfe_foederati_TOOLTIP_HEADER: "Break the foedus with [TARGET_COUNTRY.GetName]"
 CANCEL_tfe_foederati_TOOLTIP_HEADER_NO_TARGET: "Break the foedus with a [country|e]"
 OFFER_tfe_foederatiTITLE: "Offer a Foedus"
 OFFER_tfe_foederati_FLAVOR: "Choose a [country|e] to settle as [ShowSubjectTypeName('tfe_foederati')] on Roman soil"
 CANCEL_tfe_foederatiTITLE: "Break the Foedus"
 CANCEL_tfe_foederati_FLAVOR: "Choose a [country|e] to release from their [ShowSubjectTypeName('tfe_foederati')] oath"
 OFFER_tfe_foederati_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
 CANCEL_tfe_foederati_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
 OFFER_tfe_foederati_NEWDESC: "Do we wish to offer [COUNTRY.GetName] a foedus?"
 CANCEL_tfe_foederati_NEWDESC: "Do we wish to break the foedus with [COUNTRY.GetName]?"
 OFFER_tfe_foederati_DESC: "They swear to serve the Augustus and march in Rome's wars; Rome pays them the annona."
 CANCEL_tfe_foederati_DESC: "Break the foedus with @[COUNTRY.GetFlag]! [COUNTRY.GetName]."
