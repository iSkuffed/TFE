l_english:
 tfe_sacrae_largitiones_bureaucracy: "Sacrae Largitiones"
 tfe_sacrae_largitiones_bureaucracy_desc: "The Sacred Largesses, the treasury of the Augusti: the mints, the mines, the gold-tax on traders and the stores that pay the army and the court. Well funded, its comites and their clerks gather what the provinces owe and keep the estates quiet about it. Starved of funds, its collectors turn to extortion and neglect, and the taxpayers learn to hide what they have."
 MODIFIER_TYPE_NAME_tfe_sacrae_largitiones_bureaucracy_impact_modifier: "$tfe_sacrae_largitiones_bureaucracy$ Impact"
 MODIFIER_TYPE_DESC_tfe_sacrae_largitiones_bureaucracy_impact_modifier: "How much [ShowBureaucracyTypeName('tfe_sacrae_largitiones_bureaucracy')] [bureaucracy|e] affects the [country|e]."
 tfe_magister_officiorum_bureaucracy: "Magister Officiorum"
 tfe_magister_officiorum_bureaucracy_desc: "The Master of Offices rules the scrinia, the palace guard and the imperial post, and with them the paper that binds a far-flung empire to its capital. Funded, orders reach the frontier before the season changes and the court's favour is worth spending. Neglected, the post runs late, petitions go unanswered and the provinces learn to govern themselves."
 MODIFIER_TYPE_NAME_tfe_magister_officiorum_bureaucracy_impact_modifier: "$tfe_magister_officiorum_bureaucracy$ Impact"
 MODIFIER_TYPE_DESC_tfe_magister_officiorum_bureaucracy_impact_modifier: "How much [ShowBureaucracyTypeName('tfe_magister_officiorum_bureaucracy')] [bureaucracy|e] affects the [country|e]."
 tfe_magister_peditum_bureaucracy: "Magister Peditum"
 tfe_magister_peditum_bureaucracy_desc: "The Master of Foot commands the infantry of the field army and the drill that keeps it a legion rather than a mob. His camps are costly to feed and to arm, but a funded command turns recruits into soldiers who hold the line. Left to rot, the drill lapses and pay falls behind, and the army remembers that it can be bought."
 MODIFIER_TYPE_NAME_tfe_magister_peditum_bureaucracy_impact_modifier: "$tfe_magister_peditum_bureaucracy$ Impact"
 MODIFIER_TYPE_DESC_tfe_magister_peditum_bureaucracy_impact_modifier: "How much [ShowBureaucracyTypeName('tfe_magister_peditum_bureaucracy')] [bureaucracy|e] affects the [country|e]."
