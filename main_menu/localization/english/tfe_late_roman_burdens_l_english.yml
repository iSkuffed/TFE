l_english:
 tfe_disarmed_plebs: "Disarmed Plebs"
 tfe_disarmed_plebs_desc: "Private arms are forbidden to the plebs, and the rod falls on the man who keeps a sword. The state fears its own peasants more than its enemies, so it fields no levy and leaves the fighting to paid professionals."
 tfe_disarmed_demos: "Disarmed Demos"
 tfe_disarmed_demos_desc: "The demos are forbidden weapons: the Emperor's laws are plain that the farmer holds the plough and the soldier holds the sword. Nobody will call up the peasants, so the East fields only paid professionals."
 tfe_debased_currency: "Debased Currency"
 tfe_debased_currency_desc: "The soldiers' stipend and donatives are owed in gold, and the copper and silver that buys it is worth less every year. The mint makes less, and men who are paid in bad coin fight badly."
 tfe_plebs: "Plebs"
 tfe_demos: "Demos"
