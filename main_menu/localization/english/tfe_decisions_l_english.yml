l_english:
 tfe_migrate: "Migrate into Rome"
 tfe_migrate_desc: "We leave the lands of our fathers behind. Every warrior of our people joins the host on the road, to take by the sword a richer home within the lands of Rome: the Empire across the river, or one far away, or a province that has thrown off its emperor."
 tfe_migrate_choose_rome: "Choose the Rome to march on"
 tfe_migrate_no_rome: "@trigger_no! No Roman state holds any land"
 tfe_migrate_choose_province: "Choose the province to take"
 tfe_migrate_no_province: "@trigger_no! It holds no province we could march on"
 tfe_migrate_tt: "#R We declare war at once on the Roman state we choose, to take the province we choose.#! Every great battle we win against Rome brings that war closer to its end, and the peace always gives us the province. Its ruler may offer us land for our fealty.\n#R If we lose, our people scatter and we are no more.#!"
 tfe_fall_of_the_west: "Fall of the West"
 tfe_illyricum_claims.title: "Support Stilicho's Claims"
 tfe_illyricum_claims.desc: "Stilicho holds that Theodosius meant all Illyricum for the West. Press the claim on Docleatae, the Dardanian Mines, the Margus Valley, Singidunum, Viminacium, Naissus, Dardania and Praevalitana: a casus belli against the East for ten years, bought with the Empire's unity."
 tfe_illyricum_claims.a: "Illyricum is the West's."
 tfe_debug_stilicho_glory.title: "(Debug) Stilicho's Glory to 100"
 tfe_debug_stilicho_glory.desc: "Testing only: raises Stilicho's Glory to 100, and Honorius forces the showdown."
 tfe_debug_stilicho_glory.a: "Glory to 100"
 tfe_stilicho_serves_us_tt: "Stilicho lives and serves us"
 tfe_illyricum_claim_pressed_tt: "We have not pressed Stilicho's claim in the last ten years"
